// ─── Link Advance to PO/Bill Modal ────────────────
function LinkAdvanceModal({ advance, onClose, pos, bills }) {
  const [linkedPO, setLinkedPO] = useState(advance.linkedPO || '');
  const [linkedBill, setLinkedBill] = useState(advance.linkedBill || '');
  const [adjustedAmount, setAdjustedAmount] = useState(String(advance.adjustedAmount || ''));
  const [saving, setSaving] = useState(false);

  function handleBillSelect(billDocId) {
    setLinkedBill(billDocId);
    if (billDocId && !adjustedAmount) {
      // Auto-fill with full advance balance
      const bal = Math.max(0, Number(advance.amount) - (Number(advance.adjustedAmount)||0));
      setAdjustedAmount(String(bal));
    }
  }

  async function handleSave() {
    setSaving(true);
    try {
      const adj = Number(adjustedAmount) || 0;
      const balance = Number(advance.amount) - adj;
      const status = adj === 0 ? 'Unadjusted' : balance <= 0 ? 'Fully Adjusted' : 'Partially Adjusted';

      // Update the advance record
      await updateAdvance(advance.docId, {
        linkedPO, linkedBill,
        adjustedAmount: adj, balanceAmount: Math.max(0, balance), status,
        adjustedAgainst: linkedBill || '',
      });

      // Update the linked bill: set advanceDeducted and payment date from advance
      if (linkedBill) {
        const { updateDoc, getDoc } = window.fb;
        try {
          const billSnap = await getDoc(userDoc(BILLS_COLLECTION, linkedBill));
          if (billSnap.exists()) {
            const b = billSnap.data();
            const baseAmt  = Number(b.amount||0);
            const gstAmt   = b.gstAmount !== undefined ? Number(b.gstAmount||0)
                           : (b.gstPct ? Math.round(baseAmt * parseFloat(b.gstPct)/100) : 0);
            const billTotal  = baseAmt + gstAmt;

            // Use advance's datePaid as the payment date for the bill; fall back to today
            // so schedule stages still get synced even if the advance has no datePaid set
            const advDate = advance.datePaid || b.due || new Date().toISOString().slice(0,10);

            // Accumulate by delta so multiple different advances linked to the same
            // bill add up correctly, and re-editing this same advance's link doesn't
            // double-count its own previous contribution.
            const prevAdjForThisAdvance = Number(advance.adjustedAmount||0);
            const newAdvanceDeducted = Math.max(0, Number(b.advanceDeducted||0) - prevAdjForThisAdvance + adj);
            const netPayable = Math.max(0, billTotal - newAdvanceDeducted);
            const isPaid     = netPayable <= 0;

            const billUpdate = {
              advanceDeducted: newAdvanceDeducted,
              linkedAdvance:   advance.docId,
              paid:            isPaid,
              paidAt:          isPaid ? Date.now() : null,
            };

            // Give this advance its own schedule stage, keyed by advance id, so it
            // never overwrites a stage created by a different advance linked to the
            // same bill — each stays individually dated for Statement/Cash Flow.
            if (advDate) {
              const existingStages = b.paymentSchedule || [];
              const withoutThisAdvance = existingStages.filter(s => s.linkedEntryId !== advance.docId);
              const stagePct = baseAmt>0 ? String(Math.round(adj/baseAmt*100)) : '';
              billUpdate.paymentSchedule = [...withoutThisAdvance, {
                id: 'adv-' + advance.docId.slice(0,8),
                stageType: 'Against Delivery', amount: String(adj), pct: stagePct,
                date: advDate, paid: true, paidAt: Date.now(), datePaid: advDate,
                linkedEntryId: advance.docId,
              }];
            }
            if (advDate) billUpdate.paidDate = advDate;

            await updateDoc(userDoc(BILLS_COLLECTION, linkedBill), billUpdate);
          }
        } catch(e) { console.warn('Could not update linked bill:', e.message); }
      }

      onClose();
    } catch(e) { console.error(e); alert('Could not update advance.'); }
    finally { setSaving(false); }
  }

  const balance = Number(advance.amount) - (Number(adjustedAmount) || 0);

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'var(--surface)',borderRadius:10,width:480,boxShadow:'0 8px 40px rgba(0,0,0,.22)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        <div style={{background:'var(--primary)',padding:'14px 18px'}}>
          <span style={{fontWeight:700,fontSize:14,color:'#fff'}}>Link Advance — {advance.vendor}</span>
        </div>
        <div style={{padding:'18px 20px'}}>
          <div style={{background:'var(--primary-50)',borderRadius:6,padding:'10px 12px',marginBottom:16,fontSize:12}}>
            <div className="flex justify-between"><span>Total Advance Paid</span><span className="amount fw-600">{inr(advance.amount||0)}</span></div>
            <div className="flex justify-between mt-1"><span>Adjusted so far</span><span className="amount">{inr(advance.adjustedAmount||0)}</span></div>
            <div className="flex justify-between mt-1 fw-600" style={{color:'var(--primary)'}}><span>Balance remaining</span><span className="amount">{inr(advance.balanceAmount||advance.amount||0)}</span></div>
          </div>
          <div className="form-group">
            <label className="form-label">Link to Purchase Order</label>
            <select className="form-input form-select" value={linkedPO} onChange={e=>setLinkedPO(e.target.value)}>
              <option value="">None</option>
              {(pos||[]).map(p=><option key={p.docId} value={p.po}>{p.po} — {p.vendorName} ({inr(p.value||0)})</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Link to Bill</label>
            <select className="form-input form-select" value={linkedBill} onChange={e=>handleBillSelect(e.target.value)}>
              <option value="">None</option>
              {(bills||[]).map(b=><option key={b.docId} value={b.docId}>{b.payee} — {b.invoiceNo||'no invoice'} — {inr(b.amount||0)}{b.paid?' (Paid)':''}</option>)}
            </select>
            {linkedBill && <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>
              Advance balance {inr(Math.max(0, Number(advance.amount)-(Number(advance.adjustedAmount)||0)))} will be auto-filled below
            </div>}
          </div>
          <div className="form-group">
            <label className="form-label">Amount Adjusted Against This PO/Bill (₹)</label>
            <input className="form-input font-mono" value={adjustedAmount} onChange={e=>setAdjustedAmount(e.target.value)} placeholder="0" />
            {adjustedAmount && (
              <div style={{fontSize:11.5,marginTop:5,color: balance < 0 ? 'var(--red)' : 'var(--green)'}}>
                Balance after adjustment: {inr(Math.max(0,balance))}
                {balance < 0 && ' ⚠ Exceeds advance amount'}
              </div>
            )}
          </div>
        </div>
        <div style={{padding:'0 20px 20px',display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={onClose} className="btn btn-ghost">Cancel</button>
          <button onClick={handleSave} disabled={saving} className="btn btn-primary" style={{opacity:saving?0.6:1}}>
            {saving?'Saving…':'Save Link'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Bill Payments Module ──────────────────────────
function BillPayments() {
  const { items, loading } = useBills();
  const { items: advances, loading: advLoading } = useAdvances();
  const { items: pos } = usePurchaseOrders();
  const { items: wos } = useWorkOrders();
  const [catFilter, setCatFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('all');
  const [projectFilter, setBillProjectFilter] = useState('all');
  const [vendorFilter, setBillVendorFilter] = useState('all');
  const [monthFilter, setBillMonthFilter] = useState('all');
  const [sortBy, setSortBy] = useState('date_desc');
  const [tab, setTab] = useState('bills'); // 'bills' | 'advances'
  const [showNewBill, setShowNewBill] = useState(false);
  const [showNewAdvance, setShowNewAdvance] = useState(false);
  const [linkingAdvance, setLinkingAdvance] = useState(null);
  const [editBill, setEditBill] = useState(null);
  const [editAdvance, setEditAdvance] = useState(null);
  const [viewBillSchedule, setViewBillSchedule] = useState(null);
  const [markPaidDates, setMarkPaidDates] = useState({});
  const [fixDateFor, setFixDateFor] = useState(null);

  const todayStr = new Date().toISOString().slice(0,10);

  // Bills with computed status
  const withStatus = items.map(b => {
    // Find advances linked to this bill — use adjustedAmount (what was actually deducted)
    const linkedAdv = advances.filter(a =>
      a.linkedBill === b.docId ||
      a.adjustedAgainst === b.docId ||
      (b.fromSchedule && b.linkedPO && a.linkedPO === b.linkedPO && a.fromSchedule) ||
      (b.fromSchedule && b.linkedWO && a.linkedWO === b.linkedWO && a.fromSchedule)
    );
    // Use b.advanceDeducted if stored, else calculate from linked advances
    // For advances: use adjustedAmount if set, else full amount (advance was fully used)
    const advanceDeducted = Number(b.advanceDeducted||0) ||
      linkedAdv.reduce((s,a) => s + (Number(a.adjustedAmount||0) || Number(a.amount||0)), 0);

    const hasSchedule = b.paymentSchedule && b.paymentSchedule.length > 0;

    // For fromSchedule bills: amount=base, gstAmount=GST stored separately
    // For manual bills: amount=base, gstPct used to calc GST
    let displayBase, displayGst, totalBillAmt;
    if (b.fromSchedule && b.gstAmount !== undefined) {
      // fromSchedule bills created by new code: amount=base, gstAmount=GST stored separately
      displayBase  = Number(b.amount||0);
      displayGst   = Number(b.gstAmount||0);
      totalBillAmt = displayBase + displayGst; // always recalculate
    } else if (b.fromSchedule) {
      // Legacy fromSchedule: amount = base+GST combined, reverse-calculate
      const rate = b.gstPct ? parseFloat(b.gstPct)/100 : 0;
      displayBase  = rate > 0 ? Math.round(Number(b.amount||0)/(1+rate)) : Number(b.amount||0);
      displayGst   = Number(b.amount||0) - displayBase;
      totalBillAmt = Number(b.amount||0);
    } else {
      // Manual bill: amount=base, gstPct gives GST
      displayBase  = Number(b.amount||0);
      const gstRate = b.gstPct ? parseFloat(b.gstPct) : 0;
      displayGst   = gstRate > 0 ? Math.round(displayBase * gstRate / 100) : 0;
      totalBillAmt = displayBase + displayGst; // always recalculate from base+GST
    }

    const totalGstAmt = displayGst; // unified
    const gstAssignedToStages = hasSchedule
      ? b.paymentSchedule.filter(s=>s.includesGst).reduce((s,r)=>s+Number(r.gstAmount||0),0) : 0;
    const unassignedGst = Math.max(0, totalGstAmt - gstAssignedToStages);

    let paidStagesAmt = 0, unpaidStagesAmt = 0;
    if (hasSchedule) {
      b.paymentSchedule.forEach(s => {
        const base = Number(s.amount||0);
        const gst  = Number(s.includesGst ? s.gstAmount||0 : 0);
        if (s.paid) paidStagesAmt += base + gst;
        else unpaidStagesAmt += base + gst;
      });
      unpaidStagesAmt += unassignedGst;
    }

    // Effective due date
    let effectiveDue = b.due;
    if (hasSchedule) {
      const nextUnpaid = b.paymentSchedule.find(s => !s.paid && s.date);
      if (nextUnpaid) effectiveDue = nextUnpaid.date;
      else if (b.paymentSchedule.every(s => s.paid)) effectiveDue = null;
    }

    // paidSoFar = what has actually been paid against this bill
    const paidSoFar = hasSchedule
      ? (b.paid ? totalBillAmt : paidStagesAmt)
      : (b.paid || advanceDeducted >= totalBillAmt - 1)
        ? totalBillAmt
        : advanceDeducted;

    const netPayable = hasSchedule
      ? unpaidStagesAmt
      : Math.max(0, totalBillAmt - paidSoFar);


    let status;
    if (b.paid || (hasSchedule && unpaidStagesAmt === 0)) status = 'Paid';
    else if (netPayable <= 1 && advanceDeducted > 0 && !b.paid) status = 'Advance Adjusted';
    else if (!effectiveDue) status = 'Upcoming';
    else if (effectiveDue === todayStr) status = 'Due Today';
    else if (effectiveDue < todayStr) status = 'Overdue';
    else status = 'Upcoming';

    const days = (status === 'Overdue' && effectiveDue)
      ? Math.floor((new Date(todayStr) - new Date(effectiveDue)) / 86400000) : 0;

    return { ...b, computedStatus: status, days, advanceDeducted, netPayable, paidSoFar, hasSchedule, totalBillAmt, effectiveDue, displayBase, displayGst };
  });

  function applySort(arr, key, dateField='due', amtField='amount', nameField='payee') {
    const sorted = [...arr];
    switch(key) {
      case 'date_desc':   return sorted.sort((a,b)=>(b[dateField]||b.createdAt||0)>=(a[dateField]||a.createdAt||0)?1:-1);
      case 'date_asc':    return sorted.sort((a,b)=>(a[dateField]||a.createdAt||0)>=(b[dateField]||b.createdAt||0)?1:-1);
      case 'amount_desc': return sorted.sort((a,b)=>Number(b[amtField]||0)-Number(a[amtField]||0));
      case 'amount_asc':  return sorted.sort((a,b)=>Number(a[amtField]||0)-Number(b[amtField]||0));
      case 'payee_asc':   return sorted.sort((a,b)=>(a[nameField]||'').localeCompare(b[nameField]||''));
      case 'vendor_asc':  return sorted.sort((a,b)=>(a.vendorName||a.vendor||a.source||'').localeCompare(b.vendorName||b.vendor||b.source||''));
      case 'status':      return sorted.sort((a,b)=>{
        const order = {Overdue:0,'Due Today':1,Upcoming:2,Paid:3,Unadjusted:0,'Partially Adjusted':1,'Fully Adjusted':2};
        return (order[a.computedStatus||a.status]??4)-(order[b.computedStatus||b.status]??4);
      });
      default: return sorted;
    }
  }

  const billMonths = [...new Set(items.map(b=>b.due?.slice(0,7)).filter(Boolean))].sort().reverse();
  const billVendors = [...new Set(items.map(b=>b.payee).filter(Boolean))].sort();
  const filtered = applySort(
    withStatus.filter(b =>
      // Hide fromSchedule bills that are actually advance payments (mis-routed)
      !(b.fromSchedule && (b.notes||'').startsWith('Advance')) &&
      (catFilter === 'all' || b.category === catFilter) &&
      (statusFilter === 'all' || (statusFilter==='Missing Date' ? ((b.paid && !b.paidDate) || (b.hasSchedule && (b.paymentSchedule||[]).some(s=>s.paid && !s.datePaid))) : b.computedStatus === statusFilter)) &&
      (projectFilter === 'all' || b.project === projectFilter) &&
      (vendorFilter === 'all' || b.payee === vendorFilter) &&
      (monthFilter === 'all' || (b.due||'').startsWith(monthFilter))
    ), sortBy
  );

  // Stats
  const overdueTotal = withStatus.filter(b=>b.computedStatus==='Overdue').reduce((s,b)=>s+b.netPayable,0);
  const overdueCount = withStatus.filter(b=>b.computedStatus==='Overdue').length;
  const dueTodayTotal = withStatus.filter(b=>b.computedStatus==='Due Today').reduce((s,b)=>s+b.netPayable,0);
  const next7 = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const dueWeekTotal = withStatus.filter(b=>!b.paid&&b.due>=todayStr&&b.due<=next7).reduce((s,b)=>s+b.netPayable,0);
  const paidTotal = withStatus.reduce((s,b)=>s+b.paidSoFar,0);

  // Advance stats
  const totalAdvances = advances.reduce((s,a)=>s+Number(a.amount||0),0);
  const unadjustedAdvances = advances.filter(a=>a.status!=='Fully Adjusted').reduce((s,a)=>s+Number(a.balanceAmount||0),0);

  // PO label lookup
  function poLabel(poNo) {
    const p = pos.find(p=>p.po===poNo);
    return p ? `${p.po} — ${p.vendorName}` : poNo;
  }

  const [advVendorFilter, setAdvVendorFilter] = useState('all');
  const [advStatusFilter, setAdvStatusFilter] = useState('all');
  const [advProjectFilter, setAdvProjectFilter] = useState('all');
  const [advMonthFilter, setAdvMonthFilter] = useState('all');
  const advVendors = [...new Set(advances.map(a=>a.vendor).filter(Boolean))].sort();
  const advMonths = [...new Set(advances.map(a=>a.datePaid?.slice(0,7)).filter(Boolean))].sort().reverse();
  const filteredAdvances = advances.filter(a=>
    (advVendorFilter==='all'||a.vendor===advVendorFilter) &&
    (advStatusFilter==='all'||a.status===advStatusFilter) &&
    (advProjectFilter==='all'||a.project===advProjectFilter) &&
    (advMonthFilter==='all'||(a.datePaid||'').startsWith(advMonthFilter))
  );
  const ADV_STATUS_COLOR = { 'Unadjusted':'red', 'Partially Adjusted':'amber', 'Fully Adjusted':'green' };

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Bill Payments</div>
          <div className="section-sub">
            {tab==='bills'
              ? (loading?'Loading…':`${items.length} bill${items.length===1?'':'s'} · live data`)
              : (advLoading?'Loading…':`${advances.length} advance${advances.length===1?'':'s'} · ${inr(unadjustedAdvances)} unadjusted`)}
          </div>
        </div>
        <div className="flex gap-2">
          {tab==='bills'
            ? <button className="btn btn-primary" onClick={()=>setShowNewBill(true)}>+ Add Bill</button>
            : <button className="btn btn-primary" style={{background:'var(--secondary)'}} onClick={()=>setShowNewAdvance(true)}>+ Record Advance</button>}
          {tab==='bills'
            ? <ClearCollectionButton label="Clear Bills" count={items.length} onClear={clearAllBills} />
            : <ClearCollectionButton label="Clear Advances" count={advances.length} onClear={clearAllAdvances} />}
        </div>
      </div>

      {/* Tabs */}
      <div className="tabs">
        <div className={`tab ${tab==='bills'?'active':''}`} onClick={()=>setTab('bills')}>📑 Bills & Invoices</div>
        <div className={`tab ${tab==='advances'?'active':''}`} onClick={()=>setTab('advances')}>
          💰 Advance Payments
          {unadjustedAdvances > 0 && <span className="nav-badge" style={{background:'var(--amber)',marginLeft:8}}>{advances.filter(a=>a.status!=='Fully Adjusted').length}</span>}
        </div>
      </div>

      {/* ── BILLS TAB ── */}
      {tab==='bills' && (
        <>
          <div className="stats-grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
            <div className="stat-card"><div className="stat-label">Overdue (Net)</div><div className="stat-value red">{inr(overdueTotal)}</div><div className="stat-sub">{overdueCount} bill{overdueCount===1?'':'s'}</div></div>
            <div className="stat-card"><div className="stat-label">Due Today (Net)</div><div className="stat-value amber">{inr(dueTodayTotal)}</div></div>
            <div className="stat-card"><div className="stat-label">Due This Week (Net)</div><div className="stat-value blue">{inr(dueWeekTotal)}</div></div>
            <div className="stat-card"><div className="stat-label">Total Paid (incl. GST)</div><div className="stat-value green">{inr(paidTotal)}</div><div className="stat-sub" style={{fontSize:10}}>{withStatus.filter(b=>b.paid).length} bills fully settled</div></div>
          </div>
          <div className="card">
            <div className="card-body" style={{paddingTop:10,paddingBottom:10}}>

                  <option value="all">All Categories</option>

                <select className="form-input form-select" style={{width:150}} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>

              <div style={{overflowX:'auto',overflowY:'visible'}}>

                              )}
                              <button className="btn btn-sm btn-ghost" onClick={()=>{if(confirm('Delete?'))deleteBill(b.docId);}}>Delete</button>

                      </td>

                  ))}
                  <tr style={{background:'var(--grey-50)',fontWeight:700,borderTop:'2px solid var(--border)'}}>
                    <td colSpan={5} style={{padding:'8px 12px',fontSize:12,color:'var(--text-secondary)'}}>Subtotal ({filtered.length} bills)</td>
                    <td className="amount" style={{fontWeight:700,color:'var(--primary)',fontSize:13}}>{inr(filtered.reduce((s,b)=>s+(b.displayBase||Number(b.amount||0)),0))}</td>
                    <td className="amount" style={{fontWeight:700,color:'var(--text-muted)',fontSize:12}}>{inr(filtered.reduce((s,b)=>s+(b.displayGst||0),0))}</td>
                    <td className="amount" style={{fontWeight:700,color:'var(--green)',fontSize:13}}>{inr(filtered.reduce((s,b)=>s+b.paidSoFar,0))}</td>
                    <td className="amount" style={{fontWeight:700,color:'var(--red)',fontSize:13}}>{inr(filtered.reduce((s,b)=>s+b.netPayable,0))}</td>
                    <td colSpan={3}></td>
                  </tr>
                </tbody>
              </table>
              </div>
            )}
          </div>
        </>
      )}

      {/* ── ADVANCES TAB ── */}
      {tab==='advances' && (
        <>
          <div className="stats-grid" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
            <div className="stat-card"><div className="stat-label">Total Advances Paid</div><div className="stat-value red">{inr(totalAdvances)}</div></div>
            <div className="stat-card"><div className="stat-label">Unadjusted Balance</div><div className="stat-value amber">{inr(unadjustedAdvances)}</div><div className="stat-sub">{advances.filter(a=>a.status!=='Fully Adjusted').length} pending</div></div>
            <div className="stat-card"><div className="stat-label">Fully Adjusted</div><div className="stat-value green">{advances.filter(a=>a.status==='Fully Adjusted').length}</div></div>
          </div>
          <div className="card">
            <div className="card-body" style={{paddingTop:10,paddingBottom:10}}>
              <div className="flex gap-2" style={{flexWrap:'wrap'}}>
                <select className="form-input form-select" style={{width:150}} value={advVendorFilter} onChange={e=>setAdvVendorFilter(e.target.value)}>
                  <option value="all">All Vendors</option>

function useBillingSchedules() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    function start() {
      const { db, collection, query, orderBy, onSnapshot } = window.fb;
      const unsub = onSnapshot(
        query(userCol(BILLING_COLLECTION), orderBy('createdAt','desc')),
        snap => { setItems(snap.docs.map(d=>({docId:d.id,...d.data()}))); setLoading(false); },
        err  => { console.error('Billing listener',err); setLoading(false); }
      );
      return unsub;
    }
    if (window.fb && getUserUID()) { const u=start(); return ()=>u&&u(); }
    let u;
    const h=()=>{ if(getUserUID()) u=start(); };
    const hu=()=>{ if(u) u(); if(window.fb) u=start(); };
    window.addEventListener('firebase-ready',h,{once:true});
    window.addEventListener('user-ready',hu,{once:true});
    return ()=>{ window.removeEventListener('firebase-ready',h); window.removeEventListener('user-ready',hu); if(u) u(); };
  },[]);
  return {items,loading};
}

// ════════════════════════════════════════════════════
// HIERARCHICAL BILLING TREE — Schedule → Item → Sub-item
// A node with no children is a claimable leaf. Cap amounts are
// stored explicitly at every level (not recomputed from wt%), so
// they always match what's on the approved billing breakup.
// ════════════════════════════════════════════════════
function isLeafNode(node) { return !node.children || node.children.length === 0; }

// Flatten every leaf with its full ancestor path, for pickers and opening-balance entry.
function flattenLeaves(nodes, path) {
  path = path || [];
  let out = [];
  (nodes||[]).forEach(n => {
    const p = [...path, n.name];
    if (isLeafNode(n)) out.push({ ...n, path: p });
    else out = out.concat(flattenLeaves(n.children, p));
  });
  return out;
}

// Merge a freshly-generated template tree with an already-saved tree: for each
// fresh leaf, look for a matching old leaf (exact full path first, then a unique
// name match as fallback) and, if found, keep the OLD leaf's id and opening
// balances — so existing RA Bill claims (which reference leaf ids) and opening
// balances survive a template update. Old leaves with real data that couldn't
// be matched (because that section was restructured) are reported separately
// so the user can manually reassign them rather than silently losing them.
function mergeTreeWithTemplate(freshTree, oldTree, raBills, projectDocId) {
  const oldLeaves = flattenLeaves(oldTree);
  const oldByPath = {};
  const oldByName = {};
  oldLeaves.forEach(l => {
    const pathKey = l.path.join(' → ');
    oldByPath[pathKey] = l;
    (oldByName[l.name] = oldByName[l.name]||[]).push(l);
  });
  const claimedLeafIds = new Set();
  raBills.filter(b=>b.billingProjectId===projectDocId).forEach(b => {
    (b.claims||(b.leafId?[{leafId:b.leafId}]:[])).forEach(c=>claimedLeafIds.add(c.leafId));
  });
  const matchedOldIds = new Set();

  function mergeNode(node, path) {
    const p = [...path, node.name];
    if (isLeafNode(node)) {
      const pathKey = p.join(' → ');
      let match = oldByPath[pathKey];
      if (!match) {
        const candidates = oldByName[node.name];
        if (candidates && candidates.length === 1) match = candidates[0];
      }
      if (match) {
        matchedOldIds.add(match.id);
        return { ...node, id: match.id, openingClaimed: match.openingClaimed||0, openingReceived: match.openingReceived||0 };
      }
      return node;
    }
    return { ...node, children: (node.children||[]).map(c=>mergeNode(c, p)) };
  }

  const mergedTree = freshTree.map(n=>mergeNode(n, []));
  const unmatchedOld = oldLeaves.filter(l =>
    !matchedOldIds.has(l.id) && (Number(l.openingClaimed)>0 || Number(l.openingReceived)>0 || claimedLeafIds.has(l.id))
  );
  return { mergedTree, unmatchedOld };
}

// Roll up claimed/received for a node from its own opening balance (if leaf) or its
// children (if not) — RA Bills matched by leafId. Cap amount is always read directly
// from the node itself, never recomputed, so it can't drift from the approved breakup.
function computeNodeTotals(node, raBillsByLeaf) {
  if (isLeafNode(node)) {
    const bills = raBillsByLeaf[node.id] || [];
    const claimed  = Number(node.openingClaimed||0)  + bills.reduce((s,b)=>s+Number(b.amountClaimed||0),0);
    const received = Number(node.openingReceived||0) + bills.reduce((s,b)=>s+Number(b.amountReceived||0),0);
    return { capAmount: Number(node.capAmount||0), claimed, received };
  }
  return (node.children||[]).reduce((acc,c) => {
    const t = computeNodeTotals(c, raBillsByLeaf);
    return { capAmount: acc.capAmount+t.capAmount, claimed: acc.claimed+t.claimed, received: acc.received+t.received };
  }, { capAmount:0, claimed:0, received:0 });
}

// Index RA Bills by the leaf they're claimed against, for fast roll-up lookups.
// A bill's `claims` array can span multiple leaves; older bills (pre-multi-claim)
// only have a single leafId/amountClaimed, handled as a one-item fallback.
function indexRABillsByLeaf(raBills, projectDocId) {
  const idx = {};
  raBills.filter(b=>b.billingProjectId===projectDocId).forEach(b => {
    const claims = b.claims || (b.leafId ? [{leafId:b.leafId, amount:b.amountClaimed}] : []);
    claims.forEach(c => {
      (idx[c.leafId] = idx[c.leafId]||[]).push({amountClaimed: c.amount});
    });
  });
  return idx;
}

// Immutable tree helpers — operate on the whole tree by node id, used by the editor.
function updateNodeInTree(tree, nodeId, patch) {
  return tree.map(n => {
    if (n.id === nodeId) return { ...n, ...patch };
    if (n.children && n.children.length) return { ...n, children: updateNodeInTree(n.children, nodeId, patch) };
    return n;
  });
}
function addChildInTree(tree, parentId, newChild) {
  return tree.map(n => {
    if (n.id === parentId) return { ...n, children: [...(n.children||[]), newChild] };
    if (n.children && n.children.length) return { ...n, children: addChildInTree(n.children, parentId, newChild) };
    return n;
  });
}
function removeNodeInTree(tree, nodeId) {
  return tree.filter(n=>n.id!==nodeId).map(n =>
    n.children && n.children.length ? { ...n, children: removeNodeInTree(n.children, nodeId) } : n
  );
}

// Recursive row for building/editing the Schedule → Item → Sub-item tree.
function TreeNodeEditor({ node, depth, onUpdate, onAddChild, onRemove }) {
  return (
    <div style={{marginLeft: depth*16, borderLeft: depth>0?'2px solid var(--border)':'none', paddingLeft: depth>0?10:0, marginTop:6}}>
      <div className="flex gap-2" style={{alignItems:'center'}}>
        <input className="form-input" style={{flex:1,fontSize:12,padding:'5px 7px'}} value={node.name}
          onChange={e=>onUpdate(node.id,{name:e.target.value})} placeholder="Name" />
        <input className="form-input font-mono" style={{width:56,fontSize:12,padding:'5px 7px'}} value={node.wtPct}
          onChange={e=>onUpdate(node.id,{wtPct:e.target.value})} placeholder="Wt%" />
        <input className="form-input font-mono" style={{width:120,fontSize:12,padding:'5px 7px'}} value={node.capAmount}
          onChange={e=>onUpdate(node.id,{capAmount:e.target.value})} placeholder="Cap ₹" />
        <button type="button" className="btn btn-sm btn-ghost" style={{fontSize:10,whiteSpace:'nowrap'}} onClick={()=>onAddChild(node.id)}>+ Child</button>
        <span onClick={()=>onRemove(node.id)} style={{cursor:'pointer',color:'var(--red)',fontSize:13}}>✕</span>
      </div>
      {(node.children||[]).map(c=>(
        <TreeNodeEditor key={c.id} node={c} depth={depth+1} onUpdate={onUpdate} onAddChild={onAddChild} onRemove={onRemove} />
      ))}
    </div>
  );
}

// Opening balance ("Point 0") entry — one-time, per leaf, for work already claimed/
// received before this system existed. Not logged as a dated transaction anywhere.
// Recursive collapsible row for the Opening Balance table — same tree shape and
// column layout as the billing schedule itself; only leaf rows are editable.
function OpeningBalanceRow({ node, depth, values, set, expanded, toggleExpanded }) {
  const leaf = isLeafNode(node);
  const rollupCap = leaf ? Number(node.capAmount||0) : (node.children||[]).reduce((s,c)=>s+nodeCapSum(c),0);
  const isOpen = leaf ? true : expanded[node.id]!==false;
  return (
    <>
      <tr style={{borderTop:'1px solid var(--grey-50)',background:depth===0?'var(--grey-100)':leaf?'':'var(--grey-50)'}}>
        <td style={{padding:'6px 8px',paddingLeft:8+depth*18,fontSize:depth===0?12.5:12,fontWeight:depth===0?700:leaf?400:600}}>
          {!leaf && (
            <span onClick={()=>toggleExpanded(node.id)} style={{cursor:'pointer',marginRight:6,color:'var(--text-muted)',display:'inline-block',width:12}}>
              {isOpen?'▾':'▸'}
            </span>
          )}
          {node.name}
        </td>
        <td style={{padding:'6px 8px',fontSize:11.5,color:'var(--text-muted)'}}>{node.wtPct?`${node.wtPct}%`:''}</td>
        <td style={{padding:'6px 8px'}} className="amount">{inr(rollupCap)}</td>
        <td style={{padding:'6px 4px'}}>
          {leaf && (
            <input className="form-input font-mono" style={{fontSize:11.5,padding:'4px 6px',width:130}}
              value={values[node.id]?.amount||''} onChange={e=>set(node.id,e.target.value)} placeholder="0" />
          )}
        </td>
      </tr>
      {!leaf && isOpen && (node.children||[]).map(c=>(
        <OpeningBalanceRow key={c.id} node={c} depth={depth+1} values={values} set={set} expanded={expanded} toggleExpanded={toggleExpanded} />
      ))}
    </>
  );
}
function nodeCapSum(n) {
  return isLeafNode(n) ? Number(n.capAmount||0) : (n.children||[]).reduce((s,c)=>s+nodeCapSum(c),0);
}

// Preview + confirm screen for refreshing a project's tree from its template,
// showing exactly what will be preserved vs. what needs manual reassignment.
function RefreshTreeModal({ project, raBills, freshTree, onClose }) {
  const [saving, setSaving] = useState(false);
  const { mergedTree, unmatchedOld } = mergeTreeWithTemplate(freshTree, project.tree, raBills, project.docId);
  const oldLeafCount = flattenLeaves(project.tree).length;
  const newLeafCount = flattenLeaves(mergedTree).length;
  const matchedCount = oldLeafCount - unmatchedOld.length;

  async function handleConfirm() {
    setSaving(true);
    try {
      await updateBillingSchedule(project.docId, { tree: mergedTree });
      onClose();
    } catch(e) { console.error(e); alert('Could not refresh tree.'); }
    finally { setSaving(false); }
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1001,display:'flex',alignItems:'center',justifyContent:'center'}}>

          <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:14}}>
            This updates the billing tree structure to match the latest template. Line items that still exist (same name and position) keep their opening balances and stay linked to any RA Bills already claimed against them.
          </div>
          <div style={{background:'var(--green-50)',border:'1px solid #C8E6C9',borderRadius:6,padding:'10px 14px',fontSize:12.5,marginBottom:12}}>
            <div className="flex justify-between"><span>Line items matched & preserved</span><strong>{matchedCount}</strong></div>
            <div className="flex justify-between mt-1"><span>New line items in updated template</span><strong>{newLeafCount - matchedCount}</strong></div>

                <div key={l.id} style={{borderTop:'1px solid #FFCDD2',padding:'6px 0',fontSize:11.5}}>

function OpeningBalanceModal({ project, onClose }) {
  const leaves = flattenLeaves(project.tree);
  const [values, setValues] = useState(() => {
    const v = {};
    leaves.forEach(l => { v[l.id] = { amount: String(l.openingClaimed||l.openingReceived||'') }; });
    return v;
  });
  const [expanded, setExpanded] = useState({});
  const [saving, setSaving] = useState(false);
  function set(leafId, val) {
    setValues(s => ({ ...s, [leafId]: { amount: val } }));
  }
  function toggleExpanded(id) { setExpanded(e=>({...e,[id]: e[id]===false ? true : false})); }

  const totalAmount = leaves.reduce((s,l)=>s+(Number(values[l.id]?.amount)||0),0);

  async function handleSave() {
    setSaving(true);
    try {
      function applyOpening(nodes) {
        return nodes.map(n => {
          if (isLeafNode(n)) {
            const amt = Number(values[n.id]?.amount)||0;
            return { ...n, openingClaimed: amt, openingReceived: amt };
          }
          return { ...n, children: applyOpening(n.children) };
        });
      }
      await updateBillingSchedule(project.docId, { tree: applyOpening(project.tree) });
      onClose();
    } catch(e) { console.error(e); alert('Could not save opening balances.'); }
    finally { setSaving(false); }
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'var(--surface)',borderRadius:10,width:820,maxHeight:'90vh',boxShadow:'0 8px 40px rgba(0,0,0,.22)',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div style={{background:'var(--primary)',padding:'14px 18px',flexShrink:0}}>
          <span style={{fontWeight:700,fontSize:14,color:'#fff'}}>Opening Balances ("Point 0") — {project.client}</span>
        </div>
        <div style={{padding:'14px 18px',overflowY:'auto',flex:1,minHeight:0}}>
          <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:12}}>
            Enter what's already been claimed/received against each line item before this system started tracking it — same layout as the billing schedule, click ▾/▸ to expand or collapse a section. This is a one-time snapshot, not a dated transaction.
          </div>
          <div style={{overflowX:'auto',overflowY:'visible'}}>
            <table style={{width:'100%',minWidth:600}}>
              <thead>
                <tr style={{background:'var(--grey-100)'}}>
                  {['Description of Work','Wt%','Cap (excl. GST)','Opening Amount (₹)'].map(h=>(
                    <th key={h} style={{fontSize:10,padding:'6px 8px',textAlign:'left',color:'var(--text-muted)'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {project.tree.map(n=>(
                  <OpeningBalanceRow key={n.id} node={n} depth={0} values={values} set={set} expanded={expanded} toggleExpanded={toggleExpanded} />
                ))}
                <tr style={{background:'var(--grey-50)',fontWeight:700,borderTop:'2px solid var(--border)'}}>
                  <td colSpan={3} style={{padding:'8px 8px',fontSize:12}}>Total</td>
                  <td style={{padding:'8px 4px'}} className="amount">{inr(totalAmount)}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div style={{padding:'14px 18px',display:'flex',gap:10,justifyContent:'flex-end',flexShrink:0,borderTop:'1px solid var(--border)'}}>
          <button onClick={onClose} className="btn btn-ghost">Cancel</button>
          <button onClick={handleSave} disabled={saving} className="btn btn-primary" style={{opacity:saving?0.6:1}}>
            {saving?'Saving…':'Save Opening Balances'}
          </button>
        </div>
      </div>
    </div>
  );
}

// Recursive collapsible progress row — shows roll-up (cap/claimed/%/received/pending)
// at every level, same shape as the source billing breakup document.
function BillingTreeRow({ node, depth, raBillsByLeaf, expanded, toggleExpanded, onClaim }) {
  const totals = computeNodeTotals(node, raBillsByLeaf);
  const leaf = isLeafNode(node);
  const pct = totals.capAmount>0 ? Math.min(100, Math.round(totals.claimed/totals.capAmount*100)) : 0;
  const pending = Math.max(0, totals.capAmount - totals.claimed);
  const isOpen = leaf ? true : expanded[node.id]!==false; // default expanded
  return (
    <>
      <tr style={{borderTop:'1px solid var(--grey-50)',background:depth===0?'var(--grey-50)':''}}>
        <td style={{padding:'6px 8px',paddingLeft:8+depth*18,fontSize:depth===0?12.5:12,fontWeight:depth===0?700:leaf?400:600}}>
          {!leaf && (
            <span onClick={()=>toggleExpanded(node.id)} style={{cursor:'pointer',marginRight:6,color:'var(--text-muted)',display:'inline-block',width:12}}>
              {isOpen?'▾':'▸'}
            </span>
          )}
          {node.name}
        </td>
        <td style={{padding:'6px 8px',fontSize:11.5,color:'var(--text-muted)'}}>{node.wtPct?`${node.wtPct}%`:''}</td>
        <td style={{padding:'6px 8px'}} className="amount">{inr(totals.capAmount)}</td>
        <td style={{padding:'6px 8px'}} className="amount" style={{color:'var(--primary)'}}>{inr(totals.claimed)}</td>
        <td style={{padding:'6px 8px',fontSize:11.5}}>{pct}%</td>
        <td style={{padding:'6px 8px'}} className="amount" style={{color:'var(--green)'}}>{inr(totals.received)}</td>
        <td style={{padding:'6px 8px'}} className="amount" style={{color:pending>0?'var(--amber)':'var(--green)'}}>{inr(pending)}</td>
        <td style={{padding:'6px 8px'}}>
          {leaf && pending>0 && (
            <button className="btn btn-sm btn-primary" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>onClaim(node)}>+ Claim</button>
          )}
        </td>
      </tr>
      {!leaf && isOpen && (node.children||[]).map(c=>(
        <BillingTreeRow key={c.id} node={c} depth={depth+1} raBillsByLeaf={raBillsByLeaf} expanded={expanded} toggleExpanded={toggleExpanded} onClaim={onClaim} />
      ))}
    </>
  );
}

// Recursive row for the multi-claim picker — same tree shape as the billing
// schedule, showing roll-up context (cap, already claimed, pending) at every
// level, with an editable "Claim Now" amount on leaf rows only.
function ClaimPickerRow({ node, depth, raBillsByLeaf, values, set, expanded, toggleExpanded }) {
  const leaf = isLeafNode(node);
  const totals = computeNodeTotals(node, raBillsByLeaf);
  const pending = Math.max(0, totals.capAmount - totals.claimed);
  const isOpen = leaf ? true : expanded[node.id]!==false;
  const claimNow = leaf ? Number(values[node.id]||0) : 0;
  return (
    <>
      <tr style={{borderTop:'1px solid var(--grey-50)',background:depth===0?'var(--grey-100)':leaf?(claimNow>0?'var(--primary-50)':''):'var(--grey-50)'}}>
        <td style={{padding:'6px 8px',paddingLeft:8+depth*18,fontSize:depth===0?12.5:12,fontWeight:depth===0?700:leaf?400:600}}>
          {!leaf && (
            <span onClick={()=>toggleExpanded(node.id)} style={{cursor:'pointer',marginRight:6,color:'var(--text-muted)',display:'inline-block',width:12}}>
              {isOpen?'▾':'▸'}
            </span>
          )}
          {node.name}
        </td>
        <td style={{padding:'6px 8px'}} className="amount" style={{fontSize:11.5}}>{inr(totals.capAmount)}</td>
        <td style={{padding:'6px 8px'}} className="amount" style={{fontSize:11.5,color:'var(--primary)'}}>{inr(totals.claimed)}</td>
        <td style={{padding:'6px 8px'}} className="amount" style={{fontSize:11.5,color:pending>0?'var(--amber)':'var(--green)'}}>{inr(pending)}</td>
        <td style={{padding:'6px 4px'}}>
          {leaf && (
            <input className="form-input font-mono" style={{fontSize:11.5,padding:'4px 6px',width:120}}
              value={values[node.id]||''} onChange={e=>set(node.id,e.target.value)} placeholder="0" disabled={pending<=0} />
          )}
        </td>
      </tr>
      {!leaf && isOpen && (node.children||[]).map(c=>(
        <ClaimPickerRow key={c.id} node={c} depth={depth+1} raBillsByLeaf={raBillsByLeaf} values={values} set={set} expanded={expanded} toggleExpanded={toggleExpanded} />
      ))}
    </>
  );
}

function ClaimPickerModal({ project, raBills, existingClaims, onApply, onClose }) {
  const raBillsByLeaf = indexRABillsByLeaf(raBills, project.docId);
  const allLeaves = flattenLeaves(project.tree);
  const [values, setValues] = useState(() => {
    const v = {};
    (existingClaims||[]).forEach(c => { v[c.leafId] = String(c.amount); });
    return v;
  });
  const [expanded, setExpanded] = useState({});
  function set(leafId, val) { setValues(s=>({...s,[leafId]:val})); }
  function toggleExpanded(id) { setExpanded(e=>({...e,[id]: e[id]===false ? true : false})); }

  const runningTotal = Object.values(values).reduce((s,v)=>s+(Number(v)||0),0);
  const claimCount = Object.values(values).filter(v=>Number(v)>0).length;

  function handleApply() {
    const claims = Object.entries(values)
      .filter(([id,amt])=>Number(amt)>0)
      .map(([id,amt]) => {
        const leaf = allLeaves.find(l=>l.id===id);
        return { leafId:id, leafPath: leaf?leaf.path.join(' → '):'', amount: Number(amt) };
      });
    onApply(claims);
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1001,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'var(--surface)',borderRadius:10,width:820,maxHeight:'90vh',boxShadow:'0 8px 40px rgba(0,0,0,.22)',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div style={{background:'var(--primary)',padding:'14px 18px',flexShrink:0}}>
          <span style={{fontWeight:700,fontSize:14,color:'#fff'}}>Claim Against — {project.client}</span>
        </div>
        <div style={{padding:'14px 18px',overflowY:'auto',flex:1,minHeight:0}}>
          <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:12}}>
            Enter the amount being claimed now against any number of line items — click ▾/▸ to expand or collapse a section.
          </div>
          <div style={{overflowX:'auto',overflowY:'visible'}}>
            <table style={{width:'100%',minWidth:680}}>
              <thead>
                <tr style={{background:'var(--grey-100)'}}>
                  {['Description of Work','Cap (excl. GST)','Claimed So Far','Pending','Claim Now (₹)'].map(h=>(
                    <th key={h} style={{fontSize:10,padding:'6px 8px',textAlign:'left',color:'var(--text-muted)'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {project.tree.map(n=>(
                  <ClaimPickerRow key={n.id} node={n} depth={0} raBillsByLeaf={raBillsByLeaf} values={values} set={set} expanded={expanded} toggleExpanded={toggleExpanded} />
                ))}
              </tbody>
            </table>
          </div>
        </div>
        <div style={{padding:'14px 18px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,borderTop:'1px solid var(--border)'}}>
          <div style={{fontSize:12.5}}>
            <strong>{claimCount}</strong> item{claimCount!==1?'s':''} selected · Total: <strong className="amount">{inr(runningTotal)}</strong>
          </div>
          <div className="flex gap-2">
            <button onClick={onClose} className="btn btn-ghost">Cancel</button>
            <button onClick={handleApply} disabled={claimCount===0} className="btn btn-primary" style={{opacity:claimCount===0?0.6:1}}>
              Apply Claims
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function nextRABillNumberForProject(project, raBills) {
  let defaultStart = 1;
  if (project.raBillStartNumber===undefined) {
    if (project.project==='Pontoon') defaultStart = 4;
    else if (project.project==='WTP') defaultStart = 6;
  }
  const startNum = Number(project.raBillStartNumber)||defaultStart;
  const countForProject = raBills.filter(b=>b.billingProjectId===project.docId).length;
  return `RA Bill ${startNum + countForProject}`;
}

function SubmitRABillModal({ onClose, schedules, raBills, existingCount, presetProjectId, presetLeafId }) {
  const presetProject = presetProjectId ? schedules.find(s=>s.docId===presetProjectId) : null;
  const presetLeafData = (() => {
    if (!presetProject || !presetLeafId) return null;
    const leaf = flattenLeaves(presetProject.tree).find(l=>l.id===presetLeafId);
    if (!leaf) return null;
    const t = computeNodeTotals(leaf, indexRABillsByLeaf(raBills, presetProject.docId));
    return { leafId: presetLeafId, leafPath: leaf.path.join(' → '), amount: Math.max(0, t.capAmount - t.claimed) };
  })();

  const [form, setForm] = useState({
    raBillNo: presetProject ? nextRABillNumberForProject(presetProject, raBills) : '',
    billingProjectId: presetProjectId||'',
    claims: presetLeafData ? [presetLeafData] : [],
    gstPct: '18', dateSubmitted: new Date().toISOString().slice(0,10),
    notes: ''
  });
  const [showPicker, setShowPicker] = useState(false);
  const [saving, setSaving] = useState(false);
  function set(f,v){setForm(s=>({...s,[f]:v}));}

  const selectedProject = schedules.find(s=>s.docId===form.billingProjectId);
  const amountClaimed = form.claims.reduce((s,c)=>s+Number(c.amount||0),0);

  function handleProjectSelect(docId){
    set('billingProjectId',docId);
    set('claims',[]);
    const proj = schedules.find(s=>s.docId===docId);
    set('raBillNo', proj ? nextRABillNumberForProject(proj, raBills) : '');
  }

  async function handleSave(){
    if(!form.billingProjectId||!form.claims.length||!form.dateSubmitted) return;
    setSaving(true);
    try {
      const gstPct = Number(form.gstPct)||0;
      const gstAmount = gstPct > 0 ? Math.round(amountClaimed * gstPct / 100) : 0;
      await addRABill({
        raBillNo: form.raBillNo, billingProjectId: form.billingProjectId,
        dateSubmitted: form.dateSubmitted, notes: form.notes,
        claims: form.claims,
        amountClaimed, gstPct: form.gstPct, gstAmount,
        amountReceived: 0, balancePending: amountClaimed, status: 'Submitted',
        client: selectedProject?.client||'', project: selectedProject?.project||'',
      });
      onClose();
    } catch(e){ console.error(e); alert('Could not submit RA Bill.'); }
    finally{ setSaving(false); }
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'var(--surface)',borderRadius:10,width:560,maxHeight:'90vh',overflowY:'auto',boxShadow:'0 8px 40px rgba(0,0,0,.22)'}} onClick={e=>e.stopPropagation()}>
        <div style={{background:'var(--primary)',padding:'14px 18px',position:'sticky',top:0,zIndex:1}}>
          <span style={{fontWeight:700,fontSize:14,color:'#fff'}}>📄 Submit Running Bill</span>
        </div>
        <div style={{padding:'18px 20px'}}>
          <div className="form-group">
            <label className="form-label">Billing Project</label>
            <select className="form-input form-select" value={form.billingProjectId} onChange={e=>handleProjectSelect(e.target.value)} disabled={!!presetProjectId}>
              <option value="">Select billing project…</option>
              {schedules.map(sc=>(
                <option key={sc.docId} value={sc.docId}>{sc.client} — {sc.project||'No project'}{sc.contractNo?` (${sc.contractNo})`:''}</option>
              ))}
            </select>
          </div>

          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">RA Bill Number</label>
              <input className="form-input font-mono" value={form.raBillNo} onChange={e=>set('raBillNo',e.target.value)}
                placeholder={selectedProject ? '' : 'Select a billing project first'} disabled={!selectedProject} />
            </div>
            <div className="form-group">
              <label className="form-label">Date Submitted</label>
              <input className="form-input" type="date" value={form.dateSubmitted} onChange={e=>set('dateSubmitted',e.target.value)} />
            </div>
          </div>

          {selectedProject && (
            <div className="form-group">
              <label className="form-label">Claim Against</label>
              <button type="button" className="btn btn-outline" style={{width:'100%',justifyContent:'space-between',display:'flex'}} onClick={()=>setShowPicker(true)}>
                <span>{form.claims.length ? `${form.claims.length} item${form.claims.length!==1?'s':''} selected` : 'Select line items…'}</span>
                <span>▸</span>
              </button>
              {form.claims.length>0 && (
                <div style={{background:'var(--primary-50)',borderRadius:6,padding:'8px 12px',fontSize:11.5,marginTop:8}}>
                  {form.claims.map(c=>(
                    <div key={c.leafId} className="flex justify-between mt-1">
                      <span style={{maxWidth:340}}>{c.leafPath}</span>
                      <span className="amount fw-600">{inr(c.amount)}</span>
                    </div>
                  ))}
                  <div style={{borderTop:'1px solid var(--primary)',marginTop:6,paddingTop:6}} className="flex justify-between fw-600">
                    <span>Total Claimed</span><span className="amount">{inr(amountClaimed)}</span>
                  </div>
                </div>
              )}
            </div>
          )}

          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">Total Amount Claimed (₹)</label>
              <input className="form-input font-mono" value={inr(amountClaimed)} disabled />
            </div>
            <div className="form-group">
              <label className="form-label">GST %</label>
              <input className="form-input font-mono" value={form.gstPct} onChange={e=>set('gstPct',e.target.value)} placeholder="18" />
            </div>
          </div>
          {amountClaimed>0 && Number(form.gstPct)>0 && (
            <div style={{background:'var(--primary-50)',borderRadius:6,padding:'8px 12px',fontSize:12,marginBottom:14}}>
              GST {inr(Math.round(amountClaimed*Number(form.gstPct)/100))} · Total incl. GST {inr(amountClaimed+Math.round(amountClaimed*Number(form.gstPct)/100))}
            </div>
          )}
          <div className="form-group">
            <label className="form-label">Notes</label>
            <input className="form-input" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Optional — scope, period, etc." />
          </div>
        </div>
        <div style={{padding:'0 20px 20px',display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={onClose} className="btn btn-ghost">Cancel</button>
          <button onClick={handleSave} disabled={saving||!form.billingProjectId||!form.claims.length} className="btn btn-primary"
            style={{opacity:saving||!form.billingProjectId||!form.claims.length?0.6:1}}>
            {saving?'Saving…':'Submit RA Bill'}
          </button>
        </div>
      </div>
      {showPicker && selectedProject && (
        <ClaimPickerModal
          project={selectedProject} raBills={raBills} existingClaims={form.claims}
          onApply={(claims)=>{ set('claims',claims); setShowPicker(false); }}
          onClose={()=>setShowPicker(false)}
        />
      )}
    </div>
  );
}

        <div style={{padding:'0 20px 20px',display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={onClose} className="btn btn-ghost">Cancel</button>
          <button onClick={handleSave} disabled={saving} className="btn btn-primary" style={{opacity:saving?0.6:1}}>
            {saving?'Saving…':'Save'}
          </button>
        </div>
      </div>
    </div>
  );
}

function RecordReceiptModal({ raBill, onClose, allReceipts, billingProjects }) {
  const project = (billingProjects||[]).find(p=>p.docId===raBill.billingProjectId);
  const sub = project?.subcontract || null;

  // Track progress against the bill's base (excl. GST) value separately from actual
  // cash received — with a subcontract split, these are very different numbers.
  const alreadySettled = allReceipts.filter(r=>r.raBillId===raBill.docId)
    .reduce((s,r)=>s+Number(r.billAmountSettled!==undefined ? r.billAmountSettled : r.amountReceived||0),0);
  const pendingBalance = Math.max(0, Number(raBill.amountClaimed||0) - alreadySettled);

  // Cumulative VPRPL recovery/refund already applied across every receipt on this
  // billing project (any RA bill), so the calculator knows which phase it's in.
  const projectReceipts = sub ? (allReceipts||[]).filter(r=>r.billingProjectId===raBill.billingProjectId) : [];
  const recoveredSoFar = projectReceipts.reduce((s,r)=>s+Number(r.vprplRecoveryAmt||0),0);
  const refundedSoFar  = projectReceipts.reduce((s,r)=>s+Number(r.vprplRefundAmt||0),0);
  const remainingInvestment = sub ? Math.max(0, sub.investmentAmount - recoveredSoFar) : 0;
  const remainingDeposit    = sub ? Math.max(0, sub.depositAmount - refundedSoFar) : 0;

  const [form, setForm] = useState({
    baseAmount: String(pendingBalance), amountReceived: String(pendingBalance),
    tdsIT: '', tdsGST: '', labourCess: '', otherDeduction: '',
    dateReceived: new Date().toISOString().slice(0,10),
    paymentMode: 'NEFT', refNumber: '', notes: ''
  });
  const [saving, setSaving] = useState(false);
  function set(f,v){setForm(s=>({...s,[f]:v}));}

  // ── VPRPL settlement calculator (Annexure-2) — only active when subcontract terms exist ──
  const gstPct = Number(raBill.gstPct) || 18;
  const base = Number(form.baseAmount)||0;
  const gst = Math.round(base * gstPct/100);
  const tdsIT = Number(form.tdsIT)||0;
  const tdsGST = Number(form.tdsGST)||0;
  const labourCess = Number(form.labourCess)||0;
  const otherDed = Number(form.otherDeduction)||0;
  const totalDeductions = tdsIT+tdsGST+labourCess+otherDed;
  const paymentRecvExclGst = base - totalDeductions;
  const marginAmt = sub ? Math.round(base * sub.marginPct/100) : 0;
  const recoveryAmt = sub ? Math.min(Math.round(base * sub.recoveryPct/100), remainingInvestment) : 0;
  const inRecoveryPhase = sub && remainingInvestment > 0;
  const vprplCut = marginAmt + recoveryAmt;
  const balancePaymentExclGst = paymentRecvExclGst - vprplCut;
  const subContractedExclGst = balancePaymentExclGst + tdsGST;
  const gstOnSub = Math.round(subContractedExclGst * gstPct/100);
  const subContractedInclGst = subContractedExclGst + gstOnSub;
  const performanceSecurity = sub ? Math.round(base * 0.03) : 0;
  const refundAmt = sub ? Math.min(Math.round(base * sub.refundPct/100), remainingDeposit) : 0;
  const grossPayableInclGst = subContractedInclGst - performanceSecurity + refundAmt;
  const itTdsOnSub = Math.round(subContractedExclGst * 0.02);
  const netAmountToBank = grossPayableInclGst - itTdsOnSub;

  const newBalance = Math.max(0, pendingBalance - Number(form.amountReceived||0));
  const isShort = Number(form.amountReceived||0) < pendingBalance;
  const isOver = Number(form.amountReceived||0) > pendingBalance;
  const baseIsShort = base < pendingBalance;
  const baseIsOver = base > pendingBalance;

  async function handleSave(){
    if(!form.dateReceived) return;
    if (sub && !form.baseAmount) return;
    if (!sub && !form.amountReceived) return;
    setSaving(true);
    try {
      const settled = sub ? base : Number(form.amountReceived);
      const finalAmount = sub ? netAmountToBank : Number(form.amountReceived);
      await addReceipt({
        raBillId: raBill.docId, raBillNo: raBill.raBillNo,
        billingProjectId: raBill.billingProjectId,
        leafPath: (raBill.claims||(raBill.leafPath?[{leafPath:raBill.leafPath}]:[])).map(c=>c.leafPath).join('; '),
        client: raBill.client, project: raBill.project||'',
        amountClaimed: raBill.amountClaimed,
        billAmountSettled: settled,
        amountReceived: finalAmount,
        dateReceived: form.dateReceived, paymentMode: form.paymentMode, refNumber: form.refNumber, notes: form.notes,
        ...(sub ? {
          vprplGst: gst, vprplTdsIT: tdsIT, vprplTdsGST: tdsGST, vprplLabourCess: labourCess, vprplOtherDeduction: otherDed,
          vprplMarginAmt: marginAmt, vprplRecoveryAmt: recoveryAmt, vprplPerformanceSecurity: performanceSecurity,
          vprplRefundAmt: refundAmt, vprplItTds: itTdsOnSub, vprplNetAmount: netAmountToBank,
        } : {})
      });
      const totalSettled = alreadySettled + settled;
      const newPending = Math.max(0, Number(raBill.amountClaimed||0) - totalSettled);
      const status = newPending <= 0 ? 'Fully Received' : 'Partially Received';
      await updateRABill(raBill.docId, { amountReceived: totalSettled, balancePending: newPending, status });
      onClose();
    } catch(e){ console.error(e); alert('Could not record receipt.'); }
    finally{ setSaving(false); }
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'var(--surface)',borderRadius:10,width:560,maxHeight:'92vh',overflowY:'auto',boxShadow:'0 8px 40px rgba(0,0,0,.22)'}} onClick={e=>e.stopPropagation()}>
        <div style={{background:'var(--green)',padding:'14px 18px',position:'sticky',top:0,zIndex:1}}>
          <span style={{fontWeight:700,fontSize:14,color:'#fff'}}>✓ Record Receipt — {raBill.raBillNo}</span>
        </div>
        <div style={{padding:'18px 20px'}}>
          {/* Cross-reference summary */}
          <div style={{background:'var(--green-50)',border:'1px solid #C8E6C9',borderRadius:6,padding:'10px 14px',fontSize:12,marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:12.5,marginBottom:6,color:'var(--green)'}}>Cross-Reference</div>
            <div className="flex justify-between mt-1"><span style={{color:'var(--text-muted)'}}>Client</span><strong>{raBill.client}</strong></div>
            <div className="flex justify-between mt-1"><span style={{color:'var(--text-muted)'}}>Claimed Against</span><span style={{textAlign:'right',maxWidth:220}}>{(raBill.claims||(raBill.leafPath?[{leafPath:raBill.leafPath}]:[])).map(c=>c.leafPath).join('; ')||'—'}</span></div>
            <div style={{borderTop:'1px solid #C8E6C9',marginTop:8,paddingTop:8}}>
              <div className="flex justify-between"><span style={{color:'var(--text-muted)'}}>Total Claimed (excl. GST)</span><span className="amount fw-600">{inr(raBill.amountClaimed||0)}</span></div>
              <div className="flex justify-between mt-1"><span style={{color:'var(--text-muted)'}}>Already Settled</span><span className="amount" style={{color:'var(--green)'}}>{inr(alreadySettled)}</span></div>
              <div className="flex justify-between mt-1"><span style={{color:'var(--text-muted)'}}>Balance Pending</span><span className="amount fw-600" style={{color:'var(--red)'}}>{inr(pendingBalance)}</span></div>
            </div>
          </div>

          {sub && (
            <div style={{background:'var(--primary-50)',border:'1px solid var(--primary)',borderRadius:6,padding:'10px 14px',fontSize:11.5,marginBottom:16}}>
              <div className="flex justify-between"><span>VPRPL Investment Remaining</span><span className="amount fw-600">{inr(remainingInvestment)}</span></div>
              <div className="flex justify-between mt-1"><span>Security Deposit Remaining</span><span className="amount fw-600">{inr(remainingDeposit)}</span></div>
              <div style={{marginTop:4,color:'var(--primary)',fontWeight:600}}>
                {inRecoveryPhase ? `Currently in recovery phase — ${sub.marginPct+sub.recoveryPct}% total (${sub.marginPct}% margin + ${sub.recoveryPct}% recovery)` : `Investment fully recovered — ${sub.marginPct}% margin only`}
              </div>
            </div>
          )}

          {!sub ? (
            <div className="form-group">
              <label className="form-label">Amount Received Now (₹)</label>
              <input className="form-input font-mono" value={form.amountReceived}
                onChange={e=>set('amountReceived',e.target.value)} autoFocus />
              {form.amountReceived && (
                <div style={{fontSize:11.5,marginTop:4,color:isOver?'var(--amber)':isShort?'var(--primary)':'var(--green)',fontWeight:500}}>
                  {isOver  && `⚠ Exceeds balance by ${inr(Number(form.amountReceived)-pendingBalance)}`}
                  {isShort && `Partial payment — balance remaining: ${inr(newBalance)}`}
                  {!isOver && !isShort && '✓ Full balance cleared'}
                </div>
              )}
            </div>
          ) : (
            <>
              <div className="form-group">
                <label className="form-label">Bill Amount Settled Now (₹, excl. GST)</label>
                <input className="form-input font-mono" value={form.baseAmount} onChange={e=>set('baseAmount',e.target.value)} autoFocus />
                {form.baseAmount && (
                  <div style={{fontSize:11.5,marginTop:4,color:baseIsOver?'var(--amber)':baseIsShort?'var(--primary)':'var(--green)',fontWeight:500}}>
                    {baseIsOver  && `⚠ Exceeds balance by ${inr(base-pendingBalance)}`}
                    {baseIsShort && `Partial — balance remaining: ${inr(pendingBalance-base)}`}
                    {!baseIsOver && !baseIsShort && '✓ Full balance cleared'}
                  </div>
                )}
              </div>
              <div className="form-grid">
                <div className="form-group">
                  <label className="form-label">TDS - IT (₹)</label>
                  <input className="form-input font-mono" value={form.tdsIT} onChange={e=>set('tdsIT',e.target.value)} placeholder="0" />
                </div>
                <div className="form-group">
                  <label className="form-label">TDS - GST (₹)</label>
                  <input className="form-input font-mono" value={form.tdsGST} onChange={e=>set('tdsGST',e.target.value)} placeholder="0" />
                </div>
              </div>
              <div className="form-grid">
                <div className="form-group">
                  <label className="form-label">Labour Cess (₹)</label>
                  <input className="form-input font-mono" value={form.labourCess} onChange={e=>set('labourCess',e.target.value)} placeholder="0" />
                </div>
                <div className="form-group">
                  <label className="form-label">Any Other Deduction (₹)</label>
                  <input className="form-input font-mono" value={form.otherDeduction} onChange={e=>set('otherDeduction',e.target.value)} placeholder="0" />
                </div>
              </div>

              {base>0 && (
                <div style={{border:'1px solid var(--border)',borderRadius:6,padding:'10px 14px',fontSize:11.5,marginBottom:16}}>
                  <div style={{fontWeight:700,marginBottom:6}}>Settlement Breakdown</div>
                  <div className="flex justify-between mt-1"><span>GST @ {gstPct}%</span><span className="amount">{inr(gst)}</span></div>
                  <div className="flex justify-between mt-1"><span>Total Deductions</span><span className="amount">{inr(totalDeductions)}</span></div>
                  <div className="flex justify-between mt-1"><span>Payment Received (excl. GST)</span><span className="amount">{inr(paymentRecvExclGst)}</span></div>
                  <div className="flex justify-between mt-1" style={{color:'var(--primary)'}}><span>VPRPL Margin ({sub.marginPct}%)</span><span className="amount">{inr(marginAmt)}</span></div>
                  {recoveryAmt>0 && <div className="flex justify-between mt-1" style={{color:'var(--primary)'}}><span>VPRPL Investment Recovery</span><span className="amount">{inr(recoveryAmt)}</span></div>}
                  <div className="flex justify-between mt-1"><span>Balance Payment (excl. GST)</span><span className="amount">{inr(balancePaymentExclGst)}</span></div>
                  <div className="flex justify-between mt-1"><span>Sub-Contracted Value incl. GST</span><span className="amount">{inr(subContractedInclGst)}</span></div>
                  <div className="flex justify-between mt-1" style={{color:'var(--amber)'}}><span>Less Performance Security (3%)</span><span className="amount">−{inr(performanceSecurity)}</span></div>
                  {refundAmt>0 && <div className="flex justify-between mt-1" style={{color:'var(--green)'}}><span>Add Security Deposit Refund</span><span className="amount">+{inr(refundAmt)}</span></div>}
                  <div className="flex justify-between mt-1" style={{color:'var(--amber)'}}><span>Less IT-TDS on Sub-Contractor (2%)</span><span className="amount">−{inr(itTdsOnSub)}</span></div>
                  <div style={{borderTop:'1px solid var(--border)',marginTop:6,paddingTop:6}} className="flex justify-between">
                    <span style={{fontWeight:700}}>Net Amount to Bank Account</span>
                    <span className="amount fw-600" style={{color:'var(--green)',fontSize:14}}>{inr(netAmountToBank)}</span>
                  </div>
                </div>
              )}
            </>
          )}

          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">Date Received</label>
              <input className="form-input" type="date" value={form.dateReceived} onChange={e=>set('dateReceived',e.target.value)} />
            </div>
            <div className="form-group">
              <label className="form-label">Payment Mode</label>
              <select className="form-input form-select" value={form.paymentMode} onChange={e=>set('paymentMode',e.target.value)}>
                {(window.appLists?.paymentModes||DEFAULT_LISTS.paymentModes).map(m=><option key={m}>{m}</option>)}
              </select>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Reference / UTR Number</label>
            <input className="form-input font-mono" value={form.refNumber} onChange={e=>set('refNumber',e.target.value)} placeholder="Transaction reference" />
          </div>
          <div className="form-group">
            <label className="form-label">Notes</label>
            <input className="form-input" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Optional" />
          </div>
        </div>
        <div style={{padding:'0 20px 20px',display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={onClose} className="btn btn-ghost">Cancel</button>
          <button onClick={handleSave} disabled={saving||!form.dateReceived||(sub?!form.baseAmount:!form.amountReceived)} className="btn btn-primary"
            style={{background:'var(--green)',opacity:saving||!form.dateReceived||(sub?!form.baseAmount:!form.amountReceived)?0.6:1}}>
            {saving?'Saving…':'Record Receipt'}
          </button>
        </div>
      </div>
    </div>
  );
}

// RECEIPTS MODULE — main view
// ════════════════════════════════════════════════════
function Receipts() {
  const { items: schedules,  loading: schedLoading  } = useBillingSchedules();
  const { items: raBills,    loading: raBillLoading  } = useRABills();
  const { items: receipts,   loading: recLoading     } = useReceipts();

  const [tab, setTab] = useState('projects');
  const [showNewProject,   setShowNewProject]    = useState(false);
  const [editingProject,   setEditingProject]     = useState(null);
  const [openingBalanceFor,setOpeningBalanceFor]  = useState(null);
  const [showNewRABill,    setShowNewRABill]      = useState(false);
  const [claimContext,     setClaimContext]       = useState(null); // {projectId, leafId} from a tree "+Claim"
  const [recordingFor,     setRecordingFor]       = useState(null);
  const [editingGSTFor,    setEditingGSTFor]      = useState(null);
  const [expandedProject,  setExpandedProject]    = useState(null);

  const RA_STATUS_COLOR = { 'Submitted':'blue','Partially Received':'amber','Fully Received':'green' };

  // ── Stats (rolled up across every billing project's tree) ──
  const totalContract = schedules.reduce((s,sc)=>s+Number(sc.contractValue||0),0);
  const projectTotals = schedules.map(sc => {
    const byLeaf = indexRABillsByLeaf(raBills, sc.docId);
    return (sc.tree||[]).reduce((acc,n) => {
      const t = computeNodeTotals(n, byLeaf);
      return { claimed: acc.claimed+t.claimed, received: acc.received+t.received };
    }, {claimed:0, received:0});
  });
  const totalClaimed  = projectTotals.reduce((s,t)=>s+t.claimed,0);
  const totalReceived = projectTotals.reduce((s,t)=>s+t.received,0);
  const totalPending  = Math.max(0, totalClaimed - totalReceived);

  function openClaimModal(projectId, leafId) {
    setClaimContext({ projectId, leafId });
  }

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Receipts</div>
          <div className="section-sub">Billing Projects (Schedule → Item → Sub-item) → RA Bills → Receipts</div>
        </div>
        <div className="flex gap-2">
          <button className="btn btn-primary" style={{background:'var(--green)'}} onClick={()=>setShowNewProject(true)}>+ Billing Project</button>
          <button className="btn btn-primary" onClick={()=>setShowNewRABill(true)}>+ Submit RA Bill</button>
          <ClearCollectionButton label="Clear All" count={schedules.length+raBills.length+receipts.length} onClear={clearAllReceipts} />
        </div>
      </div>

      {/* Stats */}
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <div className="stat-card"><div className="stat-label">Total Contract Value</div><div className="stat-value">{inr(totalContract)}</div></div>
        <div className="stat-card"><div className="stat-label">Total Billed (Claimed)</div><div className="stat-value blue">{inr(totalClaimed)}</div></div>
        <div className="stat-card"><div className="stat-label">Total Received</div><div className="stat-value green">{inr(totalReceived)}</div></div>
        <div className="stat-card"><div className="stat-label">Balance Pending</div><div className="stat-value red">{inr(totalPending)}</div></div>
      </div>

      {/* Tabs */}
      <div className="tabs">
        <div className={`tab ${tab==='projects'?'active':''}`} onClick={()=>setTab('projects')}>📋 Billing Projects</div>
        <div className={`tab ${tab==='rabills'?'active':''}`} onClick={()=>setTab('rabills')}>
          📄 RA Bills
          {totalPending>0 && <span className="nav-badge" style={{background:'var(--amber)',marginLeft:8}}>{raBills.filter(b=>b.status!=='Fully Received').length}</span>}
        </div>
        <div className={`tab ${tab==='receipts'?'active':''}`} onClick={()=>setTab('receipts')}>✓ All Receipts</div>
      </div>

      {/* ── TAB 1: BILLING PROJECTS (tree view) ── */}
      {tab==='projects' && (
        <div className="card">
          {schedLoading ? (
            <div className="module-coming"><div className="big-icon">⏳</div><p className="text-muted">Loading…</p></div>
          ) : schedules.length===0 ? (
            <div className="module-coming">
              <div className="big-icon">📋</div>
              <h3>No billing projects yet</h3>
              <p className="text-muted">Create a billing project per client/contract — build the Schedule → Item → Sub-item tree from your approved billing breakup.</p>
            </div>
          ) : schedules.map(sc => {
            const byLeaf = indexRABillsByLeaf(raBills, sc.docId);
            const totals = (sc.tree||[]).reduce((acc,n) => {
              const t = computeNodeTotals(n, byLeaf);
              return { capAmount: acc.capAmount+t.capAmount, claimed: acc.claimed+t.claimed, received: acc.received+t.received };
            }, {capAmount:0, claimed:0, received:0});
            const pending = Math.max(0, totals.claimed - totals.received);
            const pct = sc.contractValue>0 ? Math.round((totals.received/sc.contractValue)*100) : 0;
            const isExp = expandedProject===sc.docId;

            return (
              <div key={sc.docId} style={{borderBottom:'1px solid var(--border)'}}>
                <div style={{padding:'12px 16px',cursor:'pointer',display:'flex',alignItems:'center',gap:12}}
                  onClick={()=>setExpandedProject(isExp?null:sc.docId)}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13}}>{sc.client}{sc.contractNo?` — Contract ${sc.contractNo}`:''}</div>
                    <div style={{fontSize:11.5,color:'var(--text-muted)',marginTop:2}}>
                      {sc.project && <span className={`badge ${PROJECT_COLOR[sc.project]||'grey'}`} style={{marginRight:6}}>{sc.project}</span>}
                      Contract Value: <span className="amount">{inr(sc.contractValue||0)}</span>
                    </div>
                  </div>
                  <div style={{textAlign:'right',minWidth:280}}>
                    <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginBottom:5,flexWrap:'wrap'}}>
                      <span style={{fontSize:11.5}}>Claimed: <strong className="amount">{inr(totals.claimed)}</strong></span>
                      <span style={{fontSize:11.5,color:'var(--green)'}}>Rcvd: <strong className="amount">{inr(totals.received)}</strong></span>
                      <span style={{fontSize:11.5,color:pending>0?'var(--red)':'var(--green)'}}>Pending: <strong className="amount">{inr(pending)}</strong></span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div className="progress-wrap" style={{flex:1,height:8}}>
                        <div className="progress-fill green" style={{width:`${Math.min(100,pct)}%`}} />
                      </div>
                      <span style={{fontSize:11,color:'var(--text-muted)',width:32}}>{pct}%</span>
                    </div>
                  </div>
                  <span style={{fontSize:12,color:'var(--text-muted)',marginLeft:4}}>{isExp?'▲':'▼'}</span>
                </div>

                {isExp && (
                  <div style={{background:'var(--grey-50)',borderTop:'1px solid var(--border)',padding:'12px 16px'}}>
                    <div className="flex gap-2" style={{marginBottom:10}}>
                      <button className="btn btn-sm btn-outline" onClick={()=>setOpeningBalanceFor(sc)}>Set Opening Balances</button>
                      <button className="btn btn-sm btn-outline" onClick={()=>setEditingProject(sc)}>Edit Tree</button>
                      <button className="btn btn-sm btn-ghost" style={{color:'var(--red)'}}
                        onClick={()=>{if(confirm('Delete this billing project and all linked RA bills?'))deleteBillingSchedule(sc.docId);}}>
                        Delete Project
                      </button>
                    </div>
                    <BillingTreeProgressView project={sc} raBills={raBills} onClaim={(leaf)=>openClaimModal(sc.docId, leaf.id)} />
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* ── TAB 2: RA BILLS ── */}
      {tab==='rabills' && (
        <div className="card">
          {raBillLoading ? (
            <div className="module-coming"><div className="big-icon">⏳</div><p className="text-muted">Loading…</p></div>
          ) : raBills.length===0 ? (
            <div className="module-coming">
              <div className="big-icon">📄</div>
              <h3>No RA bills submitted yet</h3>
              <p className="text-muted">Submit a running bill against a billing project's line item.</p>
            </div>
          ) : (
            <table>
              <thead>
                <tr><th>RA Bill #</th><th>Client</th><th>Claimed Against</th><th>Date Submitted</th><th>Claimed</th><th>GST</th><th>Received</th><th>Pending</th><th>Status</th><th>Actions</th></tr>
              </thead>
              <tbody>
                {raBills.map(b=>(
                  <tr key={b.docId} style={{background:b.status==='Fully Received'?'var(--green-50)':b.status==='Partially Received'?'var(--amber-50)':''}}>
                    <td className="mono" style={{whiteSpace:'nowrap'}}>{b.raBillNo}</td>
                    <td className="fw-600">{b.client}</td>
