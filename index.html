// PETTY CASH — day-to-day small cash expenses
// ════════════════════════════════════════════════════
const PETTY_COLLECTION = 'petty_cash';
const PETTY_CATEGORIES = [
  'Auto / Fuel',
  'Tea & Snacks',
  'Courier',
  'Stationery',
  'Site Travel',
  'Minor Hardware',
  'Telephone / Recharge',
  'Printing',
  'Bank Charges',
  'Miscellaneous',
];

function usePettyCash() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    function start() {
      const { db, collection, query, orderBy, onSnapshot } = window.fb;
      const unsub = onSnapshot(
        query(userCol(PETTY_COLLECTION), orderBy('createdAt','desc')),
        snap => { setItems(snap.docs.map(d=>({docId:d.id,...d.data()}))); setLoading(false); },
        err  => { console.error('Petty cash listener',err); setLoading(false); }
      );
      return unsub;
    }
    if (window.fb && getUserUID()) { const u=start(); return ()=>u&&u(); }
    let u;
    const h=()=>{ if(getUserUID()) u=start(); };
    const hu=()=>{ if(u) u(); if(window.fb) u=start(); };
    window.addEventListener('firebase-ready',h,{once:true});
    window.addEventListener('user-ready',hu,{once:true});
    return ()=>{ window.removeEventListener('firebase-ready',h); window.removeEventListener('user-ready',hu); if(u) u(); };
  },[]);
  return {items,loading};
}

async function addPettyEntry(data) {
  const { db, collection, addDoc } = window.fb;
  await addDoc(userCol(PETTY_COLLECTION), {...data, createdAt:Date.now()});
}
async function deletePettyEntry(docId) {
  const { db, doc, deleteDoc } = window.fb;
  await deleteDoc(userDoc(PETTY_COLLECTION, docId));
}
async function clearAllPettyCash() {
  const { db, collection, getDocs, writeBatch } = window.fb;
  const snap = await getDocs(userCol(PETTY_COLLECTION));
  const batch = writeBatch(db);
  snap.docs.forEach(d=>batch.delete(d.ref));
  await batch.commit();
}

// ─── New Petty Cash Entry Modal ────────────────────
function NewPettyModal({ onClose, currentUser, existing }) {
  const isEdit = !!existing;
  const knownNames = useKnownNames();
  const lists = useLists();
  const { items: wos } = useWorkOrders();
  const [form, setForm] = useState(isEdit ? {
    date: existing.date||'', amount: existing.amount ? String(existing.amount) : '',
    category: existing.category||'Auto / Fuel', paidBy: existing.paidBy||'',
    description: existing.description||'', project: existing.project||'',
    split: existing.split||{pontoon:50,wtp:50}, gstPct: existing.gstPct||'',
  } : {
    date: new Date().toISOString().slice(0,10),
    amount: '', category: 'Auto / Fuel',
    paidBy: currentUser ? currentUser.name : 'Neer',
    description: '', project: '', split: {pontoon:50,wtp:50}, gstPct: '',
  });
  const [saving, setSaving] = useState(false);
  function set(f,v){setForm(s=>({...s,[f]:v}));}

  const baseAmt  = Number(form.amount)||0;
  const gstRate  = parseFloat(form.gstPct||0)/100;
  const gstAmt   = gstRate > 0 ? Math.round(baseAmt * gstRate) : 0;
  const totalAmt = baseAmt + gstAmt;

  async function handleSave() {
    if (!form.amount || !form.description.trim() || !form.date) return;
    setSaving(true);
    try {
      const data = {...form, amount: Number(form.amount),
        gstPct: form.gstPct||'', gstAmount: gstAmt, totalAmount: totalAmt};
      if (isEdit) {
        const { updateDoc } = window.fb;
        await updateDoc(userDoc(PETTY_COLLECTION, existing.docId), data);
      } else {
        await addPettyEntry(data);
      }
      onClose();
    } catch(e){ console.error(e); alert('Could not save entry.'); }
    finally{ setSaving(false); }
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'var(--surface)',borderRadius:10,width:480,maxHeight:'88vh',overflowY:'auto',boxShadow:'0 8px 40px rgba(0,0,0,.22)'}} onClick={e=>e.stopPropagation()}>
        <div style={{background:'var(--secondary)',padding:'14px 18px',position:'sticky',top:0,zIndex:1}}>
          <span style={{fontWeight:700,fontSize:14,color:'#fff'}}>{isEdit ? '✏ Edit Entry' : '+ Petty Cash Entry'}</span>
        </div>
        <div style={{padding:'18px 20px'}}>
          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">Date</label>
              <input className="form-input" type="date" value={form.date} onChange={e=>set('date',e.target.value)} />
            </div>
            <div className="form-group">
              <label className="form-label">Amount (₹) <span style={{color:'var(--text-muted)',fontWeight:400,fontSize:11}}>base</span></label>
              <input className="form-input font-mono" value={form.amount} onChange={e=>set('amount',e.target.value)} placeholder="0" autoFocus />
            </div>
          </div>
          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">GST % <span style={{color:'var(--text-muted)',fontWeight:400,fontSize:11}}>(optional)</span></label>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <input className="form-input font-mono" style={{width:80}} value={form.gstPct} onChange={e=>set('gstPct',e.target.value)} placeholder="0" />
                {gstAmt > 0 && <span style={{fontSize:12,color:'var(--primary)',whiteSpace:'nowrap'}}>
                  GST: {inr(gstAmt)} · Total: {inr(totalAmt)}
                </span>}
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">Category</label>
              <select className="form-input form-select" value={form.category} onChange={e=>set('category',e.target.value)}>
                {(lists.pettyCategories||DEFAULT_LISTS.pettyCategories).map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Paid By</label>
            <select className="form-input form-select" value={form.paidBy} onChange={e=>set('paidBy',e.target.value)}>
              {(lists.employees||DEFAULT_LISTS.employees).map(n=><option key={n}>{n}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Description</label>
            <input className="form-input" value={form.description} onChange={e=>set('description',e.target.value)} placeholder="e.g. Petrol for site visit — Thane" />
          </div>
          <ProjectSelect value={form.project} onChange={v=>set('project',v)} split={form.split} onSplitChange={v=>set('split',v)} />
        </div>
        <div style={{padding:'0 20px 20px',display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={onClose} className="btn btn-ghost">Cancel</button>
          <button onClick={handleSave} disabled={saving||!form.amount||!form.description.trim()} className="btn btn-primary"
            style={{background:'var(--secondary)',opacity:saving||!form.amount||!form.description.trim()?0.6:1}}>
            {saving?'Saving…': isEdit ? 'Save Changes' : 'Save Entry'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Petty Cash Module ──────────────────────────────
function PettyCash({ currentUser }) {
  const { items, loading } = usePettyCash();
  const [showNew, setShowNew] = useState(false);
  const [catFilter, setCatFilter] = useState('all');
  const [paidByFilter, setPaidByFilter] = useState('all');
  const [monthFilter, setMonthFilter] = useState('all');
  const [editEntry, setEditEntry] = useState(null);
  const [pettySortBy, setPettySortBy] = useState('date_desc');
  const [pettyProjectFilter, setPettyProjectFilter] = useState('all');

  const months = [...new Set(items.map(i=>i.date?.slice(0,7)).filter(Boolean))].sort().reverse();

  function sortPetty(arr) {
    const s = [...arr];
    if (pettySortBy==='date_asc')    return s.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if (pettySortBy==='date_desc')   return s.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if (pettySortBy==='amount_desc') return s.sort((a,b)=>Number(b.amount||0)-Number(a.amount||0));
    if (pettySortBy==='amount_asc')  return s.sort((a,b)=>Number(a.amount||0)-Number(b.amount||0));
    if (pettySortBy==='desc_asc')    return s.sort((a,b)=>(a.description||'').localeCompare(b.description||''));
    return s;
  }

  const filtered = sortPetty(items.filter(i=>
    (catFilter==='all' || i.category===catFilter) &&
    (paidByFilter==='all' || normName(i.paidBy)===paidByFilter) &&
    (monthFilter==='all' || (i.date||'').startsWith(monthFilter)) &&
    (pettyProjectFilter==='all' || i.project===pettyProjectFilter)
  ));

  const total = filtered.reduce((s,i)=>s+(Number(i.totalAmount||0)||Number(i.amount||0)),0);
  const totalAll = items.reduce((s,i)=>s+(Number(i.totalAmount||0)||Number(i.amount||0)),0);

  // Category breakdown for filtered period
  const activePettyCategories = window.appLists?.pettyCategories || DEFAULT_LISTS.pettyCategories;
  const byCategory = activePettyCategories.map(cat=>({
    cat,
    amt: filtered.filter(i=>i.category===cat).reduce((s,i)=>s+(Number(i.totalAmount||0)||Number(i.amount||0)),0)
  })).filter(c=>c.amt>0).sort((a,b)=>b.amt-a.amt);

  // Normalise paidBy: strip email domain if stored as email
  function normName(v) {
    if (!v) return '';
    if (!v.includes('@')) return v;
    const n = v.split('@')[0];
    return n.charAt(0).toUpperCase() + n.slice(1);
  }

  // Paid by breakdown — group by normalised name
  const personTotals = {};
  filtered.forEach(i => {
    const n = normName(i.paidBy) || 'Unknown';
    personTotals[n] = (personTotals[n]||0) + (Number(i.totalAmount||0)||Number(i.amount||0));
  });
  const byPerson = Object.entries(personTotals).map(([person,amt])=>({person,amt})).filter(p=>p.amt>0).sort((a,b)=>b.amt-a.amt);

  // Unique staff names (normalised) for dropdown
  const staffOptions = [...new Set(items.map(i=>normName(i.paidBy)).filter(Boolean))].sort();

  const thisMonth = new Date().toISOString().slice(0,7);
  const thisMonthTotal = items.filter(i=>(i.date||'').startsWith(thisMonth)).reduce((s,i)=>s+Number(i.amount||0),0);

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Petty Cash</div>
          <div className="section-sub">{loading?'Loading…':`${items.length} entries · all time`}</div>
        </div>
        <div className="flex gap-2">
          <button className="btn btn-primary" style={{background:'var(--secondary)'}} onClick={()=>setShowNew(true)}>+ Add Entry</button>
          <ClearCollectionButton label="Clear All" count={items.length} onClear={clearAllPettyCash} />
        </div>
      </div>

      {/* Stats */}
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <div className="stat-card">
          <div className="stat-label">This Month</div>
          <div className="stat-value red">{inr(thisMonthTotal)}</div>
          <div className="stat-sub">{new Date().toLocaleString('en-IN',{month:'long',year:'numeric'})}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Filtered Total</div>
          <div className="stat-value">{inr(total)}</div>
          <div className="stat-sub">{filtered.length} entries</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Top Category</div>
          <div className="stat-value blue" style={{fontSize:14}}>{byCategory[0]?.cat||'—'}</div>
          <div className="stat-sub">{byCategory[0]?inr(byCategory[0].amt):''}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">All-Time Total</div>
          <div className="stat-value">{inr(totalAll)}</div>
        </div>
      </div>

      {/* Category + Person breakdown */}
      {filtered.length > 0 && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
          <div className="card">
            <div className="card-header"><span className="card-title">By Category</span></div>
            <div className="card-body">
              {byCategory.map(c=>(
                <div key={c.cat} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                  <span style={{fontSize:12,color:'var(--text-secondary)',width:150,flexShrink:0}}>{c.cat}</span>
                  <div className="progress-wrap" style={{flex:1}}>
                    <div className="progress-fill blue" style={{width:`${total>0?Math.round((c.amt/total)*100):0}%`}} />
                  </div>
                  <span className="amount text-sm" style={{width:80,textAlign:'right'}}>{inr(c.amt)}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="card-header"><span className="card-title">By Staff</span></div>
            <div className="card-body">
              {byPerson.map(p=>(
                <div key={p.person} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                  <div style={{width:28,height:28,borderRadius:'50%',background:'var(--primary)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>
                    {p.person[0]}
                  </div>
                  <span style={{fontSize:12,color:'var(--text-secondary)',flex:1}}>{p.person}</span>
                  <div className="progress-wrap" style={{width:100}}>
                    <div className="progress-fill teal" style={{width:`${total>0?Math.round((p.amt/total)*100):0}%`,background:'var(--secondary)'}} />
                  </div>
                  <span className="amount text-sm" style={{width:80,textAlign:'right'}}>{inr(p.amt)}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Filters + table */}
      <div className="card">
        <div className="card-body" style={{paddingTop:10,paddingBottom:10}}>
          <div className="flex gap-2" style={{flexWrap:'wrap'}}>
            <select className="form-input form-select" style={{width:160}} onChange={e=>setCatFilter(e.target.value)}>
              <option value="all">All Categories</option>
              {activePettyCategories.map(c=><option key={c}>{c}</option>)}

              <option value="amount_asc">↑ Amount (Lowest)</option>
              <option value="desc_asc">A→Z Description</option>
            </select>
          </div>
        </div>
        {loading ? (
          <div className="module-coming"><div className="big-icon">⏳</div><p className="text-muted">Connecting to Firestore…</p></div>
        ) : filtered.length===0 ? (
          <div className="module-coming">

const EXPENSE_COLLECTION = 'expenses';

function useExpenses() {
  const [items, setItems] = useState([]);

  useEffect(() => {
    function start() {
      const { query, orderBy, onSnapshot } = window.fb;
      const unsub = onSnapshot(
        query(userCol(EXPENSE_COLLECTION), orderBy('createdAt','desc')),
        snap => { setItems(snap.docs.map(d=>({docId:d.id,...d.data()}))); setLoading(false); },
        err  => { console.error('Expenses listener',err); setLoading(false); }
      );
      return unsub;
    }
    if (window.fb && getUserUID()) { const u=start(); return ()=>u&&u(); }

    const hu=()=>{ if(u) u(); if(window.fb) u=start(); };
    window.addEventListener('firebase-ready',h,{once:true});
    window.addEventListener('user-ready',hu,{once:true});
    return ()=>{ window.removeEventListener('firebase-ready',h); window.removeEventListener('user-ready',hu); if(u) u(); };

function Expenses({ currentUser }) {

  const [expProjectFilter, setExpProjectFilter] = useState('all');
  const [expSortBy, setExpSortBy] = useState('date_desc');

  const months = [...new Set(items.map(i=>i.date?.slice(0,7)).filter(Boolean))].sort().reverse();

  function sortExp(arr) {
    const s = [...arr];
    if (expSortBy==='date_asc')    return s.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if (expSortBy==='date_desc')   return s.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if (expSortBy==='amount_desc') return s.sort((a,b)=>Number(b.amount||0)-Number(a.amount||0));
    if (expSortBy==='amount_asc')  return s.sort((a,b)=>Number(a.amount||0)-Number(b.amount||0));
    if (expSortBy==='desc_asc')    return s.sort((a,b)=>(a.description||'').localeCompare(b.description||''));
    return s;
  }

  const expVendors = [...new Set(items.map(i=>i.vendor).filter(Boolean))].sort();
  const filtered = sortExp(items.filter(i=>
    (catFilter==='all'||i.category===catFilter) &&
    (modeFilter==='all'||i.paymentMode===modeFilter) &&
    (monthFilter==='all'||(i.date||'').startsWith(monthFilter)) &&
    (expVendorFilter==='all'||i.vendor===expVendorFilter) &&
    (expProjectFilter==='all'||i.project===expProjectFilter)
  ));

  const total    = filtered.reduce((s,i)=>s+Number(i.amount||0),0);
  const thisMonth = new Date().toISOString().slice(0,7);
  const thisMonthTotal = items.filter(i=>(i.date||'').startsWith(thisMonth)).reduce((s,i)=>s+Number(i.amount||0),0);

  const byCategory = Object.entries(
    filtered.reduce((acc,i)=>{ const c=i.category||'Other'; acc[c]=(acc[c]||0)+Number(i.amount||0); return acc; },{})

      </div>

      {byCategory.length > 0 && (

          <div className="card-header"><span className="card-title">By Category</span></div>

function RepayCapitalModal({ entry, onClose }) {
  const [date, setDate]     = useState(new Date().toISOString().slice(0,10));

  const repayAmt       = Number(amount)||0;
  const newTotalRepaid = totalRepaid + repayAmt;
  const newOutstanding = Math.max(0, Number(entry.amount||0) - newTotalRepaid);
  const isFullyRepaid  = newOutstanding <= 0;

  async function handleSave() {
    if (!amount || !date) return;
    setSaving(true);
    try {
      const { updateDoc } = window.fb;
      const repayment = { date, amount: repayAmt, mode, ref, notes, createdAt: Date.now() };

        repayments,
        totalRepaid: newTotalRepaid,
        fullyRepaid: isFullyRepaid,
      });
      onClose();

    finally { setSaving(false); }
  }

              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:600}}>LOAN AMOUNT</div>
              <div className="amount" style={{fontWeight:700,color:'var(--green)'}}>{inr(entry.amount||0)}</div>
            </div>
            <div style={{padding:'8px 12px',background:'#FEF2F2',borderRadius:6,border:'1px solid var(--red)'}}>
              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:600}}>REPAID SO FAR</div>
              <div className="amount" style={{fontWeight:700,color:'var(--red)'}}>{inr(totalRepaid)}</div>
            </div>
            <div style={{padding:'8px 12px',background:'#FFF7ED',borderRadius:6,border:'1px solid var(--amber)'}}>
              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:600}}>OUTSTANDING</div>

              </div>
            </div>
          </div>
          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">Payment Mode</label>
              <select className="form-input form-select" value={mode} onChange={e=>setMode(e.target.value)}>

            <div className="form-group">
              <label className="form-label">Reference #</label>
              <input className="form-input font-mono" value={ref} onChange={e=>setRef(e.target.value)} placeholder="UTR / Ref number" />
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Notes</label>
            <input className="form-input" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional" />
          </div>

          {/* Preview */}
          {repayAmt > 0 && (
            <div style={{padding:'10px 14px',background:isFullyRepaid?'#F0FFF4':'#FFF7ED',borderRadius:6,border:`1px solid ${isFullyRepaid?'var(--green)':'var(--amber)'}`,fontSize:12}}>
              {isFullyRepaid
                ? <span style={{color:'var(--green)',fontWeight:600}}>✓ After this payment the loan will be <strong>Fully Repaid</strong></span>
                : <span style={{color:'var(--amber)'}}>Outstanding after repayment: <strong>{inr(newOutstanding)}</strong></span>}
            </div>
          )}
        </div>
        <div style={{padding:'0 20px 20px',display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={onClose} className="btn btn-ghost">Cancel</button>
          <button onClick={handleSave} disabled={saving||!amount||!date} className="btn btn-primary" style={{background:'var(--red)',opacity:saving||!amount||!date?0.6:1}}>
            {saving?'Saving…':'Record Repayment'}
          </button>
        </div>
      </div>
    </div>
  );
}

function NewCapitalModal({ onClose, existing }) {
  const isEdit = !!existing;
  const knownNames = useKnownNames();
  const [form, setForm] = useState(isEdit ? {
    type: existing.type||'Bank Loan', source: existing.source||'',
    amount: existing.amount ? String(existing.amount) : '',
    dateReceived: existing.dateReceived||'', paymentMode: existing.paymentMode||'NEFT',
    refNumber: existing.refNumber||'', notes: existing.notes||'',
    isLoan: existing.isLoan||false, emiAmount: existing.emiAmount ? String(existing.emiAmount) : '',
    tenureMonths: existing.tenureMonths ? String(existing.tenureMonths) : '',
    emiStartDate: existing.emiStartDate||'', interestRate: existing.interestRate ? String(existing.interestRate) : '', project: existing.project||''
  } : {
    type: 'Bank Loan', source: '', amount: '', dateReceived: new Date().toISOString().slice(0,10),

function CapitalLoans() {
  const { items, loading } = useCapitalLoans();
  const [showNew, setShowNew] = useState(false);
  const [editCapital, setEditCapital] = useState(null);
  const [repayEntry, setRepayEntry] = useState(null);
  const [sortBy, setSortBy] = useState('date_desc');
  const [capTypeFilter, setCapTypeFilter] = useState('all');
  const [capProjectFilter, setCapProjectFilter] = useState('all');
  const [capMonthFilter, setCapMonthFilter] = useState('all');
  const [capLenderFilter, setCapLenderFilter] = useState('all');

  const totalInflow    = items.reduce((s,i) => s + Number(i.amount||0), 0);
  const totalRepaid    = items.reduce((s,i) => s + Number(i.totalRepaid||0), 0);
  const totalOutstanding = items.filter(i=>i.isRepayable).reduce((s,i) => s + Math.max(0, Number(i.amount||0) - Number(i.totalRepaid||0)), 0);
  const investorFunds  = items.filter(i=>!i.isRepayable).reduce((s,i) => s + Number(i.amount||0), 0);

  const TYPE_COLOR = {
    'Bank Loan':'blue','Overdraft':'amber','Investor Fund':'green',
    'Owner Capital Injection':'teal','Grant':'green','Other':'grey'
  };

  const lenders = [...new Set(items.map(i=>i.source).filter(Boolean))];

  const filtered = [...items].filter(item=>
    (capTypeFilter==='all'||item.type===capTypeFilter) &&
    (capProjectFilter==='all'||item.project===capProjectFilter) &&
    (capLenderFilter==='all'||item.source===capLenderFilter) &&
    (capMonthFilter==='all'||(item.dateReceived||'').startsWith(capMonthFilter))
  ).sort((a,b)=>sortBy==='date_asc'?(a.dateReceived||'').localeCompare(b.dateReceived||''):sortBy==='amount_desc'?Number(b.amount||0)-Number(a.amount||0):sortBy==='amount_asc'?Number(a.amount||0)-Number(b.amount||0):sortBy==='vendor_asc'?(a.source||'').localeCompare(b.source||''):(b.dateReceived||'').localeCompare(a.dateReceived||''));

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Capital & Loans</div>
          <div className="section-sub">Financing inflows — investor funds, bank loans, owner capital</div>
        </div>
        <div className="flex gap-2">
          <button className="btn btn-primary" style={{background:'#1B5E20'}} onClick={()=>setShowNew(true)}>+ Add Inflow</button>
          <ClearCollectionButton label="Clear All" count={items.length} onClear={clearAllCapital} />
        </div>
      </div>

      <div className="stats-grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <div className="stat-card"><div className="stat-label">Total Capital Received</div><div className="stat-value green">{inr(totalInflow)}</div></div>
        <div className="stat-card"><div className="stat-label">Non-Repayable (Equity)</div><div className="stat-value teal">{inr(investorFunds)}</div></div>
        <div className="stat-card"><div className="stat-label">Total Repaid</div><div className="stat-value red">{inr(totalRepaid)}</div></div>
        <div className="stat-card"><div className="stat-label">Outstanding Balance</div><div className="stat-value amber">{inr(totalOutstanding)}</div></div>

        ) : items.length===0 ? (
          <div className="module-coming">
            <div className="big-icon">🏦</div>

            <p className="text-muted">Record investor funds, bank loans, owner capital injections.</p>

                    <td>{fmt(item.dateReceived)}</td>
                    <td className="amount fw-600" style={{color:'var(--green)'}}>{inr(item.amount||0)}</td>
                    <td><span className="badge grey">{item.paymentMode}</span></td>
                    <td className="mono" style={{fontSize:11}}>{item.refNumber||'—'}</td>
                    <td className="amount" style={{color:'var(--red)',fontWeight:600}}>{totalRepaidAmt>0?inr(totalRepaidAmt):'—'}</td>
                    <td className="amount fw-600" style={{color:outstanding>0?'var(--amber)':'var(--green)'}}>

                    <td style={{whiteSpace:'nowrap'}}>
                      <div className="flex gap-2">
                        <button className="btn btn-sm btn-ghost" onClick={()=>setEditCapital(item)}>Edit</button>
                        {item.isRepayable && <button className="btn btn-sm btn-primary" style={{background:'var(--red)',fontSize:11}} onClick={()=>setRepayEntry(item)}>Repay</button>}
                        <button className="btn btn-sm btn-ghost" onClick={()=>{if(confirm('Delete?'))deleteCapitalEntry(item.docId);}}>Delete</button>
                      </div>
                      {repayments.length>0 && (
                        <div style={{marginTop:4}}>
                          {repayments.slice(-2).map((r,i)=>(
                            <div key={i} style={{fontSize:10,color:'var(--text-muted)'}}>{fmt(r.date)}: {inr(r.amount)}</div>

                <td colSpan={4} style={{padding:'8px 12px',fontSize:12,color:'var(--text-secondary)'}}>Subtotal ({filtered.length} entries)</td>
                <td className="amount" style={{fontWeight:700,color:'var(--green)',fontSize:13}}>{inr(filtered.reduce((s,i)=>s+Number(i.amount||0),0))}</td>
                <td colSpan={2}></td>

                <td className="amount" style={{fontWeight:700,color:'var(--amber)',fontSize:13}}>{inr(filtered.reduce((s,i)=>s+(i.isRepayable?Math.max(0,Number(i.amount||0)-Number(i.totalRepaid||0)):0),0))}</td>

      {showNew && <NewCapitalModal onClose={()=>setShowNew(false)} />}

      {repayEntry && <RepayCapitalModal entry={repayEntry} onClose={()=>setRepayEntry(null)} />}
    </div>
  );
}

function ProjectPnL() {
  const { items: bills }     = useBills();
  const { items: advances }  = useAdvances();
  const { items: pos }       = usePurchaseOrders();
  const { items: wos }       = useWorkOrders();
  const { items: receipts }  = useReceipts();
  const { items: petty }     = usePettyCash();
  const { items: expenseItems } = useExpenses();
  const { items: capital }   = useCapitalLoans();

  function calcProject(proj) {
    const projKey = proj === 'Pontoon' ? 'pontoon' : 'wtp';

    function matchAmt(item, amtField) {
      const amt = Number(item[amtField]||0);
      if (item.project === proj) return amt;
      if (item.project === 'Both') {
        const pct = (item.split?.[projKey] ?? 50) / 100;
        return amt * pct;
      }
      return 0;
    }

    // ── INCOME ──────────────────────────────────────
    const receiptIncome = receipts.filter(r => r.project===proj || r.project==='Both')
      .reduce((s,r) => s + matchAmt(r,'amountReceived'), 0);
    const capitalIncome = 0;
    const totalIncome = receiptIncome;

    // ── EXPENSES (Paid / Incurred) ────────────────────
    const billExp    = bills.filter(b => b.project===proj || b.project==='Both').reduce((s,b) => s + matchAmt(b,'amount'), 0);
    const advanceExp = advances.filter(a => a.project===proj || a.project==='Both').reduce((s,a) => s + matchAmt(a,'amount'), 0);
    const pettyExp   = petty.filter(p => p.project===proj || p.project==='Both').reduce((s,p) => s + matchAmt(p,'amount'), 0);
    const bankExp    = expenseItems.filter(e => e.project===proj || e.project==='Both').reduce((s,e) => s + matchAmt(e,'amount'), 0);
    const totalExpenses = billExp + advanceExp + pettyExp + bankExp;

    // ── COMMITMENTS (Not yet paid) ────────────────────
    const poExp = pos.filter(p => p.project===proj || p.project==='Both').reduce((s,p) => s + matchAmt(p,'value'), 0);
    const woExp = wos.filter(w => w.project===proj || w.project==='Both').reduce((s,w) => s + matchAmt(w,'value'), 0);
    const totalCommitted = poExp + woExp;

    const margin    = totalIncome - totalExpenses;
    const marginPct = totalIncome > 0 ? Math.round((margin/totalIncome)*100) : 0;

    return {
      receiptIncome, capitalIncome, totalIncome,
      billExp, advanceExp, poExp, woExp, pettyExp,
      totalExpenses, totalCommitted, margin, marginPct,
      billCount:  bills.filter(b=>b.project===proj||b.project==='Both').length,
      poCount:    pos.filter(p=>p.project===proj||p.project==='Both').length,
      woCount:    wos.filter(w=>w.project===proj||w.project==='Both').length,
      pettyCount: petty.filter(p=>p.project===proj||p.project==='Both').length,
      bankExp, bankCount: expenseItems.filter(e=>e.project===proj||e.project==='Both').length,
    };
  }

  const pontoon = calcProject('Pontoon');
  const wtp     = calcProject('WTP');
  const combined = {
    totalIncome:    pontoon.totalIncome + wtp.totalIncome,
    totalExpenses:  pontoon.totalExpenses + wtp.totalExpenses,
    totalCommitted: pontoon.totalCommitted + wtp.totalCommitted,
    margin:         pontoon.margin + wtp.margin,
  };

  function PnLCard({ label, pData, color }) {
    const isPositive = pData.margin >= 0;
    return (
      <div style={{flex:1,border:`2px solid ${color}`,borderRadius:10,overflow:'hidden'}}>
        {/* Header */}
        <div style={{background:color,padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontWeight:800,fontSize:15,color:'#fff'}}>{label}</span>
          <span style={{fontSize:11,color:'rgba(255,255,255,.75)',fontWeight:500}}>Project P&L</span>
        </div>

        {/* Margin highlight */}

// REMINDERS — auto-generated from live Firestore data
// ════════════════════════════════════════════════════
const REMINDERS_COLLECTION = 'reminders';

function useReminders() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    function start() {
      const { db, collection, query, orderBy, onSnapshot } = window.fb;
      const unsub = onSnapshot(
        query(userCol(REMINDERS_COLLECTION), orderBy('createdAt','desc')),
        snap => { setItems(snap.docs.map(d=>({docId:d.id,...d.data()}))); setLoading(false); },
        err  => { console.error('Reminders listener',err); setLoading(false); }
      );
      return unsub;
    }
    if (window.fb && getUserUID()) { const u=start(); return ()=>u&&u(); }
    let u;
    const hFb=()=>{ if(getUserUID()) u=start(); };
    const hUser=()=>{ if(u) u(); u=start(); };
    window.addEventListener('firebase-ready',hFb,{once:true});
    window.addEventListener('user-ready',hUser,{once:true});
    return ()=>{
      window.removeEventListener('firebase-ready',hFb);
      window.removeEventListener('user-ready',hUser);
      if(u) u();
    };
  },[]);
  return {items,loading};
}
async function addReminder(data) {
  const { db, collection, addDoc } = window.fb;
  await addDoc(userCol(REMINDERS_COLLECTION), {...data, createdAt:Date.now(), done:false});
}
async function toggleReminderDone(docId, done) {
  const { db, doc, updateDoc } = window.fb;
  await updateDoc(userDoc(REMINDERS_COLLECTION, docId), {done:!done, doneAt:!done?Date.now():null});
}
async function deleteReminder(docId) {
  const { db, doc, deleteDoc } = window.fb;
  await deleteDoc(userDoc(REMINDERS_COLLECTION, docId));
}

function NewReminderModal({ onClose }) {
  const [form, setForm] = useState({
    title:'', dueDate:'', priority:'Normal', project:'', notes:''
  });
  const [saving, setSaving] = useState(false);
  function set(f,v){setForm(s=>({...s,[f]:v}));}

  async function handleSave() {
    if (!form.title.trim()||!form.dueDate) return;
    setSaving(true);
    try { await addReminder(form); onClose(); }
    catch(e){ console.error(e); alert('Could not save.'); }
    finally{ setSaving(false); }
  }

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'var(--surface)',borderRadius:10,width:460,boxShadow:'0 8px 40px rgba(0,0,0,.22)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        <div style={{background:'var(--amber)',padding:'14px 18px'}}>
          <span style={{fontWeight:700,fontSize:14,color:'#fff'}}>+ New Reminder</span>
        </div>
        <div style={{padding:'18px 20px'}}>
          <div className="form-group">
            <label className="form-label">Reminder Title</label>
            <input className="form-input" value={form.title} onChange={e=>set('title',e.target.value)} placeholder="e.g. Follow up with client on RA Bill payment" autoFocus />
          </div>
          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">Due Date</label>
              <input className="form-input" type="date" value={form.dueDate} onChange={e=>set('dueDate',e.target.value)} />
            </div>
            <div className="form-group">
              <label className="form-label">Priority</label>
              <select className="form-input form-select" value={form.priority} onChange={e=>set('priority',e.target.value)}>
                <option>Urgent</option><option>Normal</option><option>Low</option>
              </select>
            </div>
          </div>
          <ProjectSelect value={form.project} onChange={v=>set('project',v)} split={form.split} onSplitChange={v=>set('split',v)} />
          <div className="form-group">
            <label className="form-label">Notes</label>
            <input className="form-input" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Optional details" />
          </div>
        </div>
        <div style={{padding:'0 20px 20px',display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={onClose} className="btn btn-ghost">Cancel</button>
          <button onClick={handleSave} disabled={saving||!form.title.trim()||!form.dueDate} className="btn btn-primary"
            style={{background:'var(--amber)',opacity:saving||!form.title.trim()||!form.dueDate?0.6:1}}>
            {saving?'Saving…':'Save Reminder'}
          </button>
        </div>
      </div>
    </div>
  );
}

function Reminders() {
  const { items: manualReminders, loading: remLoading } = useReminders();
  const { items: bills }     = useBills();
  const { items: tasks }     = useTasks();
  const { items: wos }       = useWorkOrders();
  const { items: raBills }   = useRABills();
  const [showNew, setShowNew] = useState(false);
  const [filter, setFilter] = useState('all'); // all | pending | done | overdue

  const today = new Date().toISOString().slice(0,10);
  const in7   = new Date(Date.now()+7*86400000).toISOString().slice(0,10);

  // Auto-generated reminders from live data
  const autoReminders = [
    // Overdue bills
    ...bills.filter(b=>!b.paid&&b.due&&b.due<today).map(b=>({
      docId: `auto-bill-${b.docId}`, auto:true,
      title: `Overdue bill — ${b.payee}`,
      notes: `${inr(b.amount||0)} · Due ${fmt(b.due)}`,
      dueDate: b.due, priority:'Urgent', project:b.project||'',
      done:false, category:'Bill'
    })),
    // Bills due in 7 days
    ...bills.filter(b=>!b.paid&&b.due&&b.due>=today&&b.due<=in7).map(b=>({
      docId: `auto-billdue-${b.docId}`, auto:true,
      title: `Bill due soon — ${b.payee}`,
      notes: `${inr(b.amount||0)} · Due ${fmt(b.due)}`,
      dueDate: b.due, priority:'Normal', project:b.project||'',
      done:false, category:'Bill'
    })),
    // Overdue tasks
    ...tasks.filter(t=>t.status!=='Completed'&&t.due&&t.due<today).map(t=>({
      docId: `auto-task-${t.docId}`, auto:true,
      title: `Overdue task — ${t.name}`,
      notes: `Assigned: ${t.assigned} · Due ${fmt(t.due)}`,
      dueDate: t.due, priority:'Urgent', project:t.project||'',
      done:false, category:'Task'
    })),
    // Overdue WOs
    ...wos.filter(w=>w.stage!=='Completed'&&w.stage!=='Cancelled'&&w.due&&w.due<today).map(w=>({
      docId: `auto-wo-${w.docId}`, auto:true,
      title: `Work order overdue — ${w.wo}`,
      notes: `${w.vendorName} · ${w.stage}`,
      dueDate: w.due, priority:'Urgent', project:w.project||'',
      done:false, category:'Work Order'
    })),
    // RA Bills with pending balance
    ...raBills.filter(b=>b.status!=='Fully Received'&&b.balancePending>0).map(b=>({
      docId: `auto-ra-${b.docId}`, auto:true,
      title: `RA Bill payment pending — ${b.raBillNo}`,
      notes: `${b.client} · Balance: ${inr(b.balancePending||0)}`,
      dueDate: today, priority:'Normal', project:b.project||'',
      done:false, category:'Receipt'
    })),
  ];

  const allItems = [
    ...autoReminders,
    ...manualReminders.map(r=>({...r, auto:false, category:'Manual'}))
  ].sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));

  const filtered = allItems.filter(r=>{
    if (filter==='pending') return !r.done;
    if (filter==='done')    return r.done;
    if (filter==='overdue') return !r.done && r.dueDate < today;
    return true;
  });

  const overdueCount = allItems.filter(r=>!r.done&&r.dueDate<today).length;
  const pendingCount = allItems.filter(r=>!r.done).length;

  const PRIO_BADGE = {Urgent:'red',Normal:'amber',Low:'grey'};
  const CAT_BADGE  = {Bill:'red',Task:'blue','Work Order':'teal',Receipt:'green',Manual:'grey'};

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Reminders</div>
          <div className="section-sub">{pendingCount} pending · {overdueCount} overdue · auto-generated from live data</div>
        </div>
        <button className="btn btn-primary" style={{background:'var(--amber)'}} onClick={()=>setShowNew(true)}>+ Add Reminder</button>
      </div>

      <div className="stats-grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <div className="stat-card"><div className="stat-label">Total</div><div className="stat-value">{allItems.length}</div></div>
        <div className="stat-card"><div className="stat-label">Overdue</div><div className="stat-value red">{overdueCount}</div></div>
        <div className="stat-card"><div className="stat-label">Pending</div><div className="stat-value amber">{pendingCount}</div></div>
        <div className="stat-card"><div className="stat-label">Done</div><div className="stat-value green">{allItems.filter(r=>r.done).length}</div></div>
      </div>

      <div className="tabs">
        {[['all','All'],['pending','Pending'],['overdue','Overdue'],['done','Done']].map(([v,l])=>(
          <div key={v} className={`tab ${filter===v?'active':''}`} onClick={()=>setFilter(v)}>{l}</div>
        ))}
      </div>

      <div className="card">
        {filtered.length === 0 ? (
          <div className="module-coming">
            <div className="big-icon">🔔</div>
            <h3>No reminders</h3>
            <p className="text-muted">All clear! Add a manual reminder or they'll auto-generate from overdue bills, tasks and work orders.</p>
          </div>
        ) : filtered.map(r=>(
          <div key={r.docId} style={{
            display:'flex',alignItems:'flex-start',gap:12,padding:'12px 16px',
            borderBottom:'1px solid var(--border)',
            background: r.done?'var(--grey-50)': r.dueDate<today?'#FFF3F3':'',
            opacity: r.done?0.6:1
          }}>
            {/* Done toggle — only for manual reminders */}
            <div style={{paddingTop:2,flexShrink:0}}>
              {r.auto ? (
                <div style={{width:18,height:18,borderRadius:'50%',background:PRIO_BADGE[r.priority]==='red'?'var(--red)':PRIO_BADGE[r.priority]==='amber'?'var(--amber)':'var(--grey)',opacity:.8}} />
              ) : (
                <div onClick={()=>toggleReminderDone(r.docId,r.done)}
                  style={{width:18,height:18,borderRadius:4,border:`2px solid ${r.done?'var(--green)':'var(--border)'}`,
                    background:r.done?'var(--green)':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {r.done&&<span style={{color:'#fff',fontSize:11,fontWeight:700}}>✓</span>}
                </div>
              )}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:13,textDecoration:r.done?'line-through':'none'}}>{r.title}</div>
              {r.notes && <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{r.notes}</div>}
              <div style={{display:'flex',gap:6,marginTop:5,flexWrap:'wrap'}}>
                <span className={`badge ${PRIO_BADGE[r.priority]||'grey'}`}>{r.priority}</span>
                <span className={`badge ${CAT_BADGE[r.category]||'grey'}`}>{r.category}</span>
                {r.project&&<span className={`badge ${PROJECT_COLOR[r.project]||'grey'}`}>{r.project}</span>}
                {r.auto&&<span className="badge grey" style={{fontSize:9}}>AUTO</span>}
              </div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:11.5,color:r.dueDate<today&&!r.done?'var(--red)':'var(--text-muted)',fontWeight:r.dueDate<today&&!r.done?600:400}}>
                {r.dueDate<today&&!r.done?'⚠ ':''}{fmt(r.dueDate)}
              </div>
              {!r.auto && (
                <button className="btn btn-sm btn-ghost" style={{marginTop:4,fontSize:10}} onClick={()=>deleteReminder(r.docId)}>Delete</button>
              )}
            </div>
          </div>
        ))}
      </div>
      {showNew && <NewReminderModal onClose={()=>setShowNew(false)} />}
    </div>
  );
}

function QuotationApprovalAction({ quotation, currentUser, onApproved, onRejected }) {
  const [working, setWorking] = useState(false);

  async function handleApprove() {
    if (!can(currentUser, 'approve_quotation')) { alert('You do not have permission to approve quotations.'); return; }
    setWorking(true);
    try {
      await updateQuotation(quotation.docId, {
        approved: true,
        approvedBy: currentUser.name,
        approvedByUid: currentUser.uid,
        approvedAt: Date.now(),
        stage: 'Finalized'
      });
      onApproved && onApproved();
    } catch(e) { console.error(e); alert('Could not approve.'); }
    finally { setWorking(false); }
  }

  async function handleReject() {
    setWorking(true);
    try {
      await updateQuotation(quotation.docId, { approved: false, rejectedBy: currentUser.name, rejectedAt: Date.now() });
      onRejected && onRejected();
    } catch(e) { console.error(e); alert('Could not update.'); }
    finally { setWorking(false); }
  }

  if (quotation.approved) {
    return (
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <span className="badge green">✓ Approved</span>
        <span style={{fontSize:10.5,color:'var(--text-muted)'}}>by {quotation.approvedBy}</span>
        <button className="btn btn-sm btn-ghost" style={{fontSize:10}} onClick={handleReject} disabled={working}>Revoke</button>
      </div>
    );
  }

  return (
    <PermGate user={currentUser} action="approve_quotation" fallback={
      <span style={{fontSize:11,color:'var(--text-muted)'}}>Pending approval</span>
    }>
      <button className="btn btn-sm btn-primary" style={{background:'var(--green)'}} onClick={handleApprove} disabled={working}>
        {working?'…':'✓ Approve'}
      </button>
    </PermGate>
  );
}

// ─── Statement — flat datewise ledger of all payments & incomes (excludes Petty Cash) ─
function Statement() {
  const { items: capital }  = useCapitalLoans();
  const { items: receipts } = useReceipts();
  const { items: bills }    = useBills();
  const { items: advances } = useAdvances();
  const { items: expenses } = useExpenses();
  const { items: petty }    = usePettyCash();

  const [dateFrom, setDateFrom]         = useState('');
  const [dateTo, setDateTo]             = useState('');
  const [projectFilter, setProjectFilter] = useState('all');
  const [typeFilter, setTypeFilter]     = useState('all');

  // Compute a bill's total value (base + GST), handling both schedule-synced
  // and manually-entered bills.
  function billTotalAmt(b) {
    if (b.fromSchedule && b.gstAmount !== undefined) {
      return Number(b.amount||0) + Number(b.gstAmount||0);
    } else if (b.fromSchedule) {
      return Number(b.amount||0);
    }
    const base = Number(b.amount||0);
    const gstRate = b.gstPct ? parseFloat(b.gstPct) : 0;
    const gst = gstRate > 0 ? Math.round(base * gstRate / 100) : 0;
    return base + gst;
  }

  const rows = [
    ...capital.map(c => ({
      date: c.dateReceived||'', desc: `${c.type||'Capital'} — ${c.source||''}`, cat: c.type||'Capital', grp:'Capital & Loans',
      project: c.project||'', dir:'in', amt: Number(c.amount||0)
    })),
    ...receipts.map(r => ({
      date: r.dateReceived||'', desc: `${r.client||'Client'} Receipt${r.milestoneName?' — '+r.milestoneName:''}`, cat:'Client Receipt', grp:'Client Receipts',
      project: r.project||'', dir:'in', amt: Number(r.amountReceived||0)
    })),
    ...advances.map(a => ({
      date: a.datePaid||'', desc: `Advance — ${a.vendor||''}`, cat:'Advance', grp:'Advance Payments (unadj.)',
      project: a.project||'', dir:'out', amt: Number(a.balanceAmount!==undefined ? a.balanceAmount : a.amount||0)
    })),
    ...bills.filter(b=>b.paid && !(b.paymentSchedule && b.paymentSchedule.length>0)).map(b => ({
      date: b.paidDate||b.due||(b.paidAt ? new Date(b.paidAt).toISOString().slice(0,10) : ''), desc: b.payee||'', cat: b.category||'Bill', grp:'Bills & Invoices (paid)',
      project: b.project||'', dir:'out', amt: billTotalAmt(b)
    })),
    // Schedule-based bills — always log each paid stage on its own date, whether the
    // bill is only partially settled or fully paid, so multiple payments against the
    // same bill (e.g. advances + later direct payments) each keep their real date.
    ...bills.filter(b=>b.paymentSchedule && b.paymentSchedule.length>0).flatMap(b =>
      b.paymentSchedule.filter(s=>s.paid).map(s => ({
        date: s.datePaid||s.date||'', desc: `${b.payee||''}${b.paid?'':' (part payment)'}`, cat: b.category||'Bill', grp:'Bills & Invoices (paid)',
        project: b.project||'', dir:'out', amt: Number(s.amount||0) + Number(s.includesGst ? s.gstAmount||0 : 0)
      }))
    ),
    ...expenses.map(e => ({
      date: e.date||'', desc: e.description||'', cat: e.category||'General Expense', grp:'General Expenses',
      project: e.project||'', dir:'out', amt: Number(e.amount||0)
    })),
    ...capital.flatMap(c => (c.repayments||[]).map(r => ({
      date: r.date||'', desc: `Loan Repayment — ${c.source||''}`, cat:'Loan Repayment', grp:'Loan Repayments',
      project: c.project||'', dir:'out', amt: Number(r.amount||0)
    }))),
  ].filter(r => r.amt > 0);

  const filtered = rows.filter(r =>
    (projectFilter==='all'||r.project===projectFilter) &&
    (typeFilter==='all'||r.dir===typeFilter) &&
    (!dateFrom||r.date>=dateFrom) &&
    (!dateTo||r.date<=dateTo)
  ).sort((a,b)=>b.date.localeCompare(a.date));

  const totalIn  = filtered.filter(r=>r.dir==='in').reduce((s,r)=>s+r.amt,0);
  const totalOut = filtered.filter(r=>r.dir==='out').reduce((s,r)=>s+r.amt,0);
  // Petty Cash shown as its own total (all-time) and factored into Net, but kept
  // out of the Total Out figure/transaction list above.
  const totalPettyCash = petty.reduce((s,p)=>s+(Number(p.totalAmount||0)||Number(p.amount||0)),0);
  const net = totalIn - totalOut - totalPettyCash;

  function exportExcel() {
    const sheetData = filtered.map(r => ({
      Date: fmt(r.date), Description: r.desc, Category: r.cat, Project: r.project||'',
      Type: r.dir==='in'?'In':'Out', Amount: r.dir==='in'?r.amt:-r.amt
    }));
    sheetData.push({});
    sheetData.push({Date:'Total In', Amount: totalIn});
    sheetData.push({Date:'Total Out', Amount: -totalOut});
    sheetData.push({Date:'Petty Cash (not in Total Out)', Amount: -totalPettyCash});
    sheetData.push({Date:'Net (incl. Petty Cash)', Amount: net});
    const ws = window.XLSX.utils.json_to_sheet(sheetData);
    ws['!cols'] = [{wch:12},{wch:32},{wch:16},{wch:10},{wch:8},{wch:14}];
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, 'Statement');
    window.XLSX.writeFile(wb, `Statement_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  function exportPDF() {
    try {
      if (!window.jspdf) { alert('PDF library did not load — check your internet connection and try again.'); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({orientation:'landscape'});
      // jsPDF's built-in fonts don't support the ₹ Unicode glyph, so use "Rs." for this export only.
      const inrPdf = (n) => 'Rs. ' + Math.round(Number(n)).toLocaleString('en-IN');
      doc.setFontSize(14);
      doc.text('Nirmaan Watertech Solutions - Statement', 14, 15);
      doc.setFontSize(9);
      doc.text(`Generated ${fmt(new Date().toISOString().slice(0,10))}  |  Total In ${inrPdf(totalIn)}  |  Total Out ${inrPdf(totalOut)}  |  Petty Cash ${inrPdf(totalPettyCash)}  |  Net ${inrPdf(net)}`, 14, 22);
      doc.autoTable({
        startY: 28,
        head: [['Date','Description','Category','Project','Type','Amount']],
        body: filtered.map(r => [fmt(r.date), r.desc, r.cat, r.project||'-', r.dir==='in'?'In':'Out', (r.dir==='in'?'+':'-')+inrPdf(r.amt)]),
        styles: { fontSize: 8 },
        headStyles: { fillColor: [30,58,95] },
        didParseCell: (data) => {
          if (data.section==='body' && data.column.index===5) {
            data.cell.styles.textColor = data.row.raw[4]==='In' ? [22,163,74] : [220,38,38];
          }
        }
      });
      doc.save(`Statement_${new Date().toISOString().slice(0,10)}.pdf`);
    } catch(e) {
      console.error(e);
      alert('Could not export PDF: '+e.message);
    }
  }

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Statement</div>
          <div className="section-sub">All payments & incomes, datewise — excludes Petty Cash</div>
        </div>
        <div className="flex gap-2">
          <button className="btn btn-sm btn-ghost" onClick={exportExcel}>⬇ Export Excel</button>
          <button className="btn btn-sm btn-ghost" onClick={exportPDF}>⬇ Export PDF</button>
        </div>
      </div>

      <div className="stats-grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <div className="stat-card"><div className="stat-label">Total In</div><div className="stat-value green">{inr(totalIn)}</div></div>
        <div className="stat-card"><div className="stat-label">Total Out</div><div className="stat-value red">{inr(totalOut)}</div></div>
        <div className="stat-card"><div className="stat-label">Petty Cash</div><div className="stat-value red">{inr(totalPettyCash)}</div><div className="stat-sub" style={{fontSize:10}}>Not in Total Out — included in Net</div></div>
        <div className="stat-card"><div className="stat-label">Net (incl. Petty Cash)</div><div className="stat-value" style={{color: net>=0?'var(--green)':'var(--red)'}}>{inr(net)}</div></div>
      </div>

      {/* Category breakdown — compare line-by-line against Cash Flow's outflow breakdown */}
      <div className="card" style={{marginBottom:14}}>
        <div className="card-header"><span className="card-title" style={{color:'var(--red)'}}>↓ Total Out by Category — {inr(totalOut)}</span></div>
        <div className="card-body" style={{padding:'10px 16px'}}>
          {Object.entries(
            filtered.filter(r=>r.dir==='out').reduce((acc,r)=>{ acc[r.grp]=(acc[r.grp]||0)+r.amt; return acc; }, {})
          ).sort((a,b)=>b[1]-a[1]).map(([grp,amt])=>(
            <div key={grp} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--grey-50)'}}>
              <span style={{fontSize:13}}>{grp}</span>
              <span className="amount" style={{fontWeight:700,color:'var(--red)',fontSize:14}}>{inr(amt)}</span>
            </div>
          ))}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0 0'}}>
            <span style={{fontSize:13,fontWeight:700}}>Total</span>
            <span className="amount" style={{fontWeight:700,color:'var(--red)',fontSize:15}}>{inr(totalOut)}</span>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-body" style={{paddingTop:10,paddingBottom:10}}>
          <div className="flex gap-2" style={{flexWrap:'wrap'}}>
            <input className="form-input" type="date" style={{width:150}} value={dateFrom} onChange={e=>setDateFrom(e.target.value)} />
            <input className="form-input" type="date" style={{width:150}} value={dateTo} onChange={e=>setDateTo(e.target.value)} />
            <select className="form-input form-select" style={{width:130}} value={projectFilter} onChange={e=>setProjectFilter(e.target.value)}>
              <option value="all">All Projects</option>
              {PROJECTS.map(p=><option key={p}>{p}</option>)}
            </select>
            <select className="form-input form-select" style={{width:150}} value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
              <option value="all">All Types</option>
              <option value="in">Income Only</option>
              <option value="out">Payments Only</option>
            </select>
          </div>
        </div>
        {filtered.length===0 ? (
          <div className="module-coming">
            <div className="big-icon">📜</div>
            <h3>No transactions found</h3>
            <p className="text-muted">Try adjusting the filters above.</p>
          </div>
        ) : (
        <div style={{overflowX:'auto',overflowY:'visible'}}>
          <table style={{minWidth:800}}>
            <thead>
              <tr><th>Date</th><th>Description</th><th>Category</th><th>Project</th><th>Type</th><th>Amount</th></tr>
            </thead>
            <tbody>
              {filtered.map((r,i)=>(
                <tr key={i}>
                  <td>{fmt(r.date)}</td>
                  <td className="fw-600">{r.desc}</td>
                  <td><span className="badge grey">{r.cat}</span></td>
                  <td>{r.project?<span className={`badge ${PROJECT_COLOR[r.project]||'grey'}`}>{r.project}</span>:<span className="text-muted">—</span>}</td>
                  <td><span className={`badge ${r.dir==='in'?'green':'red'}`}>{r.dir==='in'?'In':'Out'}</span></td>
                  <td className="amount fw-600" style={{color: r.dir==='in'?'var(--green)':'var(--red)'}}>{r.dir==='in'?'+':'−'}{inr(r.amt)}</td>
                </tr>
              ))}
              <tr style={{background:'var(--grey-50)',fontWeight:700,borderTop:'2px solid var(--border)'}}>
                <td colSpan={5} style={{padding:'8px 12px',fontSize:12,color:'var(--text-secondary)'}}>Total ({filtered.length} entries) — In {inr(totalIn)} · Out {inr(totalOut)}</td>
                <td className="amount" style={{fontWeight:700,color: (totalIn-totalOut)>=0?'var(--green)':'var(--red)',fontSize:13}}>{inr(totalIn-totalOut)}</td>
              </tr>
            </tbody>
          </table>
        </div>
        )}
      </div>
    </div>
  );
}

function QuotationsWithUser({ currentUser }) {
  const { items, loading } = useQuotations();
  const { items: reqs } = useRequisitions();
  const [showNew, setShowNew] = useState(false);
  const [stageFilter, setStageFilter] = useState('all');
  const [approvedFilter, setApprovedFilter] = useState('all');
  const [vendorFilter, setQVendorFilter] = useState('all');
  const [projectFilter, setQProjectFilter] = useState('all');
  const [qSortBy, setQSortBy] = useState('date_desc');
  const [issuingFor, setIssuingFor] = useState(null);
  const [viewSchedule, setViewSchedule] = useState(null);
  const [editQuote, setEditQuote] = useState(null);

  const qVendors = [...new Set(items.map(q=>q.vendorName).filter(Boolean))].sort();
  const filtered = [...items].sort((a,b)=>
    qSortBy==='date_asc'?(a.receivedDate||'').localeCompare(b.receivedDate||''):
    qSortBy==='amount_desc'?Number(b.value||0)-Number(a.value||0):
    qSortBy==='amount_asc'?Number(a.value||0)-Number(b.value||0):
    qSortBy==='vendor_asc'?(a.vendorName||'').localeCompare(b.vendorName||''):
    (b.receivedDate||'').localeCompare(a.receivedDate||'')
  ).filter(q =>
    (stageFilter==='all' || q.stage===stageFilter) &&
    (approvedFilter==='all' || (approvedFilter==='approved'&&q.approved) || (approvedFilter==='pending'&&!q.approved)) &&
    (vendorFilter==='all' || q.vendorName===vendorFilter) &&
    (projectFilter==='all' || q.project===projectFilter)
  );
  const pipelineValue = items.filter(q=>!q.approved).reduce((s,q)=>s+Number(q.value||0),0);

  async function advanceStage(q) {
    if (q.stage === 'Receipt of Quotation') {
      try { await updateQuotation(q.docId, { stage: 'Finalized' }); }
      catch(e) { console.error(e); alert('Could not update stage.'); }
    } else if (q.stage === 'Finalized') {
      setIssuingFor(q);
    }
  }

  function reqLabel(id) {
    const r = reqs.find(r=>r.docId===id||r.req===id);
    return r ? `${r.req} — ${r.description?.slice(0,30)}` : (id||'—');
  }

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Quotations</div>
          <div className="section-sub">{loading?'Loading…':`${items.length} quotation${items.length===1?'':'s'} · pipeline ${inr(pipelineValue)}`}</div>
        </div>
        <div className="flex gap-2">
          <PermGate user={currentUser} action="enter_quotation" fallback={null}>
            <button className="btn btn-primary" onClick={()=>setShowNew(true)}>+ New Quotation</button>
          </PermGate>
          <ClearCollectionButton label="Clear All" count={items.length} onClear={clearAllQuotations} />
        </div>
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div className="card-body" style={{paddingTop:10,paddingBottom:10}}>
          <div className="flex gap-2" style={{flexWrap:'wrap'}}>
            <select className="form-input form-select" style={{width:200}} value={stageFilter} onChange={e=>setStageFilter(e.target.value)}>
              <option value="all">All Stages</option>
              {QUOTE_STAGES.map(s=><option key={s}>{s}</option>)}
            </select>
            <select className="form-input form-select" style={{width:160}} value={approvedFilter} onChange={e=>setApprovedFilter(e.target.value)}>
              <option value="all">All</option>
              <option value="approved">Approved only</option>
              <option value="pending">Pending approval</option>
            </select>
            <select className="form-input form-select" style={{width:160}} value={vendorFilter} onChange={e=>setQVendorFilter(e.target.value)}>
              <option value="all">All Vendors</option>
              {qVendors.map(v=><option key={v}>{v}</option>)}
            </select>
            <select className="form-input form-select" style={{width:130}} value={projectFilter} onChange={e=>setQProjectFilter(e.target.value)}>
              <option value="all">All Projects</option>
              {PROJECTS.map(p=><option key={p}>{p}</option>)}
            </select>
            <select className="form-input form-select" style={{width:190}} value={qSortBy} onChange={e=>setQSortBy(e.target.value)}>
              <option value="date_desc">↓ Received Date (Newest)</option>
              <option value="date_asc">↑ Received Date (Oldest)</option>
              <option value="amount_desc">↓ Value (Highest)</option>
              <option value="amount_asc">↑ Value (Lowest)</option>
              <option value="vendor_asc">A→Z Vendor</option>
            </select>
          </div>
        </div>
      </div>

      <div className="card">
        {loading ? (
          <div className="module-coming"><div className="big-icon">⏳</div><p className="text-muted">Connecting to Firestore…</p></div>
        ) : filtered.length===0 ? (
          <div className="module-coming">
            <div className="big-icon">📋</div>
            <h3>No quotations yet</h3>
            <p className="text-muted">Add vendor quotations. Link to a requisition. Approve the best one to issue a PO or WO.</p>
          </div>
        ) : (
          <table>
            <thead>
              <tr><th>Quot #</th><th>Vendor</th><th>Project</th><th>REQ Ref</th><th>Value</th><th>Payment Schedule</th><th>Stage</th><th>Approval</th><th>Actions</th></tr>
            </thead>
            <tbody>
              {filtered.map(q=>(
                <tr key={q.docId} style={{background:q.approved?'#F0FFF4':''}}>
                  <td className="mono" style={{whiteSpace:'nowrap'}}>{q.quotNo||'—'}</td>
                  <td className="fw-600">{q.vendorName}</td>
                  <td>{q.project?<span className={`badge ${PROJECT_COLOR[q.project]||'grey'}`}>{q.project}</span>:<span className="text-muted">—</span>}</td>
                  <td style={{fontSize:11.5,color:'var(--text-muted)'}}>{reqLabel(q.linkedReq)}</td>
                  <td className="amount fw-600">{inr(q.value||0)}</td>
                  <td>
                    {q.paymentSchedule&&q.paymentSchedule.length>0
                      ? <span className="btn btn-sm btn-ghost" style={{cursor:'pointer'}} onClick={()=>setViewSchedule(q)}>{q.paymentSchedule.length} stage{q.paymentSchedule.length===1?'':'s'}</span>
                      : <span className="text-muted text-sm">—</span>}
                  </td>
                  <td><span className={`badge ${STAGE_COLOR[q.stage]||'grey'}`}>{q.stage}</span></td>
                  <td>
                    <QuotationApprovalAction quotation={q} currentUser={currentUser} />
                  </td>
                  <td>
                    <div className="flex gap-2">
                      {q.approved && q.stage==='Finalized' && (
                        <PermGate user={currentUser} action="issue_po">
                          <button className="btn btn-sm btn-primary" style={{background:'var(--green)'}} onClick={()=>setIssuingFor(q)}>Issue PO →</button>
                        </PermGate>
                      )}
                      <button className="btn btn-sm btn-ghost" onClick={()=>setEditQuote(q)}>Edit</button>
                      {q.stage==='Receipt of Quotation' && (
                        <button className="btn btn-sm btn-ghost" onClick={()=>advanceStage(q)}>→ Finalize</button>
                      )}
                      <button className="btn btn-sm btn-ghost" onClick={()=>{if(confirm('Delete?'))deleteQuotation(q.docId);}}>Delete</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      {showNew && <NewQuotationWithREQ onClose={()=>setShowNew(false)} reqs={reqs} />}
      {editQuote && <NewQuotationWithREQ onClose={()=>setEditQuote(null)} reqs={reqs} existing={editQuote} />}
      {issuingFor && <IssuePOModal quotation={issuingFor} onClose={()=>setIssuingFor(null)} onIssued={()=>setIssuingFor(null)} />}
      {viewSchedule && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={()=>setViewSchedule(null)}>
          <div style={{background:'var(--surface)',borderRadius:10,width:420,boxShadow:'0 8px 40px rgba(0,0,0,.22)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
            <div style={{background:'var(--primary)',padding:'14px 18px'}}>
              <span style={{fontWeight:700,fontSize:14,color:'#fff'}}>Payment Schedule — {viewSchedule.vendorName}</span>
            </div>
            <div style={{padding:'16px 20px'}}>
              <table style={{width:'100%'}}>
                <thead><tr>
                  {['Stage','%','Amount','Date'].map(h=><th key={h} style={{fontSize:10,textAlign:'left',color:'var(--text-muted)',padding:'4px 0'}}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {(viewSchedule.paymentSchedule||[]).map((r,i)=>(
                    <tr key={i} style={{borderTop:'1px solid var(--grey-50)'}}>
                      <td style={{padding:'6px 0',fontSize:12.5}}>{r.name}</td>
                      <td style={{fontSize:12.5}}>{r.pct}%</td>
                      <td className="amount" style={{fontSize:12.5}}>{inr(r.amount||0)}</td>
                      <td style={{fontSize:12.5}}>{r.date||'—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{padding:'0 20px 16px',display:'flex',justifyContent:'flex-end'}}>
              <button onClick={()=>setViewSchedule(null)} className="btn btn-ghost">Close</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── New Quotation with REQ dropdown and Quot Number ─
function NewQuotationWithREQ({ onClose, reqs, existing }) {
  const isEdit = !!existing;
  const knownNames = useKnownNames();
  const [form, setForm] = useState(isEdit ? {
    quotNo: existing.quotNo||'', vendorName: existing.vendorName||'',
    description: existing.description||'', value: existing.value ? String(existing.value) : '',
    gstPct: existing.gstPct||'',
    receivedDate: existing.receivedDate||'',
    stage: existing.stage||'Receipt of Quotation', notes: existing.notes||'', project: existing.project||'',
    split: existing.split||{pontoon:50,wtp:50}
  } : {
    quotNo:'', vendorName:'', description:'', value:'', gstPct:'',
    receivedDate: new Date().toISOString().slice(0,10),
    stage:'Receipt of Quotation', notes:'', project:'', split:{pontoon:50,wtp:50}
  });
  const [saving, setSaving] = useState(false);
  function set(f,v){setForm(s=>({...s,[f]:v}));}

  async function handleSave(){
    if(!form.vendorName.trim()||!form.value) return;
    setSaving(true);

      if (isEdit) {
        await updateQuotation(existing.docId, {...form, value:Number(form.value)});

        </div>
        <div style={{padding:'18px 20px'}}>
          <div className="form-grid">

            </div>

              <label className="form-label">Received Date</label>

            <label className="form-label">GST % <span style={{color:'var(--text-muted)',fontWeight:400,fontSize:11}}>(carries over to PO)</span></label>

    </div>
