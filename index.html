const ACTIONS_LIST = [
  { key:'enter_quotation',    label:'Enter Quotation' },
  { key:'approve_quotation',  label:'Approve Quotation' },
  { key:'issue_po',           label:'Issue Purchase Order' },
  { key:'issue_wo',           label:'Issue Work Order' },
  { key:'mark_payment',       label:'Mark Payment Received' },
  { key:'view_cashflow',      label:'View Cash Flow' },
  { key:'edit_settings',      label:'Edit Settings' },
];
const ROLES_LIST = [
  { key:'owner', label:'Owner' }, { key:'manager', label:'Manager' },
  { key:'accounts', label:'Accounts' }, { key:'field_staff', label:'Field Staff' }, { key:'viewer', label:'Viewer' },
];

function usePermSettings() {
  const [perms, setPerms] = useState(DEFAULT_PERMISSIONS);
  useEffect(() => {
    function start() {
      const { db, doc, onSnapshot } = window.fb;
      const unsub = onSnapshot(doc(db, 'settings', 'permissions'), snap => {
        if (snap.exists()) setPerms(s => ({ ...DEFAULT_PERMISSIONS, ...snap.data() }));
      }, err => console.error('Perms listener', err));
      return unsub;
    }
    if (window.fb) { const u=start(); return ()=>u&&u(); }
    let u; const h=()=>{u=start();};
    window.addEventListener('firebase-ready',h,{once:true});
    return ()=>{ window.removeEventListener('firebase-ready',h); if(u)u(); };
  }, []);
  async function savePerms(newPerms) {
    const { db, doc, setDoc } = window.fb;
    await setDoc(doc(db, 'settings', 'permissions'), newPerms, { merge: true });
  }
  return { perms, setPerms, savePerms };
}

function PermissionMatrix({ currentUser }) {
  const { perms, setPerms, savePerms } = usePermSettings();
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  function toggle(role, action) {
    if (role==='owner') return;
    setPerms(p => ({ ...p, [role]: { ...(p[role]||{}), [action]: !(p[role]||{})[action] } }));
  }
  async function handleSave() {
    setSaving(true);
    try { await savePerms(perms); setSaved(true); setTimeout(()=>setSaved(false),2000); }
    catch(e) { console.error(e); alert('Could not save.'); }
    finally { setSaving(false); }
  }
  return (
    <div className="card">
      <div className="card-header" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span className="card-title">Role & Permission Matrix</span>
        <button className="btn btn-sm btn-primary" onClick={handleSave} disabled={saving}>
          {saving?'Saving…':saved?'✓ Saved':'Save Permissions'}
        </button>
      </div>
      <div className="card-body" style={{overflowX:'auto',overflowY:'visible'}}>
        <table style={{width:'100%',minWidth:500}}>
          <thead>
            <tr>
              <th style={{textAlign:'left',fontSize:11,color:'var(--text-muted)',padding:'6px 10px',width:180}}>Action</th>
              {ROLES_LIST.map(r=><th key={r.key} style={{textAlign:'center',fontSize:11,color:'var(--text-muted)',padding:'6px 10px'}}>{r.label}</th>)}
            </tr>
          </thead>
          <tbody>
            {ACTIONS_LIST.map(a=>(
              <tr key={a.key} style={{borderTop:'1px solid var(--grey-50)'}}>
                <td style={{fontSize:12.5,padding:'8px 10px'}}>{a.label}</td>
                {ROLES_LIST.map(r=>{
                  const granted = r.key==='owner' ? true : !!(perms[r.key]||{})[a.key];
                  return (
                    <td key={r.key} style={{textAlign:'center',padding:'8px 10px'}}>
                      <div onClick={()=>toggle(r.key,a.key)} style={{width:36,height:20,borderRadius:10,margin:'0 auto',
                        cursor:r.key==='owner'?'not-allowed':'pointer',
                        background:granted?'var(--green)':'var(--border)',position:'relative',transition:'background .15s'}}>
                        <div style={{position:'absolute',top:2,left:granted?18:2,width:16,height:16,borderRadius:'50%',
                          background:'#fff',transition:'left .15s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}} />
                      </div>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{fontSize:11,color:'var(--text-muted)',marginTop:10}}>Owner always has full access.</div>
      </div>
    </div>
  );
}

// ─── Settings ─────────────────────────────────────────
// ─── Data Fix Panel ───────────────────────────────────
function DataFixPanel() {
  const [running, setRunning] = useState(false);
  const [log, setLog]         = useState([]);
  const [done, setDone]       = useState(false);

  function addLog(msg, type='info') {
    setLog(l => [...l, {msg, type}]);
  }

  async function runFixAll() {
    if (!confirm('This will scan and repair ALL data in Firestore to match the latest sync rules. Continue?')) return;
    setRunning(true); setDone(false); setLog([]);
    const { getDocs, updateDoc, addDoc, deleteDoc } = window.fb;
    let fixed = 0, skipped = 0;

    try {
      // ── Load all collections ──────────────────────────
      addLog('📦 Loading all data…');
      const [advSnap, billSnap, poSnap, woSnap] = await Promise.all([
        getDocs(userCol(ADVANCES_COLLECTION)),
        getDocs(userCol(BILLS_COLLECTION)),
        getDocs(userCol(PO_COLLECTION)),
        getDocs(userCol(WO_COLLECTION)),
      ]);
      const advances = advSnap.docs.map(d=>({docId:d.id,...d.data()}));
      const bills    = billSnap.docs.map(d=>({docId:d.id,...d.data()}));
      const pos      = poSnap.docs.map(d=>({docId:d.id,...d.data()}));
      const wos      = woSnap.docs.map(d=>({docId:d.id,...d.data()}));
      addLog(`✓ Loaded ${advances.length} advances, ${bills.length} bills, ${pos.length} POs, ${wos.length} WOs`,'ok');

      // ── FIX 1: PO/WO schedule stages → Advance/Bill entries ──
      addLog('');
      addLog('🔧 Fix 1: PO/WO paid stages → linked Advance & Bill entries');
      for (const doc of [...pos,...wos]) {
        const pType  = doc.po?'po':'wo';
        const refNo  = doc.po||doc.wo||'';
        const sched  = doc.paymentSchedule||[];
        let schedChanged = false;
        const newSched = [...sched];

        for (let i=0; i<newSched.length; i++) {
          const s = newSched[i];
          if (!s.paid) continue;
          const isAdv = (s.stageType||'').toLowerCase()==='advance';
          const col   = isAdv?ADVANCES_COLLECTION:BILLS_COLLECTION;
          const fullBase = Number(doc.value||0);
          const gstAmt   = s.includesGst?Number(s.gstAmount||0):0;
          const stageAmt = Number(s.amount||0);

          if (s.linkedEntryId) {
            // Entry exists — verify and correct it
            const entry = isAdv
              ? advances.find(a=>a.docId===s.linkedEntryId)
              : bills.find(b=>b.docId===s.linkedEntryId);

            if (!entry) {
              addLog(`  ⚠ ${refNo} "${s.stageType}" — entry ${s.linkedEntryId.slice(0,8)} missing, recreating…`,'warn');
              try {
                const data = isAdv ? {
                  vendor:doc.vendorName||'', amount:stageAmt, datePaid:s.datePaid||s.date||'',
                  paymentMode:'NEFT', refNumber:'', narration:`Advance — ${refNo}`,
                  linkedPO:pType==='po'?refNo:'', linkedWO:pType==='wo'?refNo:'',
                  project:doc.project||'', split:doc.split||{}, status:'Unadjusted',
                  balanceAmount:stageAmt, adjustedAmount:0, fromSchedule:true, createdAt:Date.now(),
                } : {
                  payee:doc.vendorName||'', category:'Vendor', invoiceNo:s.invoiceNo||refNo,
                  invoiceDate:s.datePaid||s.date||'', due:s.datePaid||s.date||'',
                  amount:fullBase, gstAmount:gstAmt, totalAmount:fullBase+gstAmt,
                  notes:`Against Delivery — ${refNo}`, linkedPO:pType==='po'?refNo:'',
                  linkedWO:pType==='wo'?refNo:'', project:doc.project||'', split:doc.split||{},
                  gstPct:doc.gstPct||'', paid:true, paidAt:Date.now(), paidDate:s.datePaid||s.date||'', fromSchedule:true, createdAt:Date.now(),
                };
                const ref = await addDoc(userCol(col), data);
                newSched[i] = {...s, linkedEntryId:ref.id};
                schedChanged = true;
                addLog(`  ✓ Recreated ${isAdv?'advance':'bill'} for ${refNo}`,'ok'); fixed++;
              } catch(e){addLog(`  ✗ Recreate failed: ${e.message}`,'err');}
              continue;
            }

            // Entry exists — fix fields
            const updates = {};
            if (!isAdv) {
              if (Number(entry.amount||0)!==fullBase) updates.amount=fullBase;
              if (Number(entry.gstAmount||0)!==gstAmt) updates.gstAmount=gstAmt;
              if (Number(entry.totalAmount||0)!==fullBase+gstAmt) updates.totalAmount=fullBase+gstAmt;
              if (!entry.paid) { updates.paid=true; updates.paidAt=Date.now(); updates.paidDate=s.datePaid||s.date||''; }
              if (s.invoiceNo && entry.invoiceNo!==s.invoiceNo) updates.invoiceNo=s.invoiceNo;
              if (s.datePaid && entry.due!==s.datePaid) { updates.due=s.datePaid; updates.invoiceDate=s.datePaid; }
            } else {
              if (Number(entry.amount||0)!==stageAmt) updates.amount=stageAmt;
              if (s.datePaid && !entry.datePaid) updates.datePaid=s.datePaid;
            }
            if (Object.keys(updates).length>0) {
              try {
                await updateDoc(userDoc(col,s.linkedEntryId),updates);
                addLog(`  ✓ Fixed ${isAdv?'advance':'bill'} ${s.linkedEntryId.slice(0,8)}: ${Object.keys(updates).join(', ')}`,'ok'); fixed++;
              } catch(e){addLog(`  ✗ ${e.message}`,'err');}
            } else { skipped++; }
          } else {
            // No linkedEntryId — entry was never created, create now
            addLog(`  ⚠ ${refNo} "${s.stageType}" paid but no linked entry — creating…`,'warn');
            try {
              const data = isAdv ? {
                vendor:doc.vendorName||'', amount:stageAmt, datePaid:s.datePaid||s.date||'',
                paymentMode:'NEFT', refNumber:'', narration:`Advance — ${refNo}`,
                linkedPO:pType==='po'?refNo:'', linkedWO:pType==='wo'?refNo:'',
                project:doc.project||'', split:doc.split||{}, status:'Unadjusted',
                balanceAmount:stageAmt, adjustedAmount:0, fromSchedule:true, createdAt:Date.now(),
              } : {
                payee:doc.vendorName||'', category:'Vendor', invoiceNo:s.invoiceNo||refNo,
                invoiceDate:s.datePaid||s.date||'', due:s.datePaid||s.date||'',
                amount:fullBase, gstAmount:gstAmt, totalAmount:fullBase+gstAmt,
                notes:`Against Delivery — ${refNo}`, linkedPO:pType==='po'?refNo:'',
                linkedWO:pType==='wo'?refNo:'', project:doc.project||'', split:doc.split||{},
                gstPct:doc.gstPct||'', paid:true, paidAt:Date.now(), fromSchedule:true, createdAt:Date.now(),
              };
              const ref = await addDoc(userCol(col), data);
              newSched[i] = {...s, linkedEntryId:ref.id};
              schedChanged = true;
              addLog(`  ✓ Created ${isAdv?'advance':'bill'} ${ref.id.slice(0,8)} for ${refNo}`,'ok'); fixed++;
            } catch(e){addLog(`  ✗ Create failed: ${e.message}`,'err');}
          }
        }

        // Save schedule if changed
        if (schedChanged) {
          try {
            await updateDoc(userDoc(pType==='po'?PO_COLLECTION:WO_COLLECTION, doc.docId),{paymentSchedule:newSched});
            addLog(`  ✓ Updated schedule for ${refNo}`,'ok');
          } catch(e){addLog(`  ✗ Schedule save: ${e.message}`,'err');}
        }
      }

      // ── FIX 2: Advances with linkedBill → write correct advanceDeducted to bill ──
      addLog('');
      addLog('🔧 Fix 2: Advance→Bill linkages and adjustedAmount');
      for (const a of advances) {
        const billId = a.linkedBill||a.adjustedAgainst;
        if (!billId) continue;
        const bill = bills.find(b=>b.docId===billId);
        if (!bill) { addLog(`  ⚠ Advance ${a.docId.slice(0,8)}: bill ${billId.slice(0,8)} missing`,'warn'); continue; }

        // Correct adjusted amount — use adjustedAmount if set, else full advance amount
        const adjAmt = Number(a.adjustedAmount||0) || Number(a.amount||0);

        // Always recalculate billTotal from base + GST — never trust stored totalAmount
        // which may have been set incorrectly
        const gstRate2 = bill.gstPct ? parseFloat(bill.gstPct)/100 : 0;
        const baseAmt  = Number(bill.amount||0);
        const gstAmt   = bill.gstAmount !== undefined
          ? Number(bill.gstAmount||0)
          : Math.round(baseAmt * gstRate2);
        const billTotal  = baseAmt + gstAmt;  // always recalculate
        const netPayable = Math.max(0, billTotal - adjAmt);
        const isPaid     = netPayable <= 1; // ≤ ₹1 rounding tolerance

        // Fix the advance record
        const advUpdates = {};
        if (!a.adjustedAmount && a.amount) { advUpdates.adjustedAmount=adjAmt; advUpdates.balanceAmount=Math.max(0,Number(a.amount||0)-adjAmt); }
        if (!a.status||a.status==='Unadjusted') advUpdates.status=isPaid?'Fully Adjusted':'Partially Adjusted';
        if (Object.keys(advUpdates).length>0) {
          try { await updateDoc(userDoc(ADVANCES_COLLECTION,a.docId),advUpdates); addLog(`  ✓ Advance ${a.docId.slice(0,8)}: ${JSON.stringify(advUpdates)}`,'ok'); fixed++; }
          catch(e){addLog(`  ✗ ${e.message}`,'err');}
        }

        // Fix the bill record
        const billUpdates = {};
        if (Number(bill.advanceDeducted||0)!==adjAmt) billUpdates.advanceDeducted=adjAmt;
        if (!bill.linkedAdvance) billUpdates.linkedAdvance=a.docId;
        if (bill.paid!==isPaid) { billUpdates.paid=isPaid; billUpdates.paidAt=isPaid?Date.now():null; billUpdates.paidDate=isPaid?(a.datePaid||new Date().toISOString().slice(0,10)):''; }
        if (Object.keys(billUpdates).length>0) {
          try { await updateDoc(userDoc(BILLS_COLLECTION,billId),billUpdates); addLog(`  ✓ Bill ${bill.payee||billId.slice(0,8)}: advDed=${adjAmt}, net=${netPayable}, paid=${isPaid}`,'ok'); fixed++; }
          catch(e){addLog(`  ✗ ${e.message}`,'err');}
        } else { skipped++; }
      }

      // ── FIX 3: Against Delivery bills — ensure paid=true if linked to paid PO stage ──
      addLog('');
      addLog('🔧 Fix 3: fromSchedule bills — mark paid if PO stage is paid');
      for (const b of bills) {
        if (!b.fromSchedule||b.paid) continue;
        const allDocs=[...pos,...wos];
        const found=allDocs.find(d=>(d.paymentSchedule||[]).some(s=>s.linkedEntryId===b.docId&&s.paid));
        if (found) {
          try {
            const matchedStage = found.paymentSchedule.find(s=>s.linkedEntryId===b.docId&&s.paid);
            await updateDoc(userDoc(BILLS_COLLECTION,b.docId),{paid:true,paidAt:Date.now(),paidDate:matchedStage?.datePaid||new Date().toISOString().slice(0,10)});
            addLog(`  ✓ ${b.payee||b.docId.slice(0,8)}: marked paid`,'ok'); fixed++;
          } catch(e){addLog(`  ✗ ${e.message}`,'err');}
        }
      }

      // ── FIX 4: Bills with gstPct but missing gstAmount/totalAmount fields ──
      addLog('');
      addLog('🔧 Fix 4: Bills missing gstAmount / totalAmount fields');
      for (const b of bills) {
        if (b.gstAmount!==undefined&&b.totalAmount) { skipped++; continue; }
        if (!b.gstPct) { skipped++; continue; }
        const base=Number(b.amount||0);
        const gstAmt=Math.round(base*parseFloat(b.gstPct)/100);
        const updates={};
        if (b.gstAmount===undefined) updates.gstAmount=gstAmt;
        if (!b.totalAmount) updates.totalAmount=base+gstAmt;
        if (Object.keys(updates).length>0) {
          try { await updateDoc(userDoc(BILLS_COLLECTION,b.docId),updates); addLog(`  ✓ ${b.payee||b.docId.slice(0,8)}: added gstAmount=${gstAmt}`,'ok'); fixed++; }
          catch(e){addLog(`  ✗ ${e.message}`,'err');}
        }
      }

      // ── FIX 5: Advances — fix balanceAmount ──
      addLog('');
      addLog('🔧 Fix 5: Advances — correct balanceAmount');
      for (const a of advances) {
        const adj=Number(a.adjustedAmount||0);
        const amt=Number(a.amount||0);
        const correctBalance=Math.max(0,amt-adj);
        const correctStatus=adj===0?'Unadjusted':correctBalance<=0?'Fully Adjusted':'Partially Adjusted';
        const updates={};
        if (Math.abs(Number(a.balanceAmount||0)-correctBalance)>1) updates.balanceAmount=correctBalance;
        if (a.status!==correctStatus) updates.status=correctStatus;
        if (Object.keys(updates).length>0) {
          try { await updateDoc(userDoc(ADVANCES_COLLECTION,a.docId),updates); addLog(`  ✓ Advance ${a.docId.slice(0,8)}: balance=${correctBalance}, status=${correctStatus}`,'ok'); fixed++; }
          catch(e){addLog(`  ✗ ${e.message}`,'err');}
        } else { skipped++; }
      }

      // ── FIX 6: Payment schedule stages — correct stale % vs amount ──
      addLog('');
      addLog('🔧 Fix 6: Payment schedules — correct stage % to match amount');
      for (const [col, docs] of [[BILLS_COLLECTION,bills],[PO_COLLECTION,pos],[WO_COLLECTION,wos]]) {
        for (const d of docs) {
          const sched = d.paymentSchedule||[];
          if (!sched.length) continue;
          const baseAmt = Number(d.amount||0);
          if (!baseAmt) continue;
          let changed = false;
          const newSched = sched.map(s => {
            const correctPct = String(Math.round(Number(s.amount||0)/baseAmt*100));
            if (String(s.pct||'') !== correctPct) { changed = true; return {...s, pct: correctPct}; }
            return s;
          });
          if (changed) {
            try { await updateDoc(userDoc(col,d.docId),{paymentSchedule:newSched}); addLog(`  ✓ ${d.payee||d.vendorName||d.docId.slice(0,8)}: stage % corrected`,'ok'); fixed++; }
            catch(e){addLog(`  ✗ ${e.message}`,'err');}
          } else { skipped++; }
        }
      }

      addLog('');
      addLog(`✅ Complete! Fixed ${fixed} records, ${skipped} already correct.`,'ok');
      setDone(true);

    } catch(e) {
      addLog('✗ Fatal error: '+e.message,'err');
    } finally {
      setRunning(false);
    }
  }

  return (
    <div className="card">
      <div className="card-header">
        <span className="card-title">🔧 Data Fix</span>
        <span style={{fontSize:12,color:'var(--text-muted)'}}>Repairs all historical data to match current sync rules</span>
      </div>
      <div className="card-body">
        <div style={{marginBottom:12,padding:'10px 14px',background:'var(--grey-50)',borderRadius:6,fontSize:12,color:'var(--text-secondary)'}}>
          Fixes applied:
          <ol style={{paddingLeft:18,marginTop:6,lineHeight:2.2}}>
            <li>PO/WO paid stages → creates missing Advance/Bill entries, corrects amounts</li>
            <li>Advance→Bill links → writes correct <code>advanceDeducted</code>, fixes <code>adjustedAmount</code></li>
            <li>fromSchedule bills → marks as Paid if linked PO stage is paid</li>
            <li>Bills missing <code>gstAmount</code>/<code>totalAmount</code> → calculates and stores them</li>
            <li>Advances → corrects <code>balanceAmount</code> and <code>status</code></li>
            <li>Payment schedule stages (Bills/PO/WO) → recalculates stale <code>%</code> to match the actual amount</li>
          </ol>
        </div>
        <button className="btn btn-primary" onClick={runFixAll} disabled={running}
          style={{background:done?'var(--green)':'var(--secondary)',marginBottom:14,minWidth:160}}>
          {running?'⏳ Running…':done?'✅ Done — Run Again':'🔧 Run Fix All'}
        </button>
        {log.length>0&&(
          <div style={{background:'#0F172A',borderRadius:6,padding:'12px 14px',maxHeight:360,overflowY:'auto',fontFamily:'monospace',fontSize:11,lineHeight:1.7}}>
            {log.map((l,i)=>(
              <div key={i} style={{color:l.type==='ok'?'#34D399':l.type==='err'?'#F87171':l.type==='warn'?'#FCD34D':'#94A3B8'}}>
                {l.msg}
              </div>
            ))}
            {running&&<div style={{color:'#60A5FA',animation:'pulse 1s infinite'}}>⏳ Working…</div>}
          </div>
        )}
      </div>
    </div>
  );
}

    await saveProjects(newNames, newColors);

function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  async function handleLogin() {
    if (!email.trim() || !password) return;
    setLoading(true); setError('');
    try {
      const { auth, signInWithEmailAndPassword, db, doc, onSnapshot } = window.fb;
      const cred = await signInWithEmailAndPassword(auth, email.trim(), password);
      const uid = cred.user.uid;
      // Fetch profile from Firestore
      const userRef = doc(db, uid, uid);
      const snap = await new Promise((res,rej) => {
        const unsub = onSnapshot(userRef, s => { unsub(); res(s); }, rej);
      });
      let profile;
      if (snap.exists()) {
        const d = snap.data();
        const name = d.name || d.Name || cred.user.email;
        const role = d.role || d.Role || 'viewer';
        profile = { uid, name, email: cred.user.email, initials: d.initials||(name[0]||'U').toUpperCase(), role };
      } else {
        profile = { uid, name: cred.user.email, email: cred.user.email, initials: cred.user.email[0].toUpperCase(), role: 'owner' };
      }
      window.currentUser = profile;
      onLogin(profile);
    } catch(e) {
      console.error('Login error:', e);
      if (e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found') setError('Incorrect email or password.');
      else if (e.code==='auth/invalid-email') setError('Please enter a valid email address.');
      else if (e.code==='auth/too-many-requests') setError('Too many attempts. Please wait and try again.');
      else setError('Sign in failed. Check your connection and try again.');
    } finally { setLoading(false); }
  }

  return (
    <div style={{minHeight:'100vh',background:'var(--primary-dark)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-sans)'}}>
      <div style={{background:'var(--surface)',borderRadius:12,width:380,boxShadow:'0 8px 40px rgba(0,0,0,.3)',overflow:'hidden'}}>

          <div style={{fontSize:36,marginBottom:10}}>💧</div>
          <div style={{fontWeight:800,fontSize:18,color:'#fff',letterSpacing:.3}}>Nirmaan Watertech</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.65)',marginTop:4}}>Internal Workflow Platform</div>
        </div>
        <div style={{padding:'28px 28px 24px'}}>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:11.5,fontWeight:600,color:'var(--text-secondary)',display:'block',marginBottom:5}}>Email Address</label>
            <input type="email" value={email} onChange={e=>{setEmail(e.target.value);setError('');}}
              onKeyDown={e=>e.key==='Enter'&&handleLogin()} placeholder="you@nirmaanwatertech.com" autoFocus
              style={{width:'100%',padding:'10px 12px',border:`1px solid ${error?'var(--red)':'var(--border)'}`,borderRadius:6,fontSize:13,outline:'none',boxSizing:'border-box'}} />
          </div>
          <div style={{marginBottom:20}}>
            <label style={{fontSize:11.5,fontWeight:600,color:'var(--text-secondary)',display:'block',marginBottom:5}}>Password</label>
            <input type="password" value={password} onChange={e=>{setPassword(e.target.value);setError('');}}
              onKeyDown={e=>e.key==='Enter'&&handleLogin()} placeholder="Your password"
              style={{width:'100%',padding:'10px 12px',border:`1px solid ${error?'var(--red)':'var(--border)'}`,borderRadius:6,fontSize:13,outline:'none',boxSizing:'border-box'}} />
          </div>
          {error && <div style={{background:'#FFEBEE',border:'1px solid #FFCDD2',borderRadius:6,padding:'8px 12px',fontSize:12,color:'var(--red)',marginBottom:16}}>{error}</div>}
          <button onClick={handleLogin} disabled={loading||!email.trim()||!password}
            style={{width:'100%',background:loading||!email.trim()||!password?'#90CAF9':'var(--primary)',color:'#fff',border:'none',borderRadius:6,padding:'11px',fontWeight:700,fontSize:13,cursor:'pointer'}}>
            {loading?'Signing in…':'Sign In'}
          </button>
          <div style={{fontSize:11,color:'var(--text-muted)',textAlign:'center',marginTop:16}}>Nirmaan Watertech Solutions · Mulund West, Mumbai</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true); // true while checking session
  const [active, setActiveState] = useState(() => sessionStorage.getItem('nw_active') || 'dashboard');
  function setActive(page) {
    sessionStorage.setItem('nw_active', page);
    setActiveState(page);
  }
  const today = new Date().toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short', year:'numeric' });

  // Listen for Firebase Auth state — persists across page reloads
  useEffect(() => {
    function startAuthListener() {
      const { auth, onAuthStateChanged, db, doc, getDoc, onSnapshot } = window.fb;
      const unsub = onAuthStateChanged(auth, async (firebaseUser) => {
        if (firebaseUser) {
          const uid = firebaseUser.uid;

          function buildProfile(data, fallbackName) {
            const name = data?.name || data?.Name || fallbackName || firebaseUser.email;
            const role = data?.role || data?.Role || 'owner';
            return {
              uid, name, email: firebaseUser.email,
              initials: data?.initials || name[0].toUpperCase(),
              role
            };
          }

          function applyProfile(profile) {
            window.currentUser = profile;
            setCurrentUser(profile);
            setAuthLoading(false);
            window.dispatchEvent(new CustomEvent('user-ready', { detail: { uid } }));
          }

          // Try path 1: doc(db, uid, uid) — collection named UID, doc named UID
          const userRef = doc(db, uid, uid);
          const profileUnsub = onSnapshot(userRef, (snap) => {
            if (snap.exists()) {
              applyProfile(buildProfile(snap.data()));
            } else {
              // Try path 2: doc(db, 'users', uid)
              getDoc(doc(db, 'users', uid)).then(snap2 => {
                if (snap2.exists()) {
                  applyProfile(buildProfile(snap2.data()));
                } else {
                  // No profile found — use email but default role to owner
                  applyProfile(buildProfile(null));
                }
              }).catch(() => applyProfile(buildProfile(null)));
            }
          }, () => applyProfile(buildProfile(null)));
          return profileUnsub;
        } else {
          // Not signed in
          window.currentUser = null;
          setCurrentUser(null);
          setAuthLoading(false);
        }
      });
      return unsub;
    }

    if (window.fb) {
      const unsub = startAuthListener();
      return () => unsub && unsub();
    } else {
      let unsub;
      const handler = () => { unsub = startAuthListener(); };
      window.addEventListener('firebase-ready', handler, { once: true });
      return () => { window.removeEventListener('firebase-ready', handler); if (unsub) unsub(); };
    }
  }, []);

  async function handleLogout() {
    try {
      const { auth, signOut } = window.fb;
      await signOut(auth);
      window.currentUser = null;
      setCurrentUser(null);
      setActive('dashboard');
    } catch(e) {
      console.error('Logout error:', e);
    }
  }

  // Show loading spinner while checking auth state
  if (authLoading) {
    return (
      <div style={{minHeight:'100vh',background:'var(--primary-dark)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
        <div style={{fontSize:36}}>💧</div>
        <div style={{color:'rgba(255,255,255,.7)',fontSize:13}}>Loading Nirmaan Watertech…</div>
      </div>
    );
  }

  // Show login screen if not authenticated
  if (!currentUser) {
    return <LoginScreen onLogin={(user) => { setCurrentUser(user); }} />;
  }

  return (
    <div className="app">
      {/* Sidebar */}
      <div className="sidebar">
        <div className="sidebar-header">
          <div className="sidebar-logo">💧 Nirmaan Watertech Solutions</div>
          <div className="sidebar-sub">Internal Workflow Platform</div>
        </div>
        {NAV.map((item, i) => {
          if (item.section) return <div className="sidebar-section" key={i}>{item.section}</div>;
          return (
            <div className={`nav-item ${active===item.id?'active':''}`} key={item.id} onClick={()=>setActive(item.id)}>
              <span className="icon">{item.icon}</span>
              <span>{item.label}</span>
              {item.badge && <span className="nav-badge">{item.badge}</span>}
            </div>
          );
        })}

        {/* User info at bottom of sidebar */}
        <div style={{marginTop:'auto',padding:'12px 10px',borderTop:'1px solid rgba(255,255,255,.10)'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 6px',borderRadius:8,cursor:'pointer'}} onClick={handleLogout} title="Click to sign out">
            <div style={{width:30,height:30,borderRadius:'50%',background:'rgba(255,255,255,.15)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,flexShrink:0}}>
              {currentUser.initials}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:600,color:'#fff',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                {currentUser.name.includes('@')
                  ? currentUser.name.split('@')[0].charAt(0).toUpperCase()+currentUser.name.split('@')[0].slice(1)
                  : currentUser.name.charAt(0).toUpperCase()+currentUser.name.slice(1)}
              </div>
              <div style={{fontSize:10,color:'rgba(255,255,255,.5)',textTransform:'capitalize'}}>{currentUser.role.replace('_',' ')} · Sign out</div>
            </div>
          </div>
        </div>
      </div>

      {/* Main area */}
      <div className="main">
        <div className="topbar">
          <div className="topbar-title">{TITLES[active]||'Dashboard'}</div>
          <div className="topbar-right">
            <span style={{fontSize:11,color:'var(--text-muted)'}}>{today}</span>
            <button className="icon-btn" title="Notifications">🔔</button>
            <div className="avatar" title={`${currentUser.name} — ${currentUser.role}`} onClick={handleLogout} style={{cursor:'pointer',title:'Sign out'}}>
              {currentUser.initials}
            </div>
          </div>
        </div>
        <div className="content">
          <ErrorBoundary key={active}>
            <Module id={active} setActive={setActive} currentUser={currentUser} />
          </ErrorBoundary>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
