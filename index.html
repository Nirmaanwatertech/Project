<script type="text/babel" data-presets="react">
/* @jsxRuntime classic */
const { useState, useEffect, useRef } = React;

// ─── Formatters ───────────────────────────────────────
const inr = (n) => '₹' + Math.round(Number(n)).toLocaleString('en-IN');

// Format YYYY-MM-DD → DD-MM-YYYY for display
function fmt(dateStr) {
  if (!dateStr) return '—';
  const parts = String(dateStr).split('-');
  if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
  return dateStr;
}

// ─── Firestore path helpers ────────────────────────────
// All data lives under users/{uid}/{collection} — matches where
// Firestore Console placed it when collections were created inside the user doc.
// These helpers resolve the correct path for every read/write operation.

function getUserUID() {
  if (window.fb?.auth?.currentUser?.uid) return window.fb.auth.currentUser.uid;
  return window.currentUser?.uid || null;
}

// Data is at ROOT level in Firestore — not under users/{uid}
// userCol and userDoc simply reference root collections directly
function userCol(colName) {
  const { db, collection } = window.fb;
  return collection(db, colName);
}

function userDoc(colName, docId) {
  const { db, doc } = window.fb;
  return doc(db, colName, docId);
}

// ─── Projects ─────────────────────────────────────────
const PROJECTS = ['Pontoon', 'WTP', 'Both'];
const PROJECT_COLOR = { 'Pontoon': 'blue', 'WTP': 'teal', 'Both': 'grey' };

// ─── Configurable Lists ───────────────────────────────
const DEFAULT_LISTS = {
  employees:      ['Neer','Manav','Vikram Singh','Amardeep Singh','Pritesh','Hardik','Kushan'],
  pettyCategories:['Auto / Fuel','Tea & Snacks','Courier','Stationery','Site Travel','Minor Hardware','Telephone / Recharge','Printing','Bank Charges','Miscellaneous'],
  billCategories: ['Vendor','Fixed','Professional','Utilities','Logistics','GST/Govt'],
  expenseCategories: ['Office Rent','Salaries','Professional Fees','Bank Charges','Software / Subscriptions','Travel & Accommodation','Utilities','Equipment Purchase','Maintenance','Miscellaneous'],
  paymentModes:   ['NEFT','RTGS','Cheque','Cash','UPI','Other'],
  capitalTypes:   ['Investor Fund','Bank Loan','Overdraft','Owner Capital Injection','Grant','Other'],
  reqCategories:  ['Materials','Services','Both'],
  reqPriorities:  ['Urgent','Normal','Low'],
};

window.appLists = { ...DEFAULT_LISTS };

function useLists() {
  const [lists, setLists] = useState(window.appLists);
  useEffect(() => {
    function start() {
      const { db, doc, onSnapshot } = window.fb;
      const unsub = onSnapshot(doc(db, 'settings', 'lists'), snap => {
        if (snap.exists()) {
          const merged = { ...DEFAULT_LISTS, ...snap.data() };
          window.appLists = merged;
          setLists(merged);
        }
      }, err => console.error('Lists listener', err));
      return unsub;
    }
    if (window.fb) { const u = start(); return () => u && u(); }
    let u; const h = () => { u = start(); };
    window.addEventListener('firebase-ready', h, { once: true });
    return () => { window.removeEventListener('firebase-ready', h); if (u) u(); };
  }, []);
  return lists;
}

async function saveLists(newLists, oldLists) {
  const { db, doc, setDoc, getDocs, writeBatch } = window.fb;

  await setDoc(doc(db, 'settings', 'lists'), newLists, { merge: true });
  window.appLists = { ...window.appLists, ...newLists };

  if (!oldLists) return 0;

  const FIELD_MAP = {
    paymentModes:      [{ col:'bills', field:'paymentMode' }, { col:'advances', field:'paymentMode' }, { col:'expenses', field:'paymentMode' }, { col:'capital_loans', field:'paymentMode' }],
    pettyCategories:   [{ col:'petty_cash', field:'category' }],
    billCategories:    [{ col:'bills', field:'category' }],
    expenseCategories: [{ col:'expenses', field:'category' }],
    employees:         [{ col:'petty_cash', field:'paidBy' }, { col:'expenses', field:'paidBy' }],
    capitalTypes:      [{ col:'capital_loans', field:'type' }],
  };

  let totalMigrated = 0;
  const listKeys = Object.keys(FIELD_MAP);

  for (let ki = 0; ki < listKeys.length; ki++) {
    const listKey = listKeys[ki];
    const targets = FIELD_MAP[listKey];
    const oldItems = oldLists[listKey] || [];
    const newItems = newLists[listKey] || [];
    const renames = {};

    if (oldItems.length === newItems.length) {
      oldItems.forEach((oldVal, i) => { if (oldVal !== newItems[i]) renames[oldVal] = newItems[i]; });
    } else {
      const removed = oldItems.filter(v => !newItems.includes(v));
      const added   = newItems.filter(v => !oldItems.includes(v));
      removed.forEach((v, i) => { if (added[i]) renames[v] = added[i]; });
    }

    if (!Object.keys(renames).length) continue;

    for (let ti = 0; ti < targets.length; ti++) {
      const { col, field } = targets[ti];
      try {
        const snap = await getDocs(userCol(col));
        const toUpdate = snap.docs.filter(d => renames[d.data()[field]]);
        if (!toUpdate.length) continue;
        for (let i = 0; i < toUpdate.length; i += 500) {
          const batch = writeBatch(db);
          toUpdate.slice(i, i + 500).forEach(d => batch.update(d.ref, { [field]: renames[d.data()[field]] }));
          await batch.commit();
          totalMigrated += Math.min(500, toUpdate.length - i);
        }
      } catch(e) { console.warn('Migration skipped for', col, field, e.message); }
    }
  }
  return totalMigrated;
}

function ListsManager() {
  const lists = useLists();
  const [localLists, setLocalLists] = useState(null);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [savedMsg, setSavedMsg] = useState('✓ Saved');
  const [dragging, setDragging] = useState(null);
  const [dragTarget, setDragTarget] = useState(null);
  const [editingItem, setEditingItem] = useState(null); // { listKey, idx }
  const [editValue, setEditValue] = useState('');
  const [newItems, setNewItems] = useState({});

  useEffect(() => { setLocalLists({ ...lists }); }, [JSON.stringify(lists)]);

  if (!localLists) return <div style={{padding:16,color:'var(--text-muted)',fontSize:12}}>Loading lists…</div>;

  function removeItem(listKey, idx) {
    setLocalLists(l => ({ ...l, [listKey]: l[listKey].filter((_,i) => i !== idx) }));
  }

  function addItem(listKey) {
    const val = (newItems[listKey] || '').trim();
    if (!val) return;
    if (localLists[listKey].map(s=>s.toLowerCase()).includes(val.toLowerCase())) return;
    setLocalLists(l => ({ ...l, [listKey]: [...l[listKey], val] }));
    setNewItems(n => ({ ...n, [listKey]: '' }));
  }

  function startEdit(listKey, idx) {
    setEditingItem({ listKey, idx });
    setEditValue(localLists[listKey][idx]);
  }

  function commitEdit() {
    if (!editingItem) return;
    const val = editValue.trim();
    if (val) {
      setLocalLists(l => ({
        ...l,
        [editingItem.listKey]: l[editingItem.listKey].map((item, i) =>
          i === editingItem.idx ? val : item
        )
      }));
    }
    setEditingItem(null);
    setEditValue('');
  }

  function onDragStart(listKey, idx) { setDragging({ listKey, idx }); }
  function onDragEnter(listKey, idx) { setDragTarget({ listKey, idx }); }
  function onDragEnd(listKey) {
    if (!dragging || !dragTarget) { setDragging(null); setDragTarget(null); return; }
    if (dragging.listKey !== listKey || dragging.idx === dragTarget.idx) { setDragging(null); setDragTarget(null); return; }
    setLocalLists(l => {
      const arr = [...l[listKey]];
      const [moved] = arr.splice(dragging.idx, 1);
      arr.splice(dragTarget.idx, 0, moved);
      return { ...l, [listKey]: arr };
    });
    setDragging(null); setDragTarget(null);
  }

  async function handleSave() {
    setSaving(true);
    try {
      const migrated = await saveLists(localLists, lists);
      setSaved(true);
      if (migrated > 0) {
        setTimeout(() => setSaved(false), 4000);
        setSavedMsg(`✓ Saved · ${migrated} existing entr${migrated===1?'y':'ies'} updated`);
      } else {
        setSavedMsg('✓ Saved');
        setTimeout(() => setSaved(false), 2000);
      }
    }
    catch(e) { console.error(e); alert('Could not save.'); }
    finally { setSaving(false); }
  }

  const SECTIONS = [
    { key: 'employees',         label: '👷 Employees',                desc: 'Petty Cash paid-by' },
    { key: 'pettyCategories',   label: '💰 Petty Cash Categories',    desc: 'Petty Cash entry category' },
    { key: 'billCategories',    label: '📑 Bill Categories',          desc: 'Bill Payments category' },
    { key: 'expenseCategories', label: '🏦 General Expense Categories', desc: 'General Expenses category' },
    { key: 'paymentModes',      label: '💳 Payment Modes',            desc: 'Advances · Receipts · Capital & Loans' },
    { key: 'capitalTypes',      label: '🏦 Capital / Loan Types',     desc: 'Capital & Loans type selector' },
  ];

  return (
    <div className="card">
      <div className="card-header" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span className="card-title">Lists Manager</span>
        <button className="btn btn-sm btn-primary" onClick={handleSave} disabled={saving}>
          {saving ? 'Saving & migrating…' : saved ? savedMsg : 'Save All Changes'}
        </button>
      </div>
      <div className="card-body">
        <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:16}}>
          ☰ drag to reorder · ✏ click name to rename · × to remove · Enter to add
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          {SECTIONS.map(sec => (
            <div key={sec.key} style={{border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
              <div style={{background:'var(--grey-50)',padding:'8px 12px',borderBottom:'1px solid var(--border)'}}>
                <div style={{fontWeight:700,fontSize:12.5}}>{sec.label}</div>
                <div style={{fontSize:10.5,color:'var(--text-muted)',marginTop:1}}>{sec.desc}</div>
              </div>
              <div style={{padding:'8px 12px'}}>
                <div style={{marginBottom:8}}>
                  {localLists[sec.key].length === 0 && (
                    <div style={{fontSize:11.5,color:'var(--text-muted)',padding:'6px 0'}}>No items — add one below.</div>
                  )}
                  {localLists[sec.key].map((item, idx) => {
                    const isEditing = editingItem?.listKey === sec.key && editingItem?.idx === idx;
                    return (
                      <div key={idx} draggable={!isEditing}
                        onDragStart={() => !isEditing && onDragStart(sec.key, idx)}
                        onDragEnter={() => !isEditing && onDragEnter(sec.key, idx)}
                        onDragEnd={() => !isEditing && onDragEnd(sec.key)}
                        onDragOver={e => e.preventDefault()}
                        style={{display:'flex',alignItems:'center',gap:6,padding:'4px 2px',
                          borderBottom:'1px solid var(--grey-50)',borderRadius:4,
                          background: dragging?.listKey===sec.key&&dragging?.idx===idx?'var(--primary-50)':
                                      dragTarget?.listKey===sec.key&&dragTarget?.idx===idx?'var(--grey-50)':'',
                          opacity: dragging?.listKey===sec.key&&dragging?.idx===idx?0.5:1}}>
                        {/* Drag handle */}
                        <span style={{color:'var(--text-muted)',fontSize:12,cursor:'grab',flexShrink:0}}>☰</span>
                        {/* Name — click to edit */}
                        {isEditing ? (
                          <input
                            className="form-input"
                            style={{fontSize:12,padding:'3px 6px',flex:1}}
                            value={editValue}

  );
}

// Aggregates all vendor/payee names from every collection for autocomplete
function useKnownNames() {
  const [names, setNames] = useState({ vendors:[], payees:[], clients:[] });

  useEffect(() => {
    function start() {
      const { db, collection, getDocs } = window.fb;
      async function load() {
        try {
          const [bills, advances, pos, wos, quotes, petty, capital, exps] = await Promise.all([
            getDocs(userCol('bills')),
            getDocs(userCol('advances')),
            getDocs(userCol('purchaseorders')),
            getDocs(userCol('workorders')),
            getDocs(userCol('quotations')),
            getDocs(userCol('petty_cash')),
            getDocs(userCol('capital_loans')),
            getDocs(userCol('expenses')),
          ]);

          const vendorNames = [
            ...pos.docs.map(d=>d.data().vendorName),
            ...wos.docs.map(d=>d.data().vendorName),
            ...quotes.docs.map(d=>d.data().vendorName),
            ...advances.docs.map(d=>d.data().vendor),
            ...exps.docs.map(d=>d.data().vendor),
          ].filter(Boolean);

          const payeeNames = [
            ...bills.docs.map(d=>d.data().payee),
            ...advances.docs.map(d=>d.data().vendor),
            ...petty.docs.map(d=>d.data().paidBy),
            ...exps.docs.map(d=>d.data().vendor),
          ].filter(Boolean);

          const clientNames = [].filter(Boolean);

          const capitalSources = capital.docs.map(d=>d.data().source).filter(Boolean);

          setNames({
            vendors: [...new Set(vendorNames)].sort(),
            payees:  [...new Set(payeeNames)].sort(),
            clients: [...new Set(clientNames)].sort(),
            capital: [...new Set(capitalSources)].sort(),
          });
        } catch(e) { console.error('useKnownNames error', e); }
      }
      load();
    }
    if (window.fb) start();
    else window.addEventListener('firebase-ready', start, { once: true });
  }, []);

  return names;
}

// ─── Reusable Components ──────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  componentDidCatch(e, info) { console.error('Module error:', e, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{padding:32,textAlign:'center'}}>
          <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
          <div style={{fontWeight:700,fontSize:14,color:'var(--red)',marginBottom:8}}>Something went wrong in this module</div>
          <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:16,fontFamily:'var(--font-mono)'}}>{this.state.error.message}</div>
          <button className="btn btn-primary" onClick={()=>this.setState({error:null})}>Try Again</button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ─── Autocomplete Input ───────────────────────────────
// Reusable: shows dropdown of past values as you type
// suggestions = array of strings from existing Firestore data
function AutocompleteInput({ value, onChange, suggestions, placeholder, className, style }) {
  const [open, setOpen] = useState(false);
  const [filtered, setFiltered] = useState([]);
  const ref = useRef(null);

  useEffect(() => {
    function handleClick(e) {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', handleClick);
    return () => document.removeEventListener('mousedown', handleClick);
  }, []);

  function handleChange(e) {
    const val = e.target.value;
    onChange(val);
    if (val.trim().length > 0) {
      const q = val.toLowerCase();
      const matches = [...new Set(suggestions.filter(s => s && s.toLowerCase().includes(q) && s.toLowerCase() !== q))].slice(0, 8);
      setFiltered(matches);
      setOpen(matches.length > 0);
    } else {
      // Show all suggestions when field is focused but empty
      const all = [...new Set(suggestions.filter(Boolean))].slice(0, 8);
      setFiltered(all);
      setOpen(all.length > 0);
    }
  }

  function handleFocus() {
    if (!value || value.trim() === '') {
      const all = [...new Set(suggestions.filter(Boolean))].slice(0, 8);
      setFiltered(all);
      setOpen(all.length > 0);
    }
  }

  function handleSelect(s) {
    onChange(s);
    setOpen(false);
  }

  return (
    <div ref={ref} style={{position:'relative'}}>
      <input
        className={className || 'form-input'}
        style={style}
        value={value}
        onChange={handleChange}
        onFocus={handleFocus}
        placeholder={placeholder}
        autoComplete="off"
      />
      {open && filtered.length > 0 && (
        <div style={{
          position:'absolute', top:'100%', left:0, right:0, zIndex:2000,
          background:'var(--surface)', border:'1px solid var(--border)',
          borderRadius:'0 0 6px 6px', boxShadow:'0 4px 12px rgba(0,0,0,.12)',
          maxHeight:200, overflowY:'auto'
        }}>
          {filtered.map((s, i) => (
            <div key={i} onMouseDown={() => handleSelect(s)}
              style={{padding:'7px 12px', fontSize:12.5, cursor:'pointer', borderTop: i>0?'1px solid var(--grey-50)':'none',
                display:'flex', alignItems:'center', gap:8}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--primary-50)'}
              onMouseLeave={e=>e.currentTarget.style.background=''}>
              <span style={{color:'var(--text-muted)',fontSize:11}}>↩</span>
              {s}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

      else if (item.scope==='milestones')    await clearAllMilestones();

  }

  return (
    <div style={{background:'var(--surface)',border:'1px solid #FFCDD2',borderRadius:8,padding:'14px 16px'}}>
      <div style={{fontWeight:600,fontSize:12.5,marginBottom:4}}>{item.label}</div>
      <div style={{fontSize:11.5,color:'var(--text-muted)',marginBottom:10}}>{item.desc}</div>
      {cleared && <div style={{fontSize:11.5,color:'var(--green)',marginBottom:8}}>✓ Cleared</div>}
      {!isWired ? (
        <span style={{fontSize:11,color:'var(--text-muted)'}}>Coming soon</span>
      ) : step===0 ? (
        <button onClick={()=>setStep(1)} className="btn btn-sm" style={{background:'#FFEBEE',color:'var(--red)',border:'1px solid #FFCDD2'}}>Clear →</button>
      ) : (
        <div>
          <div style={{fontSize:11.5,color:'var(--red)',marginBottom:6}}>Type DELETE to confirm:</div>
          <div style={{display:'flex',gap:6}}>
            <input className="form-input font-mono" style={{fontSize:12,width:100}} value={typed}
              onChange={e=>setTyped(e.target.value.toUpperCase())} placeholder="DELETE" />
            <button onClick={handleClear} disabled={typed!=='DELETE'||working}
              style={{background:typed==='DELETE'?'var(--red)':'#BDBDBD',color:'#fff',border:'none',borderRadius:4,padding:'6px 12px',fontSize:12,cursor:'pointer'}}>
              {working?'…':'Confirm'}
            </button>
            <button onClick={()=>{setStep(0);setTyped('');}} className="btn btn-sm btn-ghost">Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Firestore helper ─────────────────────────────────
function makeCollectionHook(col, orderField, orderDir) {
  return function() {
    const [items, setItems] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    React.useEffect(() => {
      function start() {
        const { query, orderBy, onSnapshot } = window.fb;
        const q = orderField ? query(userCol(col), orderBy(orderField, orderDir||'desc')) : userCol(col);
        const unsub = onSnapshot(q,
          snap => { setItems(snap.docs.map(d=>({docId:d.id,...d.data()}))); setLoading(false); },
          err  => { console.error(col, err); setLoading(false); }
        );
        return unsub;
      }
      if (window.fb && getUserUID()) { const u=start(); return ()=>u&&u(); }
      let u;
      const h = () => { if(getUserUID()) u=start(); };
      const hu = () => { if(u) u(); if(window.fb) u=start(); };
      window.addEventListener('firebase-ready', h, {once:true});
      window.addEventListener('user-ready', hu, {once:true});
      return () => { window.removeEventListener('firebase-ready',h); window.removeEventListener('user-ready',hu); if(u)u(); };
    }, []);
    return {items, loading};
  };
}

// ─── Core sync: PO/WO stage ↔ Advance & Bill ──────────
const SYNC_VERSION = 'v3.2-' + '20260803';
async function syncStageToModules(stage, parentDoc, parentType, updatedSchedule, setScheduleParent, paymentDate) {
  const { addDoc, deleteDoc, updateDoc, getDocs } = window.fb;
  const sType     = (stage.stageType || 'Against Delivery').trim();
  const isAdvance = sType === 'Advance';
  const col       = isAdvance ? ADVANCES_COLLECTION : BILLS_COLLECTION;
  const paidDate  = paymentDate || stage.datePaid || stage.date || new Date().toISOString().slice(0,10);
  const refNo     = parentType === 'po' ? (parentDoc.po||'') : (parentDoc.wo||'');
  const parentCol = parentType === 'po' ? PO_COLLECTION : WO_COLLECTION;

  console.log(`[SYNC ${SYNC_VERSION}] stage="${sType}" paid=${stage.paid} target=${col} refNo="${refNo}" docId="${parentDoc.docId}" linkedEntryId="${stage.linkedEntryId||'none'}"`);

  if (!parentDoc.docId) {
    console.error('[SYNC] ABORT: parentDoc.docId missing', parentDoc);
    alert('PO/WO record ID missing — please close and reopen the schedule.');
    return;
  }

  if (stage.paid) {
    const stageAmt = Number(stage.amount) || 0;
    const gstAmt   = stage.includesGst ? Number(stage.gstAmount||0) : 0;
    const fullBase = Number(parentDoc.value || 0);

    // Find unadjusted advance from same PO/WO
    let advEntryId = '', advAmt = 0;
    if (!isAdvance) {
      try {
        const snap = await getDocs(userCol(ADVANCES_COLLECTION));
        const found = snap.docs.find(d => {
          const a = d.data();
          return a.fromSchedule && (a.linkedPO===refNo||a.linkedWO===refNo) && a.status!=='Fully Adjusted';
        });
        if (found) { advEntryId = found.id; advAmt = Number(found.data().balanceAmount||found.data().amount||0); }
      } catch(e) { console.warn('advance lookup:', e.message); }
    }

    const entryData = isAdvance ? {
      vendor: parentDoc.vendorName||'', amount: stageAmt, datePaid: paidDate,
      paymentMode: 'NEFT', refNumber: '', narration: `Advance — ${refNo}`,
      linkedPO: parentType==='po'?refNo:'', linkedWO: parentType==='wo'?refNo:'',
      project: parentDoc.project||'', split: parentDoc.split||{pontoon:50,wtp:50},
      status: 'Unadjusted', balanceAmount: stageAmt, adjustedAmount: 0, fromSchedule: true,
    } : {
      payee: parentDoc.vendorName||'', category: 'Vendor',
      invoiceNo: stage.invoiceNo||refNo, invoiceDate: paidDate, due: paidDate,
      amount: fullBase, gstAmount: gstAmt, totalAmount: fullBase+gstAmt,
      advanceDeducted: advAmt,
      notes: `Against Delivery — ${refNo}`,
      linkedPO: parentType==='po'?refNo:'', linkedWO: parentType==='wo'?refNo:'',
      project: parentDoc.project||'', split: parentDoc.split||{pontoon:50,wtp:50},
      gstPct: parentDoc.gstPct||'', paid: true, paidAt: Date.now(), paidDate: paidDate, fromSchedule: true,
    };

    // Update existing or create new
    let entryId = stage.linkedEntryId||'';
    if (entryId) {
      try {
        await updateDoc(userDoc(col, entryId), entryData);
        console.log(`[SYNC] Updated existing entry ${entryId} in ${col}`);
      }
      catch(e) { console.warn('[SYNC] update failed, will recreate:', e.message); entryId = ''; }
    }
    if (!entryId) {
      try {
        const ref = await addDoc(userCol(col), {...entryData, createdAt: Date.now()});
        entryId = ref.id;
        console.log(`[SYNC] ✓ Created new entry ${entryId} in ${col}`);
      } catch(e) {
        console.error('[SYNC] ✗ CREATE FAILED:', e);
        alert('Could not create ' + (isAdvance?'Advance':'Bill') + ' entry: ' + e.message);
        return;
      }
    }

    // Auto-link and adjust the advance when bill is created/updated
    if (!isAdvance && advEntryId && advAmt > 0) {
      try {
        await updateDoc(userDoc(ADVANCES_COLLECTION, advEntryId), {
          adjustedAmount: advAmt, balanceAmount: 0,
          status: 'Fully Adjusted', adjustedAgainst: entryId, linkedBill: entryId,
        });
        await updateDoc(userDoc(BILLS_COLLECTION, entryId), {linkedAdvance: advEntryId});
      } catch(e) { console.warn('advance link failed:', e.message); }
    }

    // Write linkedEntryId back to PO/WO schedule
    const newSchedule = updatedSchedule.map(s =>
      s.id===stage.id ? {...s, linkedEntryId: entryId, paid: true, datePaid: paidDate} : s
    );
    try {
      await updateDoc(userDoc(parentCol, parentDoc.docId), {paymentSchedule: newSchedule});
      if (setScheduleParent) setScheduleParent(newSchedule);
    } catch(e) { alert('Entry saved but PO update failed: ' + e.message); }

  } else {
    // UNMARK — delete entry, restore advance
    if (!stage.linkedEntryId) return;
    const entryId = stage.linkedEntryId;

    let deleted = false;
    try { await deleteDoc(userDoc(col, entryId)); deleted = true; } catch(e) {}
    if (!deleted) {
      const alt = isAdvance ? BILLS_COLLECTION : ADVANCES_COLLECTION;
      try { await deleteDoc(userDoc(alt, entryId)); } catch(e) {}
    }

    if (!isAdvance) {
      try {
        const snap = await getDocs(userCol(ADVANCES_COLLECTION));
        const toRestore = snap.docs.filter(d =>
          d.data().adjustedAgainst===entryId || d.data().linkedBill===entryId
        );
        for (let i=0;i<toRestore.length;i++) {
          const a = toRestore[i].data();
          await updateDoc(userDoc(ADVANCES_COLLECTION, toRestore[i].id), {
            status:'Unadjusted', balanceAmount:Number(a.amount||0),
            adjustedAmount:0, adjustedAgainst:'', linkedBill:'',
          });
        }
      } catch(e) { console.warn('advance restore:', e.message); }
    }

    const newSchedule = updatedSchedule.map(s =>
      s.id===stage.id ? {...s, linkedEntryId:'', paid:false, paidAt:null, datePaid:'', invoiceNo:''} : s
    );
    try {
      await updateDoc(userDoc(parentCol, parentDoc.docId), {paymentSchedule: newSchedule});
      if (setScheduleParent) setScheduleParent(newSchedule);
    } catch(e) { console.error('schedule clear failed:', e); }
  }
}

// ─── Sync PO/WO edits to linked entries ───────────────
async function syncScheduleChanges(schedule, parentDoc, parentType) {
  if (!schedule || !schedule.length) return;
  const { updateDoc, deleteDoc } = window.fb;
  for (let i = 0; i < schedule.length; i++) {
    const stage = schedule[i];
    if (!stage.linkedEntryId || !stage.paid) continue;
    const isAdvance = (stage.stageType||'Against Delivery') === 'Advance';
    const col = isAdvance ? ADVANCES_COLLECTION : BILLS_COLLECTION;
    const refNo = parentType==='po' ? (parentDoc.po||'') : (parentDoc.wo||'');
    try {
      if (isAdvance) {
        await updateDoc(userDoc(col, stage.linkedEntryId), {
          vendor: parentDoc.vendorName||'', amount: Number(stage.amount||0),
          balanceAmount: Number(stage.amount||0), project: parentDoc.project||'',
        });
      } else {
        const gstAmt = stage.includesGst ? Number(stage.gstAmount||0) : 0;
        const fullBase = Number(parentDoc.value||0);
        const upd = {
          payee: parentDoc.vendorName||'', project: parentDoc.project||'',
          due: stage.datePaid||stage.date||'', invoiceDate: stage.datePaid||stage.date||'',
          amount: fullBase, gstAmount: gstAmt, totalAmount: fullBase + gstAmt,
        };
        if (stage.invoiceNo) upd.invoiceNo = stage.invoiceNo;
        await updateDoc(userDoc(col, stage.linkedEntryId), upd);
      }
    } catch(e) { console.warn('Could not sync stage change:', e.message); }
  }
}

// ─── PaymentScheduleEditor ────────────────────────────
function PaymentScheduleEditor({ rows, setRows, totalValue, gstPct, onGstPctChange, parentDoc, parentType, onStagePaid }) {
  const baseAmt = Number(totalValue)||0;
  const gstRate = parseFloat(gstPct)||0;
  const totalGstAmt = Math.round(baseAmt * gstRate / 100);
  const [stageSaving, setStageSaving] = useState(null);
  const [payDateInputs, setPayDateInputs] = useState({});

  function addRow() {
    setRows(r=>[...r, {id:genRowId(), stageType:'Advance', pct:'', amount:'', date:'', includesGst:false, gstAmount:'', linkedEntryId:'', paid:false}]);
  }
  function removeRow(id) { setRows(r=>r.filter(x=>x.id!==id)); }
  function updateRow(id, field, value) {
    setRows(r=>r.map(x=>{
      if (x.id!==id) return x;
      const next = {...x, [field]:value};
      if (field==='pct' && baseAmt) next.amount = String(Math.round((parseFloat(value)||0)/100*baseAmt));
      if (field==='amount' && baseAmt>0) next.pct = String(Math.round((Number(value)||0)/baseAmt*100));
      if (field==='includesGst') {
        if (value && !next.gstAmount && totalGstAmt>0) next.gstAmount = String(totalGstAmt);
        if (!value) next.gstAmount = '';
      }
      return next;
    }));
  }

  async function handleTogglePaid(row) {
    if (!parentDoc || !onStagePaid) return;
    const newPaid = !row.paid;
    // Single setter that updates BOTH local rows and parent form state
    const setBoth = (newSchedule) => { setRows(newSchedule); if (onStagePaid) onStagePaid(newSchedule); };
    if (newPaid) {
      const paymentDate = payDateInputs[row.id]||'';
      if (!paymentDate) { alert('Please select a payment date.'); return; }
      if (row.stageType === 'Against Delivery' && !row.invoiceNo) { alert('Please enter an invoice number for Against Delivery.'); return; }
      setStageSaving(row.id);
      try {
        const updatedRows = rows.map(r => r.id===row.id ? {...r, paid:true, paidAt:Date.now(), datePaid:paymentDate} : r);
        setBoth(updatedRows);
        // syncStageToModules will call setBoth again with linkedEntryId included
        await syncStageToModules({...row, paid:true, invoiceNo:row.invoiceNo||''}, parentDoc, parentType, updatedRows, setBoth, paymentDate);
        setPayDateInputs(p=>({...p, [row.id]:''}));
      } catch(e) { console.error(e); alert('Error: '+e.message); }
      finally { setStageSaving(null); }
    } else {
      setStageSaving(row.id);
      try {
        const updatedRows = rows.map(r => r.id===row.id ? {...r, paid:false, paidAt:null, datePaid:'', invoiceNo:''} : r);
        setBoth(updatedRows);
        await syncStageToModules({...row, paid:false}, parentDoc, parentType, updatedRows, setBoth, '');
      } catch(e) { console.error(e); }
      finally { setStageSaving(null); }
    }
  }

  const stageTotal = rows.reduce((s,r)=>s+(parseFloat(r.pct)||0), 0);
  const stageAmtTotal = rows.reduce((s,r)=>s+(Number(r.amount||0)), 0);

  return (
    <div className="form-group">
      <label className="form-label">Payment Schedule <span style={{color:'var(--text-muted)',fontWeight:400,fontSize:11}}>(optional)</span></label>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,padding:'8px 10px',background:'var(--grey-50)',borderRadius:6,border:'1px solid var(--border)'}}>
        <span style={{fontSize:12,fontWeight:600,color:'var(--text-secondary)',whiteSpace:'nowrap'}}>GST %</span>
        <input className="form-input font-mono" style={{width:70,fontSize:12,padding:'4px 8px'}}
          value={gstPct||''} onChange={e=>onGstPctChange&&onGstPctChange(e.target.value)} placeholder="18" />
        {gstRate>0&&baseAmt>0&&<span style={{fontSize:11,color:'var(--text-muted)'}}>
          GST = <strong style={{color:'var(--primary)'}}>{inr(totalGstAmt)}</strong> · ITC on 20th of next month
        </span>}
      </div>
      {rows.length>0&&(
        <div style={{border:'1px solid var(--border)',borderRadius:6,overflow:'hidden',marginBottom:8}}>
          <table style={{width:'100%'}}>
            <thead>
              <tr style={{background:'var(--grey-50)'}}>
                <th style={{fontSize:10,padding:'6px 8px',textAlign:'left',color:'var(--text-muted)',width:140}}>Type</th>
                <th style={{fontSize:10,padding:'6px 8px',color:'var(--text-muted)',width:55}}>%</th>
                <th style={{fontSize:10,padding:'6px 8px',color:'var(--text-muted)',width:120}}>Amount (₹)</th>

function POWOScheduleModal({ doc, parentType, onClose }) {
  const [stages, setStages] = useState((doc.paymentSchedule||[]).map(s=>({...s})));
  const [saving, setSaving] = useState(null);
  const [payDates, setPayDates] = useState({});
  const [invoiceNos, setInvoiceNos] = useState({});

  const paidAmt   = stages.filter(s=>s.paid).reduce((s,r)=>s+Number(r.amount||0)+(r.includesGst?Number(r.gstAmount||0):0), 0);
  const unpaidAmt = stages.filter(s=>!s.paid).reduce((s,r)=>s+Number(r.amount||0)+(r.includesGst?Number(r.gstAmount||0):0), 0);

  async function toggleStage(stage) {
    const newPaid = !stage.paid;
    if (newPaid) {
      if (!payDates[stage.id]) { alert('Please select a payment date.'); return; }
      if (stage.stageType==='Against Delivery' && !invoiceNos[stage.id]) { alert('Invoice number is required for Against Delivery.'); return; }
      setSaving(stage.id);
      try {
        const stageWithInvoice = {...stage, paid:true, paidAt:Date.now(), datePaid:payDates[stage.id], invoiceNo:invoiceNos[stage.id]||''};
        const updatedStages = stages.map(s => s.id===stage.id ? stageWithInvoice : s);
        setStages(updatedStages);
        await syncStageToModules(stageWithInvoice, doc, parentType, updatedStages, setStages, payDates[stage.id]);
        setPayDates(p=>({...p,[stage.id]:''}));
        setInvoiceNos(p=>({...p,[stage.id]:''}));
      } catch(e) { console.error(e); alert('Error: '+e.message); }
      finally { setSaving(null); }
    } else {
      setSaving(stage.id);
      try {
        const updatedStages = stages.map(s => s.id===stage.id ? {...s, paid:false, paidAt:null, datePaid:'', invoiceNo:''} : s);
        setStages(updatedStages);
        await syncStageToModules({...stage, paid:false}, doc, parentType, updatedStages, setStages, '');
      } catch(e) { console.error(e); alert('Error: '+e.message); }
      finally { setSaving(null); }
    }

          <div style={{fontSize:11,color:'rgba(255,255,255,.7)',marginTop:2}}>Advance → Advance Payments · Against Delivery → Bills & Invoices (with invoice#) · auto-adjusts advance</div>

              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:600,textTransform:'uppercase'}}>Paid</div>
              <div className="amount" style={{fontSize:16,fontWeight:700,color:'var(--green)'}}>{inr(paidAmt)}</div>
            </div>
            <div style={{flex:1,padding:'10px 14px',background:'#FFF7ED',borderRadius:6,border:'1px solid var(--amber)'}}>
              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:600,textTransform:'uppercase'}}>Remaining</div>
              <div className="amount" style={{fontSize:16,fontWeight:700,color:'var(--amber)'}}>{inr(unpaidAmt)}</div>

            <div style={{flex:1,padding:'10px 14px',background:'var(--grey-50)',borderRadius:6,border:'1px solid var(--border)'}}>

          ) : stages.map(s=>(

// ─── Manual entry → PO/WO stage link ─────────────────
async function syncManualEntryToPOWO(entryId, entryType, linkedPO, linkedWO, amount, date) {
  const { getDocs, updateDoc } = window.fb;
  const isAdvance = entryType === 'advance';
  let parentDoc = null, parentCol = null, parentId = null;
  if (linkedPO) {
    const snap = await getDocs(userCol(PO_COLLECTION));
    const match = snap.docs.find(d => d.data().po === linkedPO);
    if (match) { parentDoc = match.data(); parentCol = PO_COLLECTION; parentId = match.id; }
  } else if (linkedWO) {
    const snap = await getDocs(userCol(WO_COLLECTION));
    const match = snap.docs.find(d => d.data().wo === linkedWO);
    if (match) { parentDoc = match.data(); parentCol = WO_COLLECTION; parentId = match.id; }
  }
  if (!parentDoc || !parentDoc.paymentSchedule) return;
  const targetTypes = isAdvance ? ['Advance'] : ['Against Delivery'];
  const schedule = parentDoc.paymentSchedule;
  const matchIdx = schedule.findIndex(s => targetTypes.includes(s.stageType||'Against Delivery') && !s.linkedEntryId && Math.abs(Number(s.amount||0)-amount)<1);
  if (matchIdx === -1) return;
  const newSchedule = schedule.map((s,i) => i===matchIdx ? {...s, linkedEntryId: entryId, paid:true, paidAt:Date.now()} : s);
  await updateDoc(userDoc(parentCol, parentId), {paymentSchedule: newSchedule});
}

  function addRow() {
    setRows(r=>[...r,{id:genRowId(),stageType:'Advance',pct:'',amount:'',date:'',includesGst:false,gstAmount:'',linkedEntryId:''}]);
  }
  function removeRow(id) { setRows(r=>r.filter(x=>x.id!==id)); }
  function updateRow(id,field,value) {
    setRows(r=>r.map(x=>{
      if(x.id!==id) return x;
      const next={...x,[field]:value};
      if(field==='pct'&&baseAmt) next.amount=String(Math.round((parseFloat(value)||0)/100*baseAmt));
      if(field==='amount'&&baseAmt>0) next.pct=String(Math.round((Number(value)||0)/baseAmt*100));
      if(field==='includesGst') {
        if(value && !next.gstAmount && totalGstAmt>0) next.gstAmount=String(totalGstAmt);
        if(!value) next.gstAmount='';
      }
      return next;
    }));
  }

function NewWOModal({ onClose, existing, quotations }) {
  const isEdit = !!existing;
  const knownNames = useKnownNames();
  const { items: wos } = useWorkOrders();
  const nextNumber = nextWONumber(wos.length);
  const [form, setForm] = useState(isEdit ? {
    wo: existing.wo||'', vendorName: existing.vendorName||'',
    description: existing.description||'', value: existing.value ? String(existing.value) : '',
    linkedQuotation: existing.linkedQuotation||'', stage: existing.stage||'Draft',
    issueDate: existing.issueDate||'', due: existing.due||'', notes: existing.notes||'',
    project: existing.project||'', split: existing.split||{pontoon:50,wtp:50}
  } : {
    wo: nextNumber, vendorName: '', description: '', value: '',
    linkedQuotation: '', stage: 'Draft',
    issueDate: new Date().toISOString().slice(0,10), due: '', notes: '',
    project: '', split:{pontoon:50,wtp:50}
  });
  const [schedule, setSchedule] = useState(isEdit && existing.paymentSchedule ? existing.paymentSchedule.map(r=>({...r,id:r.id||genRowId()})) : []);
  const [gstPct, setGstPct] = useState(isEdit ? (existing.gstPct||'') : '');
  const [saving, setSaving] = useState(false);
  function set(f,v){setForm(s=>({...s,[f]:v}));}

  function handleQuotationSelect(val) {
    const q = (quotations||[]).find(q=>q.docId===val);
    set('linkedQuotation',val);
    if(q) {
      setForm(s=>({...s, linkedQuotation:val, vendorName:q.vendorName||s.vendorName,
        description:s.description||q.description||'', value:s.value||(q.value?String(q.value):''),
        project:s.project||q.project||'', split:(s.project?s.split:null)||q.split||{pontoon:50,wtp:50}}));
      if((!schedule||schedule.length===0)&&q.paymentSchedule&&q.paymentSchedule.length>0)
        setSchedule(q.paymentSchedule.map(r=>({...r,id:genRowId()})));

  async function handleSave() {
    if(!form.vendorName.trim()||!form.description.trim()) return;
    setSaving(true);
    try {
      if(isEdit) {
        await updateWorkOrder(existing.docId,{...form,value:Number(form.value)||0,paymentSchedule:schedule,gstPct});
        await syncScheduleChanges(schedule, {...existing,...form,docId:existing.docId,value:Number(form.value)||0}, 'wo');
      } else {
        const { addDoc } = window.fb;
        await addDoc(userCol(WO_COLLECTION),{...form,value:Number(form.value)||0,paymentSchedule:schedule,gstPct,createdAt:Date.now()});
      }
      onClose();
    }catch(e){console.error(e);alert('Could not save.');}
    finally{setSaving(false);}

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>

        </div>
        <div style={{padding:'18px 20px'}}>

// ─── BillScheduleModal — per-stage paid tracking ──────
function BillScheduleModal({ bill, onClose, onUpdate }) {
  const [stages, setStages] = useState(() => {
    const sched = bill.paymentSchedule || [];
    // If bill is paid but has no schedule stages, create one synthetic stage
    if (sched.length === 0 && bill.paid) {
      return [{
        id: 'synthetic-0', stageType: 'Against Delivery',
        amount: String(bill.amount||0), date: bill.paidDate||bill.due||'',
        paid: true, paidAt: bill.paidAt||Date.now(), datePaid: bill.paidDate||bill.due||'',
      }];
    }
    return sched.map(s => ({...s}));
  });
  const [saving, setSaving] = useState(false);
  const [payDates, setPayDates] = useState({});

  function toggleStage(i) {
    const s = stages[i];
    if (!s.paid) {
      // Marking paid — date required
      const pd = payDates[i] || '';
      if (!pd) { alert('Please select a payment date.'); return; }
      setStages(prev => prev.map((st,idx) => idx===i ? {...st, paid:true, paidAt:Date.now(), datePaid:pd} : st));
    } else {
      // Unmarking
      setStages(prev => prev.map((st,idx) => idx===i ? {...st, paid:false, paidAt:null, datePaid:''} : st));
    }
  }

  async function handleSave() {
    setSaving(true);
    try {
      const allPaid = stages.length > 0 && stages.every(s=>s.paid);
      await onUpdate(stages, allPaid);
    } catch(e) { console.error(e); alert('Could not save.'); setSaving(false); }
  }

  const paidAmt   = stages.filter(s=>s.paid).reduce((sum,s)=>sum+Number(s.amount||0)+(s.includesGst?Number(s.gstAmount||0):0),0);
  const unpaidAmt = stages.filter(s=>!s.paid).reduce((sum,s)=>sum+Number(s.amount||0)+(s.includesGst?Number(s.gstAmount||0):0),0);
  const gstRate   = parseFloat(bill.gstPct)||0;
  const gstAmt    = Math.round(Number(bill.amount||0) * gstRate / 100);
  const gstAssigned = stages.filter(s=>s.includesGst).reduce((s,r)=>s+Number(r.gstAmount||0),0);
  const unassignedGst = Math.max(0, gstAmt - gstAssigned);
  const totalRemaining = unpaidAmt + unassignedGst;

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'var(--surface)',borderRadius:10,width:620,maxHeight:'88vh',overflowY:'auto',boxShadow:'0 8px 40px rgba(0,0,0,.22)'}} onClick={e=>e.stopPropagation()}>
        <div style={{background:'var(--primary)',padding:'14px 18px',position:'sticky',top:0,zIndex:1}}>
          <div style={{fontWeight:700,fontSize:14,color:'#fff'}}>Payment Schedule — {bill.payee}</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,.7)',marginTop:2}}>Select payment date and mark each stage as paid</div>
        </div>
        <div style={{padding:'16px 20px'}}>
          <div style={{display:'flex',gap:12,marginBottom:14}}>
            <div style={{flex:1,padding:'8px 12px',background:'#F0FFF4',borderRadius:6,border:'1px solid var(--green)'}}>
              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:600,textTransform:'uppercase'}}>Paid</div>
              <div className="amount" style={{fontSize:15,fontWeight:700,color:'var(--green)'}}>{inr(paidAmt)}</div>
            </div>
            <div style={{flex:1,padding:'8px 12px',background:'#FFF7ED',borderRadius:6,border:'1px solid var(--amber)'}}>
              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:600,textTransform:'uppercase'}}>Remaining</div>
              <div className="amount" style={{fontSize:15,fontWeight:700,color:'var(--amber)'}}>{inr(totalRemaining)}</div>
            </div>
            <div style={{flex:1,padding:'8px 12px',background:'var(--grey-50)',borderRadius:6,border:'1px solid var(--border)'}}>
              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:600,textTransform:'uppercase'}}>Bill Total</div>
              <div className="amount" style={{fontSize:15,fontWeight:700}}>{inr(bill.amount||0)}</div>
            </div>
          </div>
          {stages.map((s,i)=>(
            <div key={i} style={{border:'1px solid var(--border)',borderRadius:8,padding:'14px 16px',marginBottom:10,background:s.paid?'#F0FFF4':'var(--surface)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <span style={{fontWeight:700,fontSize:13}}>{s.stageType||s.name||`Stage ${i+1}`}</span>
                  <span className="amount" style={{fontWeight:700,fontSize:13,color:s.paid?'var(--green)':'var(--text)'}}>{inr(Number(s.amount||0)+(s.includesGst?Number(s.gstAmount||0):0))}</span>
                  {s.includesGst&&Number(s.gstAmount||0)>0&&<span style={{fontSize:11,color:'var(--primary)'}}>incl. GST {inr(s.gstAmount)}</span>}
                </div>
                {s.date&&<span style={{fontSize:11,color:'var(--text-muted)'}}>Due: {fmt(s.date)}</span>}
              </div>
              {s.paid ? (
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span className="badge green">✓ Paid — {fmt(s.datePaid)||'date not set'}</span>
                  <button className="btn btn-sm btn-ghost" style={{color:'var(--amber)',border:'1px solid var(--amber)',fontSize:11}} onClick={()=>toggleStage(i)}>↩ Unmark</button>
                </div>
              ) : (
                <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
                  <div>
                    <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:3}}>Payment Date *</div>
                    <input type="date" value={payDates[i]||''} onChange={e=>setPayDates(p=>({...p,[i]:e.target.value}))}
                      style={{fontSize:12,padding:'5px 8px',border:`1px solid ${payDates[i]?'var(--primary)':'var(--border)'}`,borderRadius:4,width:145}} />
                  </div>
                  <button className="btn btn-primary" style={{fontSize:12,padding:'6px 14px',background:'var(--green)',
                    opacity:payDates[i]?1:0.5}} onClick={()=>toggleStage(i)}>Mark Paid</button>
                </div>
              )}
            </div>
          ))}
          {gstAmt > 0 && (
            <div style={{border:'1px solid #BFDBFE',borderRadius:8,padding:'10px 14px',background:'#EFF6FF',marginBottom:10}}>
              <span style={{fontSize:12,fontWeight:600,color:'var(--primary)'}}>GST ({bill.gstPct}%) </span>
              <span className="amount" style={{fontWeight:700,color:'var(--primary)'}}>{inr(gstAmt)}</span>
              <span style={{fontSize:11,color:'var(--text-muted)',marginLeft:8}}>payable on invoice — ITC on 20th of next month</span>
            </div>
          )}
          <div style={{fontSize:11.5,color:'var(--text-muted)',background:'var(--grey-50)',padding:'8px 10px',borderRadius:4}}>
            💡 Bill is marked <strong>Paid</strong> automatically when ALL stages are marked paid.
          </div>
        </div>
        <div style={{padding:'0 20px 16px',display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave} disabled={saving}>
            {saving ? 'Saving…' : 'Save Changes'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Dashboard ────────────────────────────────────────
function Dashboard({ setActive }) {
  const { items: bills }    = useBills();
  const { items: advances } = useAdvances();
  const { items: wos }      = useWorkOrders();
  const { items: pos }      = usePurchaseOrders();
  const { items: quotes }   = useQuotations();
  const { items: receipts } = useReceipts();
  const { items: expenses } = useExpenses();
  const { items: petty }    = usePettyCash();
  const today = new Date().toISOString().slice(0,10);
  const thisMonth = today.slice(0,7);

  const overdueBills = bills.filter(b => !b.paid && b.due && b.due < today);
  const overdueAmt   = overdueBills.reduce((s,b)=>s+Number(b.amount||0),0);
  const dueTodayBills = bills.filter(b => !b.paid && b.due === today);
  const activeWOs    = wos.filter(w => w.stage==='In Progress'||w.stage==='Issued');
  const pendingQuotes = quotes.filter(q => !q.approved);
  const unadjAdv     = advances.filter(a => a.status!=='Fully Adjusted');
  const monthExpenses = [...expenses,...petty].filter(i=>(i.date||'').startsWith(thisMonth)).reduce((s,i)=>s+Number(i.amount||0),0);
  const monthReceipts = receipts.filter(r=>(r.dateReceived||'').startsWith(thisMonth)).reduce((s,r)=>s+Number(r.amountReceived||0),0);

  const alerts = [];
  if (overdueBills.length) alerts.push({type:'red', msg:`${overdueBills.length} overdue bill${overdueBills.length>1?'s':''} — ${inr(overdueAmt)} pending`});
  if (dueTodayBills.length) alerts.push({type:'amber', msg:`${dueTodayBills.length} bill${dueTodayBills.length>1?'s':''} due today`});
  if (unadjAdv.length) alerts.push({type:'amber', msg:`${unadjAdv.length} unadjusted advance${unadjAdv.length>1?'s':''} — ${inr(unadjAdv.reduce((s,a)=>s+Number(a.balanceAmount||0),0))}`});
  if (pendingQuotes.length) alerts.push({type:'blue', msg:`${pendingQuotes.length} quotation${pendingQuotes.length>1?'s':''} pending approval`});

  const quickLinks = [
    {icon:'📋',label:'Quotations',id:'quotations'},{icon:'🔧',label:'Work Orders',id:'workorders'},
    {icon:'📦',label:'Purchase Orders',id:'purchaseorders'},{icon:'📑',label:'Bill Payments',id:'billpayments'},
    {icon:'📈',label:'Cash Flow',id:'cashflow'},{icon:'📊',label:'Project P&L',id:'projectpnl'},
    {icon:'📥',label:'Receipts',id:'receipts'},{icon:'⚙',label:'Settings',id:'settings'},
  ];

  return (

  const [monthFilter, setMonthFilter] = useState('all');
  const [woSortBy, setWoSortBy] = useState('date_desc');

  const totalValue = items.reduce((s,w)=>s+Number(w.value||0),0);
  const activeCount = items.filter(w=>w.stage!=='Completed'&&w.stage!=='Cancelled').length;
  const nextNumber = nextWONumber(items.length);
  const vendors = [...new Set(items.map(w=>w.vendorName).filter(Boolean))];
  const months  = [...new Set(items.map(w=>(w.issueDate||'').slice(0,7)).filter(Boolean))].sort().reverse();

  function applySort(arr) {
    return [...arr].sort((a,b)=>{
      if(woSortBy==='date_asc')    return (a.issueDate||a.due||'').localeCompare(b.issueDate||b.due||'');

// ─── Cash Flow Chart ──────────────────────────────────
function CashFlowChart({ rows, startBalance, alertLevel }) {
  if (!rows || rows.length < 2) return null;
  const W = Math.max(700, rows.length * 30);
  const H = 220;
  const padL = 72, padR = 20, padT = 24, padB = 36;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const balances = [startBalance, ...rows.map(r=>r.balance)];
  const minB = Math.min(0, ...balances);
  const maxB = Math.max(...balances);
  const range = maxB - minB || 1;
  const xPts = rows.map((_,i) => padL + ((i+1) / rows.length) * chartW);
  const yScale = v => padT + chartH - ((v - minB) / range * chartH);
  const zeroY = yScale(0);
  const x0 = padL;
  const allX = [x0, ...xPts];
  const allY = balances.map(b => yScale(b));
  const polyPts = allX.map((x,i) => `${x},${allY[i]}`).join(' ');
  const areaD = `M${x0},${zeroY} ` + allX.map((x,i)=>`L${x},${allY[i]}`).join(' ') + ` L${allX[allX.length-1]},${zeroY} Z`;
  const yTicks = [minB, minB+range*0.25, minB+range*0.5, minB+range*0.75, maxB];
  const step = Math.max(1, Math.floor(rows.length / 8));
  const xLabels = rows.filter((_,i) => i % step === 0 || i === rows.length-1);
  return (
    <div className="card" style={{marginBottom:14}}>
      <div className="card-header">
        <span className="card-title">Cash Flow Timeline</span>
        <span style={{fontSize:11,color:'var(--text-muted)'}}>Running balance · Green = positive · Red dot = negative</span>
      </div>
      <div className="card-body" style={{overflowX:'auto',overflowY:'visible',padding:'8px 0'}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',minWidth:600,height:H}}>
          {/* Grid lines */}
          {yTicks.map((v,i)=>(
            <line key={i} x1={padL} y1={yScale(v)} x2={W-padR} y2={yScale(v)} stroke="#F3F4F6" strokeWidth={1}/>
          ))}
          {/* Alert level line */}
          {alertLevel > 0 && alertLevel >= minB && alertLevel <= maxB && (
            <line x1={padL} y1={yScale(alertLevel)} x2={W-padR} y2={yScale(alertLevel)}
              stroke="#EF4444" strokeWidth={1.5} strokeDasharray="6,3"/>
          )}
          {alertLevel > 0 && alertLevel >= minB && alertLevel <= maxB && (
            <text x={padL+4} y={yScale(alertLevel)-4} fontSize={9} fill="#EF4444">Alert: {inr(alertLevel)}</text>
          )}
          {/* Zero line */}
          <line x1={padL} y1={zeroY} x2={W-padR} y2={zeroY} stroke="#E5E7EB" strokeWidth={1.5} strokeDasharray="5,4"/>
          {/* Area fill */}
          <path d={areaD} fill="rgba(16,185,129,0.10)"/>
          {/* Line */}
          <polyline points={polyPts} fill="none" stroke="#10B981" strokeWidth={2.5} strokeLinejoin="round"/>
          {/* Dots for each transaction */}
          {rows.map((r,i)=>(
            <circle key={i} cx={xPts[i]} cy={allY[i+1]} r={4}
              fill={r.balance<0?'#EF4444':'#10B981'} stroke="white" strokeWidth={1.5}/>
          ))}
          {/* Future entries indicator */}
          {rows.some(r=>!r.isPast) && rows.some(r=>r.isPast) && xPts[rows.findIndex(r=>!r.isPast)] > 0 && (
            <line x1={xPts[rows.findIndex(r=>!r.isPast)]} y1={padT} x2={xPts[rows.findIndex(r=>!r.isPast)]} y2={H-padB} stroke="#F59E0B" strokeWidth={1.5} strokeDasharray="3,3"/>
          )}
          {/* Y axis labels */}
          {yTicks.map((v,i)=>(
            <text key={i} x={padL-6} y={yScale(v)+4} textAnchor="end" fontSize={9} fill="#9CA3AF">{inr(Math.round(v/1000))}k</text>
          ))}
          {/* X axis date labels */}
          {xLabels.map((r,i)=>{
            const idx = rows.indexOf(r);
            return <text key={i} x={xPts[idx]} y={H-4} textAnchor="middle" fontSize={8} fill="#9CA3AF">{fmt(r.date)}</text>;
          })}
          {/* Legend */}
          <circle cx={padL+8} cy={padT-8} r={4} fill="#10B981"/>
          <text x={padL+16} y={padT-4} fontSize={9} fill="#6B7280">Balance</text>
          <line x1={padL+70} y1={padT-8} x2={padL+82} y2={padT-8} stroke="#F59E0B" strokeWidth={1.5} strokeDasharray="3,3"/>
          <text x={padL+86} y={padT-4} fontSize={9} fill="#6B7280">Today</text>
        </svg>
      </div>
    </div>
  );
}

// ─── Cash Flow Module ──────────────────────────────────
function CashFlow() {
  const { items: bills }    = useBills();
  const { items: advances } = useAdvances();
  const { items: receipts } = useReceipts();
  const { items: capital }  = useCapitalLoans();
  const { items: expenses } = useExpenses();
  const { items: petty }    = usePettyCash();
  const { items: pos }      = usePurchaseOrders();
  const { items: wos }      = useWorkOrders();
  const { items: raBills }  = useRABills();
  const { settings }        = useCashSettings();
  const [editingBalance, setEditingBalance] = useState(false);
  const [balanceInput, setBalanceInput]     = useState('');
  const [alertInput, setAlertInput]         = useState('');
  const [editingAlert, setEditingAlert]     = useState(false);
  const [projectFilter, setProjectFilter]   = useState('all');

  const todayStr = new Date().toISOString().slice(0,10);
  const openingBalance = Number(settings.startingBalance)||0;
  const alertLevel     = Number(settings.alertLevel)||0;

  // Current balance = all actual money that has moved (regardless of date)
  const totalCapital   = capital.reduce((s,c)  => s + Number(c.amount||0), 0);
  const totalReceipts  = receipts.reduce((s,r) => s + Number(r.amountReceived||0), 0);
  // Only unadjusted advances — use remaining balanceAmount so partially-adjusted
  // advances aren't double-subtracted (once via the advance, again via the bill)
  const totalAdvances  = advances.filter(a => a.status !== 'Fully Adjusted').reduce((s,a) => s + Number(a.balanceAmount !== undefined ? a.balanceAmount : a.amount||0), 0);
  // Paid bills (full value) + partially-paid schedule-based bills (paid stages only)
  const totalBillsPaid = bills.reduce((s,b) => {
    let totalBillAmt;
    if (b.fromSchedule && b.gstAmount !== undefined) {
      totalBillAmt = Number(b.amount||0) + Number(b.gstAmount||0);
    } else if (b.fromSchedule) {
      totalBillAmt = Number(b.amount||0);
    } else {
      const base = Number(b.amount||0);
      const gstRate = b.gstPct ? parseFloat(b.gstPct) : 0;
      totalBillAmt = base + (gstRate > 0 ? Math.round(base * gstRate / 100) : 0);
    }
    if (b.paid) return s + totalBillAmt;
    const hasSchedule = b.paymentSchedule && b.paymentSchedule.length > 0;
    if (hasSchedule) {
      const paidStagesAmt = b.paymentSchedule.reduce((ss,st) =>
        ss + (st.paid ? Number(st.amount||0) + Number(st.includesGst ? st.gstAmount||0 : 0) : 0), 0);
      return s + paidStagesAmt;
    }
    return s;
  }, 0);
  const totalExpenses  = expenses.reduce((s,e) => s + Number(e.amount||0), 0);
  const totalPetty     = petty.reduce((s,p)   => s + (Number(p.totalAmount||0) || Number(p.amount||0)), 0);
  const totalRepayments = capital.reduce((s,c) => s + Number(c.totalRepaid||0), 0);
  const currentBalance = totalCapital + totalReceipts - totalAdvances - totalBillsPaid - totalExpenses - totalPetty - totalRepayments;

  function getITCDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const m = d.getMonth() + 1; // next month (0-based: Aug=7, so +1 = Sep=8)
    const y = m > 11 ? d.getFullYear()+1 : d.getFullYear();
    const mm = m > 11 ? 0 : m;
    return `${y}-${String(mm+1).padStart(2,'0')}-20`;
  }

  // Monthly ITC ledger: input GST only becomes a real cash-effective inflow to the
  // extent there's actual output GST liability (from RA Bills submitted) to net it
  // against that month. Unutilized credit carries forward to the next month and tries
  // again — nothing here is forecast, it only uses RA Bills that have actually been entered.
  function buildITCLedger() {
    const inputByMonth = {};
    [...pos, ...wos].forEach(doc => {
      (doc.paymentSchedule||[]).forEach(s => {
        if (s.paid && s.includesGst && Number(s.gstAmount||0)>0) {
          const d = s.datePaid||s.date||'';
          if (!d) return;
          const month = d.slice(0,7);
          inputByMonth[month] = (inputByMonth[month]||0) + Number(s.gstAmount);
        }
      });
    });
    petty.filter(p=>p.gstPct&&Number(p.gstPct)>0).forEach(p=>{
      const gstAmt = Number(p.gstAmount||0)||Math.round(Number(p.amount||0)*parseFloat(p.gstPct)/100);
      if (!p.date || gstAmt<=0) return;
      const month = p.date.slice(0,7);
      inputByMonth[month] = (inputByMonth[month]||0) + gstAmt;
    });

    const outputByMonth = {};
    raBills.forEach(rb => {
      const gstAmt = Number(rb.gstAmount||0);
      if (gstAmt>0 && rb.dateSubmitted) {
        const month = rb.dateSubmitted.slice(0,7);
        outputByMonth[month] = (outputByMonth[month]||0) + gstAmt;
      }
    });

    const allMonths = [...new Set([...Object.keys(inputByMonth), ...Object.keys(outputByMonth)])].sort();
    let carry = 0;
    const utilizedRows = [];
    allMonths.forEach(month => {
      const available = carry + (inputByMonth[month]||0);
      const liability  = outputByMonth[month]||0;
      const utilized   = Math.min(available, liability);
      carry = available - utilized;
      if (utilized > 0) {
        const [y,m] = month.split('-').map(Number);
        const nm = m===12?1:m+1, ny = m===12?y+1:y;
        const itcDate = `${ny}-${String(nm).padStart(2,'0')}-20`;
        utilizedRows.push({date: itcDate, label:`ITC Recovery (utilized — ${month})`, cat:'GST ITC Recovery', type:'in', amt: utilized, project:'', isPast: itcDate<todayStr});
      }
    });
    return { utilizedRows, pendingCredit: carry };
  }
  const { utilizedRows: itcRows, pendingCredit } = buildITCLedger();

  function scheduleRows(items, type) {
    return items.flatMap(doc => {
      const refNo = doc.po||doc.wo||'';
      const label = doc.vendorName||'';
      return (doc.paymentSchedule||[]).flatMap(s => {
        if (!s.amount) return [];
        if (s.paid) return [];
        const rows = [{date:s.date||'', label:`${refNo} — ${label} (${s.stageType||'Payment'})`, cat:type, type:'out', amt:Number(s.amount), project:doc.project||'', isPast:(s.date||'')<todayStr}];
        if (s.includesGst && Number(s.gstAmount||0)>0) {
          rows.push({date:s.date||'', label:`GST — ${label}`, cat:'GST Paid', type:'out', amt:Number(s.gstAmount), project:doc.project||'', isPast:(s.date||'')<todayStr});
        }
        return rows;
      });
    });
  }

  const allRows = [
    ...bills.filter(b=>!b.fromSchedule&&!b.paid).map(b=>({date:b.due||b.invoiceDate||'', label:b.payee, cat:'Bill', type:'out', amt:Number(b.amount||0)+(b.gstPct?Math.round(Number(b.amount||0)*parseFloat(b.gstPct)/100):0), project:b.project||'', isPast:(b.due||b.invoiceDate||'')<todayStr})),
    ...scheduleRows(pos,'Purchase Order'),
    ...scheduleRows(wos,'Work Order'),
    ...itcRows,
    ...expenses.filter(e=>!e.paid).map(e=>({date:e.date||'', label:e.description||'', cat:'General Expense', type:'out', amt:Number(e.amount||0), project:e.project||'', isPast:(e.date||'')<todayStr})),
    ...petty.map(p=>({date:p.date||'', label:p.description||'Petty Cash', cat:'Petty Cash', type:'out', amt:(Number(p.totalAmount||0)||Number(p.amount||0)), project:p.project||'', isPast:(p.date||'')<todayStr})),
    ...receipts.filter(r=>!r.received).map(r=>({date:r.dateReceived||'', label:`${r.client||'Client'} Receipt`, cat:'Client Receipt', type:'in', amt:Number(r.amountReceived||0), project:r.project||'', isPast:(r.dateReceived||'')<todayStr})),
    ...capital.map(c=>({date:c.dateReceived||'', label:`${c.type||'Capital'} — ${c.source||''}`, cat:'Capital', type:'in', amt:Number(c.amount||0), project:c.project||'', isPast:(c.dateReceived||'')<todayStr})),
  ].filter(r=>r.date&&r.amt>0).sort((a,b)=>a.date.localeCompare(b.date));

  const filtered = projectFilter==='all' ? allRows : allRows.filter(r=>r.project===projectFilter);

  // Future projection starts from current cash balance
  let running = currentBalance;
  const rows = filtered.filter(r=>!r.isPast).map(r => {
    if (r.type==='out') running -= r.amt; else running += r.amt;
    return {...r, balance: running};
  });
  const lowestFuture   = rows.length ? Math.min(...rows.map(r=>r.balance)) : currentBalance;
  const closingBalance = rows.length ? rows[rows.length-1].balance : currentBalance;
  const belowAlert     = alertLevel > 0 && (currentBalance < alertLevel || rows.some(r=>r.balance < alertLevel));

  async function saveSetting(key, value) {
    const { setDoc, doc, db } = window.fb;
    try { await setDoc(doc(db, SETTINGS_COLLECTION, SETTINGS_DOC), {...settings, [key]: Number(value)||0}, {merge:true}); }
    catch(e) { alert('Could not save: '+e.message); }
  }

  return (
    <div>
      <div className="section-header">
        <div><div className="section-title">Cash Flow</div>
          <div className="section-sub">{filtered.length} transactions · unpaid future outflows + incoming receipts</div>
        </div>
        <select className="form-input form-select" style={{width:140}} value={projectFilter} onChange={e=>setProjectFilter(e.target.value)}>
          <option value="all">All Projects</option>
          {PROJECTS.map(p=><option key={p}>{p}</option>)}
        </select>
      </div>

      {belowAlert && (
        <div style={{background:'#FEE2E2',border:'1px solid var(--red)',borderRadius:8,padding:'10px 16px',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:18}}>🚨</span>
          <span style={{fontSize:13,fontWeight:600,color:'var(--red)'}}>
            Cash balance will fall below alert level of {inr(alertLevel)} — lowest projected: {inr(lowestFuture)}
          </span>
        </div>
      )}

      {/* Summary cards */}
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:8}}>
        <div className="stat-card" style={{background:'#F0FFF4'}}>
          <div className="stat-label">Total Inflows</div>
          <div className="stat-value green">{inr(totalCapital + totalReceipts)}</div>
          <div className="stat-sub" style={{fontSize:10}}>Capital {inr(totalCapital)} · Receipts {inr(totalReceipts)}</div>
        </div>
        <div className="stat-card" style={{background:'#FEF2F2'}}>
          <div className="stat-label">Total Outflows</div>
          <div className="stat-value red">{inr(totalAdvances + totalBillsPaid + totalExpenses + totalPetty + totalRepayments)}</div>
          <div className="stat-sub" style={{fontSize:10}}>Advances (unadj.) {inr(totalAdvances)} · Bills (paid) {inr(totalBillsPaid)} · Exp {inr(totalExpenses + totalPetty)} · Repay {inr(totalRepayments)}</div>
        </div>
        <div className="stat-card" style={{background: currentBalance < 0 ? '#FEF2F2' : currentBalance < alertLevel && alertLevel > 0 ? '#FEF3C7' : '#F0FFF4', border: currentBalance < alertLevel && alertLevel > 0 ? '1px solid var(--amber)' : ''}}>
          <div className="stat-label">Current Cash Balance</div>
          <div className={`stat-value ${currentBalance < 0 ? 'red' : currentBalance < alertLevel && alertLevel > 0 ? 'amber' : 'green'}`}>{inr(currentBalance)}</div>
          <div className="stat-sub" style={{fontSize:10}}>Capital+Receipts − Unadj.Advances − Paid Bills − Expenses</div>
        </div>
      </div>
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(4,1fr)',marginBottom:14}}>
        <div className="stat-card">
          <div className="stat-label">Lowest Future Balance</div>
          <div className={`stat-value ${lowestFuture < 0 ? 'red' : lowestFuture < alertLevel && alertLevel > 0 ? 'amber' : 'blue'}`}>{inr(lowestFuture)}</div>
          <div className="stat-sub" style={{fontSize:10}}>Projected low point</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Closing Balance</div>
          <div className={`stat-value ${closingBalance >= 0 ? 'green' : 'red'}`}>{inr(closingBalance)}</div>
          <div className="stat-sub" style={{fontSize:10}}>After all future transactions</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Unutilized ITC Credit</div>
          <div className="stat-value amber">{inr(pendingCredit)}</div>
          <div className="stat-sub" style={{fontSize:10}}>Not yet netted against RA Bill GST</div>
        </div>
        <div className="stat-card" style={{background: alertLevel > 0 ? '#FFF7ED' : ''}}>
          <div className="stat-label">Alert Level 🔔</div>
          {editingAlert ? (
            <div style={{display:'flex',gap:4,marginTop:4}}>
              <input className="form-input font-mono" style={{width:100,fontSize:12}} value={alertInput}
                onChange={e=>setAlertInput(e.target.value)} autoFocus
                onKeyDown={e=>{if(e.key==='Enter'){saveSetting('alertLevel',alertInput);setEditingAlert(false);}}} />
              <button className="btn btn-sm btn-primary" onClick={()=>{saveSetting('alertLevel',alertInput);setEditingAlert(false);}}>✓</button>
            </div>
          ) : (
            <>
              <div className={`stat-value ${alertLevel > 0 ? 'amber' : ''}`}>{alertLevel > 0 ? inr(alertLevel) : '—'}</div>
              <div className="stat-sub" style={{cursor:'pointer',color:'var(--primary)',fontSize:11}} onClick={()=>{setAlertInput(String(alertLevel));setEditingAlert(true);}}>
                {alertLevel > 0 ? 'Edit threshold' : 'Set threshold'}
              </div>
            </>
          )}
        </div>
      </div>

      {/* Inflow / Outflow Breakup */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
        <div className="card">
          <div className="card-header"><span className="card-title" style={{color:'var(--green)'}}>↑ Total Inflows — {inr(totalCapital+totalReceipts)}</span></div>
          <div className="card-body" style={{padding:'10px 16px'}}>
            {[
              {label:'Capital & Loans', amt:totalCapital, icon:'🏦'},
              {label:'Client Receipts', amt:totalReceipts, icon:'📥'},
            ].map(row=>(
              <div key={row.label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--grey-50)'}}>
                <span style={{fontSize:13}}>{row.icon} {row.label}</span>
                <span className="amount" style={{fontWeight:700,color:'var(--green)',fontSize:14}}>{inr(row.amt)}</span>
              </div>
            ))}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0 0'}}>
              <span style={{fontSize:13,fontWeight:700}}>Total</span>
              <span className="amount" style={{fontWeight:700,color:'var(--green)',fontSize:15}}>{inr(totalCapital+totalReceipts)}</span>
            </div>
          </div>
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title" style={{color:'var(--red)'}}>↓ Total Outflows — {inr(totalAdvances+totalBillsPaid+totalExpenses+totalPetty+totalRepayments)}</span></div>
          <div className="card-body" style={{padding:'10px 16px'}}>
            {[
              {label:'Advance Payments (unadjusted)', amt:totalAdvances, icon:'💰'},
              {label:'Bills & Invoices (paid)', amt:totalBillsPaid, icon:'📑'},
              {label:'General Expenses',  amt:totalExpenses,  icon:'🧾'},
              {label:'Petty Cash',        amt:totalPetty,     icon:'🪙'},
              {label:'Loan Repayments',                amt:totalRepayments, icon:'🏦'},
            ].filter(r=>r.amt>0).map(row=>(
              <div key={row.label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--grey-50)'}}>
                <span style={{fontSize:13}}>{row.icon} {row.label}</span>
                <span className="amount" style={{fontWeight:700,color:'var(--red)',fontSize:14}}>{inr(row.amt)}</span>
              </div>
            ))}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0 0'}}>
              <span style={{fontSize:13,fontWeight:700}}>Total</span>
              <span className="amount" style={{fontWeight:700,color:'var(--red)',fontSize:15}}>{inr(totalAdvances+totalBillsPaid+totalExpenses+totalPetty+totalRepayments)}</span>
            </div>
          </div>
        </div>
      </div>



      {/* Chart */}
      {rows.length > 1 && <CashFlowChart rows={rows} startBalance={currentBalance} alertLevel={alertLevel} />}

      {/* Transaction table */}
      <div className="card">
        <div className="card-body" style={{paddingTop:10,paddingBottom:6}}>
          <div style={{fontSize:12,color:'var(--text-muted)'}}>
            <span style={{background:'var(--grey-50)',padding:'2px 8px',borderRadius:4,marginRight:8}}>Past (greyed)</span>
            <span style={{borderLeft:'3px solid var(--amber)',paddingLeft:6,marginRight:8}}>Future / Due</span>
            <span style={{background:'#F0FFF4',padding:'2px 8px',borderRadius:4,marginRight:8}}>Inflow</span>
            {alertLevel>0&&<span style={{background:'#FEF3C7',padding:'2px 8px',borderRadius:4}}>⚠ Below alert</span>}
          </div>
        </div>
        {filtered.length===0
          ? <div className="module-coming"><div className="big-icon">📈</div><h3>No transactions</h3><p className="text-muted">Unpaid PO stages, bills, and expected receipts appear here.</p></div>
          : (
          <table>
            <thead>
              <tr><th>Date</th><th>Description</th><th>Category</th><th>Project</th><th>Inflow</th><th>Outflow</th><th>Balance</th></tr>
            </thead>
            <tbody>
              <tr style={{background:'#F0FFF4'}}>
                <td colSpan={6} style={{fontSize:12,fontWeight:600,color:'var(--green)',padding:'6px 12px'}}>Current Cash Balance (today)</td>
                <td className="amount fw-600" style={{color:'var(--green)'}}>{inr(currentBalance)}</td>
              </tr>
              {rows.map((r,i) => {
                const belowAlertRow = alertLevel > 0 && r.balance < alertLevel;
                return (
                  <tr key={i} style={{
                    background: r.balance < 0 ? '#FEF2F2' : belowAlertRow ? '#FEF3C7' : r.type==='in' ? '#F0FFF4' : '',
                    borderLeft: !r.isPast ? '3px solid var(--amber)' : 'none',
                    opacity: r.isPast ? 0.7 : 1,
                  }}>
                    <td className="mono" style={{fontSize:11}}>{fmt(r.date)}{!r.isPast&&<span style={{fontSize:9,color:'var(--amber)',marginLeft:4}}>DUE</span>}</td>
                    <td className="fw-600" style={{fontSize:12,maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.label}</td>
                    <td><span className="badge grey" style={{fontSize:10}}>{r.cat}</span></td>
                    <td>{r.project?<span className={`badge ${PROJECT_COLOR[r.project]||'grey'}`} style={{fontSize:10}}>{r.project}</span>:'—'}</td>
                    <td className="amount" style={{color:'var(--green)',fontWeight:600}}>{r.type==='in'?`+${inr(r.amt)}`:'—'}</td>
                    <td className="amount" style={{color:'var(--red)',fontWeight:600}}>{r.type==='out'?`−${inr(r.amt)}`:'—'}</td>
                    <td className="amount fw-600" style={{color: r.balance < 0 ? 'var(--red)' : belowAlertRow ? 'var(--amber)' : 'var(--text)'}}>
                      {inr(r.balance)}
                      {belowAlertRow && r.balance >= 0 && <span style={{fontSize:9,color:'var(--amber)',marginLeft:4}}>⚠ Below alert</span>}
                      {r.balance < 0 && <span style={{fontSize:9,color:'var(--red)',marginLeft:4}}>⚠ Negative</span>}
                    </td>
                  </tr>
                );
              })}
              <tr style={{background:'var(--grey-50)',fontWeight:700}}>
                <td colSpan={4} style={{padding:'8px 12px',fontSize:12}}>Closing</td>
                <td className="amount" style={{color:'var(--green)',fontWeight:700}}>+{inr(rows.filter(r=>r.type==='in').reduce((s,r)=>s+r.amt,0))}</td>
                <td className="amount" style={{color:'var(--red)',fontWeight:700}}>−{inr(rows.filter(r=>r.type==='out').reduce((s,r)=>s+r.amt,0))}</td>
                <td className="amount fw-600" style={{color:closingBalance>=0?'var(--green)':'var(--red)'}}>{inr(closingBalance)}</td>
              </tr>
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ─── Bills Module ─────────────────────────────────────
const BILLS_COLLECTION = 'bills';
const ADVANCES_COLLECTION = 'advances';
const PAYMENT_MODES = ['NEFT','RTGS','Cheque','Cash','UPI','Other'];

// ─── Bills hooks and helpers ───────────────────────
function useBills() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    function start() {
      const { db, collection, query, orderBy, onSnapshot } = window.fb;
      const q = query(userCol(BILLS_COLLECTION), orderBy('createdAt', 'desc'));
      const unsub = onSnapshot(q, (snap) => {
        setItems(snap.docs.map(d => ({ docId: d.id, ...d.data() })));
        setLoading(false);
      }, (err) => { console.error('Bills listener error', err); setLoading(false); });
      return unsub;
    }
    if (window.fb && getUserUID()) { const unsub = start(); return () => unsub && unsub(); }
    let unsub;
    const handler = () => { if(getUserUID()) { unsub = start(); } };
    const userHandler = () => { if(unsub) unsub(); if(window.fb) unsub = start(); };
    window.addEventListener('firebase-ready', handler, { once: true });
    window.addEventListener('user-ready', userHandler, { once: true });
    return () => {
      window.removeEventListener('firebase-ready', handler);
      window.removeEventListener('user-ready', userHandler);
      if (unsub) unsub();
    };
  }, []);
  return { items, loading };
}

function useAdvances() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    function start() {
      const { db, collection, query, orderBy, onSnapshot } = window.fb;
      const q = query(userCol(ADVANCES_COLLECTION), orderBy('createdAt', 'desc'));
      const unsub = onSnapshot(q, (snap) => {
        setItems(snap.docs.map(d => ({ docId: d.id, ...d.data() })));
        setLoading(false);
      }, (err) => { console.error('Advances listener error', err); setLoading(false); });
      return unsub;
    }
    if (window.fb && getUserUID()) { const unsub = start(); return () => unsub && unsub(); }
    let unsub;
    const handler = () => { if(getUserUID()) { unsub = start(); } };
    const userHandler = () => { if(unsub) unsub(); if(window.fb) unsub = start(); };
    window.addEventListener('firebase-ready', handler, { once: true });
    window.addEventListener('user-ready', userHandler, { once: true });
    return () => {
      window.removeEventListener('firebase-ready', handler);
      window.removeEventListener('user-ready', userHandler);
      if (unsub) unsub();
    };
  }, []);
  return { items, loading };
}
